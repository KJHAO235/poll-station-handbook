<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>投開票所應變手冊</title>
<meta name="description" content="投開票所工作人員現場查詢：輸入或說出狀況，立即找到《115 年投開票所工作人員手冊》對應頁碼與原頁。">
<meta name="theme-color" content="#c42b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="投開票所手冊">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: phone-first single column — sticky ask bar on top (keyboard covers the bottom), answer card, then source pages; page viewer is a full-screen sheet. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1a2130; --muted:#5b6474; --line:#dadee5;
  --stamp:#c42b2b; --stamp-soft:#fbeaea; --chip:#eef1f5; --mark:#ffe9a8;
  --ok:#1f7a4d;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141a; --surface:#1a1f28; --ink:#e7eaf0; --muted:#9aa3b3; --line:#2b3240;
  --stamp:#ff6f66; --stamp-soft:#3a1f22; --chip:#242b37; --mark:#5c4a12; --ok:#5fd39a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#1a1f28; --ink:#e7eaf0; --muted:#9aa3b3; --line:#2b3240;
  --stamp:#ff6f66; --stamp-soft:#3a1f22; --chip:#242b37; --mark:#5c4a12; --ok:#5fd39a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.seal{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-weight:800;font-size:15px;line-height:1}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400;letter-spacing:0}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:17px;line-height:1.45;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:48px;max-height:140px}
.ask textarea:focus{outline:none;border-color:var(--stamp)}
.btn{font:inherit;border:0;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.go{flex:none;height:48px;padding:0 18px;background:var(--stamp);color:#fff;font-weight:700;font-size:17px}
.go:disabled{opacity:.5}
.mic{flex:none;width:48px;height:48px;background:var(--chip);color:var(--ink);display:grid;place-items:center}
.mic.on{background:var(--stamp);color:#fff}
.mic svg{width:22px;height:22px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
main .wrap{padding-block:14px 48px;display:flex;flex-direction:column;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.chip:active{background:var(--chip)}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.answer{border-top:4px solid var(--stamp)}
.answer .q{font-weight:700;font-size:15px;color:var(--muted);margin:0 0 8px}
.answer .body{font-size:16.5px}
.answer .body h3{font-size:15px;margin:14px 0 4px;color:var(--stamp);letter-spacing:.04em}
.answer .body h3:first-child{margin-top:0}
.answer .body ol,.answer .body ul{margin:4px 0;padding-left:1.4em}
.answer .body li{margin:3px 0}
.answer .body p{margin:6px 0}
.thinking{color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--stamp);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.pg{display:inline-flex;align-items:center;gap:2px;font:600 13px var(--f-num);padding:1px 7px;margin:0 2px;border-radius:6px;border:1.5px solid var(--stamp);color:var(--stamp);background:var(--stamp-soft);cursor:pointer;vertical-align:1px;white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ghost{background:var(--chip);color:var(--ink);padding:9px 14px;font-size:14px;font-weight:600}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.err{color:var(--stamp)}
.hits{display:flex;flex-direction:column;gap:8px}
.qa{border-top:4px solid var(--stamp)}
.qa-tag{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ok);margin:0 0 4px}
.qa h2{font-size:19px;line-height:1.4;margin:0 0 6px;text-wrap:balance}
.qa h3{font-size:14px;margin:14px 0 4px;color:var(--stamp);letter-spacing:.06em}
.qa ol,.qa ul{margin:4px 0;padding-left:1.4em}
.qa li{margin:4px 0;font-size:16.5px}
.qa .basis li{font-size:14.5px;color:var(--muted);list-style:none;margin-left:-1.4em}
.qa .basis li .pg{margin-right:6px}
.qa .rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.alts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.alts .chip{font-size:13.5px;padding:6px 11px}
.review-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rv[data-s="ok"]{border-left:5px solid var(--ok)}
.rv[data-s="fix"]{border-left:5px solid var(--stamp)}
.rv summary{font-weight:700;font-size:15.5px;cursor:pointer;color:var(--ink)}
.rv summary small{font:600 12px var(--f-num);color:var(--muted);margin-right:6px}
.rv-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rv-acts button{font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.rv-acts button[aria-pressed="true"].ok{background:var(--ok);border-color:var(--ok);color:#fff}
.rv-acts button[aria-pressed="true"].fix{background:var(--stamp);border-color:var(--stamp);color:#fff}
.rv textarea{width:100%;margin-top:8px;font:inherit;font-size:14.5px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:60px}
.cat{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:14px 0 6px}
.hit{display:grid;grid-template-columns:56px 1fr;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);cursor:pointer;font:inherit}
.hit .no{font:700 20px/1 var(--f-num);color:var(--stamp);display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.hit .no span{font:500 11px var(--f-body);color:var(--muted)}
.hit .sec{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.hit .snip{font-size:14.5px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;border-radius:2px}
.hist{display:flex;flex-direction:column;gap:2px}
.hist button{font:inherit;font-size:14.5px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;color:var(--ink);cursor:pointer}
.empty{color:var(--muted);font-size:14px}
.foot{font-size:12px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:12px}
#offline{color:var(--ok);font-weight:600}
.psg{padding:10px 0;border-bottom:1px dashed var(--line)}
.psg:last-child{border-bottom:0}
.psg-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:4px;flex-wrap:wrap}
.psg p{margin:0;font-size:16px;line-height:1.7}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.toc button{font:inherit;font-size:13.5px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.toc b{font:600 12px var(--f-num);color:var(--stamp);white-space:nowrap}
details summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600}
/* page sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.sheet-head{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-head .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.sheet-title{flex:1;min-width:0}
.sheet-title b{font:700 18px var(--f-num);color:var(--stamp)}
.sheet-title div{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq{width:42px;height:42px;background:var(--chip);color:var(--ink);font-size:20px;font-weight:700;display:grid;place-items:center}
.sheet-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-body .wrap{padding-block:12px calc(24px + env(safe-area-inset-bottom,0px))}
.pageimg{display:block;width:100%;max-width:100%;background:#fff;border-radius:6px;border:1px solid var(--line)}
.pagetxt{white-space:pre-wrap;font-size:16px;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:8px;font-size:14px;font-weight:600;background:var(--chip);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
</style>

</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand">
      <div class="seal" aria-hidden="true">選</div>
      <h1>投開票所應變手冊<small>《115 年投開票所工作人員手冊》快速查頁</small></h1>
    </div>
    <form class="ask" id="askForm" autocomplete="off">
      <textarea id="q" rows="1" enterkeyhint="search" placeholder="說出或輸入現場狀況"></textarea>
      <button class="btn mic" id="mic" type="button" hidden aria-label="語音輸入"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="btn go" id="go" type="submit">查詢</button>
    </form>
    <p class="hint" id="hint">語音：點輸入框後，按 iPhone 鍵盤右下角的麥克風說話，說完按「查詢」。</p>
  </div>
</header>

<main>
  <div class="wrap">
    <section id="qaBox" hidden></section>
    <section id="answerBox" hidden></section>
    <section id="hitsBox" hidden>
      <p class="label">其他相關頁（點開看原頁）</p>
      <div class="hits" id="hits"></div>
    </section>
    <section id="startBox">
      <p class="label">常見現場狀況</p>
      <div class="chips" id="chips"></div>
    </section>
    <section id="histBox" hidden>
      <p class="label">最近查詢</p>
      <div class="hist" id="hist"></div>
    </section>
    <section id="reviewBox" hidden></section>
    <section id="tocBox">
      <details>
        <summary>手冊目錄（直接翻頁）</summary>
        <div class="toc" id="toc" style="margin-top:10px"></div>
      </details>
      <p class="note"><a href="#review" style="color:var(--stamp);font-weight:600">審閱預先整理的問答庫</a>：逐題核對答案與手冊原頁。</p>
    </section>
    <footer class="foot"><span id="offline">第一次開啟後會自動下載全部頁面，之後沒有網路也能用。</span><br><span id="semStatus"></span><br>資料來源：中央選舉委員會《115 年地方公職人員選舉及全國性公民投票投開票所工作人員手冊》（115 年 9 月）。本站僅供查詢，實際規定以中選會及所屬選舉委員會為準。<br>iPhone：在 Safari 按「分享 → 加入主畫面」即可當 App 使用。</footer>
  </div>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetNo">
  <div class="sheet-head"><div class="wrap">
    <button class="btn sq" id="prev" aria-label="上一頁">‹</button>
    <div class="sheet-title"><b id="sheetNo"></b><div id="sheetSec"></div></div>
    <button class="btn sq" id="next" aria-label="下一頁">›</button>
    <button class="btn sq" id="close" aria-label="關閉">✕</button>
  </div></div>
  <div class="sheet-body" id="sheetBody"><div class="wrap">
    <div class="seg"><button class="btn" id="vImg" aria-pressed="true">原頁圖片</button><button class="btn" id="vTxt" aria-pressed="false">文字版</button></div>
    <img class="pageimg" id="pimg" alt="">
    <div class="pagetxt" id="ptxt" hidden></div>
  </div></div>
</div>

<script>
const PAGES = [{"p": 1, "t": "壹、總則\n一、投票所及開票所（以下簡稱投開票所）工作人員，係指各\n投開票所主任管理員、主任監察員、管理員、監察員及警\n衛人員。\n二、投開票所工作人員，執行職務應絕對守法、守時、公正、\n負責盡職。\n三、投開票所管理員及警衛人員、監察員，應分別受主任管理\n員、主任監察員之指揮監督。\n四、投開票所工作人員，應參加選舉委員會舉辦之講習，接受\n有關法令及工作方法之講習。\n五、投開票所工作人員，應於投票開始前半小時到達指定之投\n開票所執行職務，並於工作人員簽到簿簽到，在投票、開\n票未完畢前，非經主任管理員或主任監察員允准，不得離\n去，開票完畢後應辦理簽退後，始得離開。\n六、主任管理員或主任監察員因故未能按時到達投開票所者，\n應分別由到達之管理員或監察員互推 1 人暫行代理。\n七、投開票所工作人員執行職務時，應佩帶選舉委員會製發之\n證件。投票所除選舉人或投票權人及其照顧之 6 歲以下兒\n童、因身心障礙不能自行圈投而能表示其意思者之家屬或\n陪同之人外，非佩帶各級選舉委員會製發證件之人員，不\n得進入。但檢察官依法執行職務者，不在此限。\n八、投 票 起 止 標 準 時 間 ， 應 以 中 華 電 信 公 司 電 話 報 時 臺\n（117）所播報標準時間為準。\n九、投開票所工作人員，不得利用職權干預或暗示選舉人或投\n票權人，不行使投票權或為一定之行使。"}, {"p": 2, "t": "十、投開票所工作人員，應以和藹態度為選舉人或投票權人服\n務或答覆選舉人或投票權人之詢問，不得與選舉人或投票\n權人作職務以外之交談。\n十一、投開票所工作人員，不得刺探或窺視選舉人或投票權人\n投票內容。\n十二、投開票所工作人員，不得穿戴或標示政黨、政治團體、\n候選人之旗幟、徽章、物品或服飾，亦不得穿著佩帶具\n有公民投票相關文字、符號或圖像之貼紙、服飾或其他\n物品於投開票所執行職務。\n十三、投開票所工作人員，應遵守規定，不得爭吵、滋生事\n端，妨害投開票所秩序。\n十四、投開票所工作人員，不得無故拒絕依規定應行會同辦理\n或蓋章之事項。\n十五、投開票所工作人員，如對執行職務有關事項發生爭執\n時，應由主任管理員會同主任監察員商洽處理。其情節\n重大者，應即報請直轄市、縣（市）選舉委員會處理，\n但各該工作人員應仍照常執行職務，不得稍有怠忽。\n十六、投開票所工作人員，擅離職守或有其他違法行為，經查\n明屬實者，除依法處理外，由直轄市、縣（市）選舉委\n員會立即免除其職務，另行派員接替。\n十七、115 年地方公職人員選舉與全國性公民投票同日於同一\n投票所舉行投票，選舉人或投票權人應一次進入投票所\n投票，離開投票所後不得再次進入投票所投票。"}, {"p": 3, "t": "貳、投票及開票作業程序\n一、投票日前 1 日之作業：\n（一）領取投開票所所需物品。\n（二）點領選舉票及公投票。\n（三）檢查投開票所門窗、電線線路開關等及取下時鐘，投\n票所內有鏡子，或原裝設監視錄影設備，應予以移除\n或將攝影鏡頭遮蔽。\n（四）紙票匭底部加貼封條。\n（五）佈置投票所。\n（六）關閉投票所。\n二、投票日之作業：\n（一）投票：\n１、工作人員報到。\n２、分配職務。\n３、一次點交選舉票及公投票，發交選舉人名冊及投票權\n人名冊。\n４、投票開始前對時。\n５、投票開始時，宣布開始投票。\n６、說明優先投票措施。\n７、直轄市辦理優化原住民選舉人領票作業之投票所，說\n明優化原住民選舉人領票作業。\n８、公開查驗投票匭及加封。\n９、選舉人或投票權人領票、圈票、投票。\n１０、投票時間截止時，宣布投票時間截止。\n１１、投票時間截止前到達投票所之選舉人或投票權人繼\n續領票、圈票、投票。"}, {"p": 4, "t": "１２、選舉人及投票權人全部投完票後封鎖投票匭。\n１３、清點選舉人名冊、投票權人名冊領票人數及用餘票\n數，填寫投（開）票報告表投票部分。\n１４、包封用餘票及選舉人名冊、投票權人名冊。\n（二）開票：\n１、將投票所改設開票所。\n２、佈置開票所。\n３、分配職務。\n４、宣布開始開票並宣布領票人數，先開選舉票，次開公\n投票。\n５、查驗投票匭及開封。\n６、檢票、唱票、記票、整票計票。\n７、每一投票匭開票完畢，向參觀席參觀民眾展示空票\n匭。\n８、選舉票或公投票全部開完後，核對各候選人得票數以\n及全國性公民投票案同意或不同意票數。\n９、填寫投（開）票報告表開票部分。\n１０、宣布開票結果，張貼投（開）票報告表。\n１１、將第 1 份投（開）票報告表裝入快遞封袋（參考格\n式如附錄十一），指派專人速送鄉（鎮、市、區）\n選務作業中心。\n１２、包封有效票、無效票、已領未投票、記票紙及投票\n通知單。\n１３、交付投（開）票報告表副本。\n１４、整理場地回復原狀，檢查有無投開票物品遺漏。\n１５、工作人員簽退。\n１６、將選舉票及公投票等護送至鄉（鎮、市、區）選務\n作業中心。"}, {"p": 5, "t": "參、投票所及開票所之佈置\n一、投票所之佈置，應由鄉（鎮、市、區）選務作業中心督導\n投開票所主任管理員、主任監察員及部分工作人員，依規\n定之圖例負責佈置，於投票日前佈置完竣。（圖例見附錄\n一）\n二、投開票所門口應張貼投開票所銜稱「○○市（縣）115 年\n地方公職人員選舉及全國性公民投票第○○投開票所」。\n三、投開票所附近之交通路口或轉彎處應製貼明顯醒目之指路\n標誌，如「第○○○投（開）票所由此進」，張貼「選舉\n票有效票與無效票之認定圖例」、「公投票有效票與無效\n票之認定圖例」以及於投票所 30 公尺處張貼「投票所 30\n公尺標示線」海報標示之。\n四、投票所入口處與出口處要分別設置，避免選舉人或投票權\n人出入時交叉進行，便於維持秩序，本次選舉與全國性公\n民投票進行程序，採「領、領、投」方式辦理，內部佈置\n應按選舉票領票處、公投票領票處、圈票處、投票處之順\n序設置，在選舉票領票處、公投票領票處之正前方應多留\n空間，以備選舉人或投票權人排隊領票。\n五、直轄市辦理優化原住民選舉人領票作業之投票所，原住民\n選舉票領票處原則與一般選舉人領票處合併設置，並張貼\n「原住民選舉票領票處」標示。\n六、投票所入口處應備置手機放置籃，並張貼「進入投開票所\n注意事項」及「優先投票措施」海報，內容如下：\n（一）進入投開票所注意事項：\n１、不得攜帶行動電話或具攝影功能之器材進入投票所，\n但已關閉電源之行動裝置，不在此限。\n２、禁止窺視刺探投票秘密。"}, {"p": 6, "t": "３、圈選後不得將圈選內容出示他人。\n４、將選舉票或公投票以外之物投入票匭，或故意撕毀選\n舉票或公投票，處新臺幣 5 千元以上 5 萬元以下罰\n鍰。\n５、攜出選舉票或公投票者，處 1 年以下有期徒刑、拘役\n或科新臺幣 1 萬 5 千元以下罰金。\n６、選舉人或投票權人應 1 次進入投票所投票，離開投票\n所後不得再次進入投票所投票。\n（二）優先投票措施：\n請禮讓行動不便、乘坐輪椅、年長者、孕婦及其他不\n適久站的選舉人或投票權人優先投票。\n七、投票所之領票處，得視投票所選舉人人數或投票權人人數\n及空間情形事先佈置妥當。如已備妥無障礙坡道或斜角，\n應檢查是否已確實設置於投票所出入口。\n八、投票所應設置適合乘坐輪椅選舉人或投票權人使用之圈票\n處遮屏，以方便其投票。\n九、圈票用之圈選工具，由直轄市、縣（市）選舉委員會依規\n定式樣統一製備，並應備紅色快乾打印台及厚墊，供選舉\n人或投票權人圈選選舉票或公投票之用，直轄市、縣\n（市）選舉委員會將圈選工具發交鄉（鎮、市、區）選務\n作業中心，鄉（鎮、市、區）選務作業中心發交投開票所\n主任管理員時，選舉委員會、選務作業中心及投開票所主\n任管理員應確實檢查圈選工具是否符合規定式樣，如與規\n定不符應即時予以更換，並應確實檢查打印台油墨，如有\n太濃或太淡之情形應予以更換。\n十、投票所之圈票處遮屏缺口朝外（朝向投開票所工作人\n員），圈票處遮屏內側中間張貼「請用圈選工具『 』圈\n蓋選票，選票『蓋章』或『按指印』，無效。」之標示，"}, {"p": 7, "t": "以避免選舉人或投票權人誤用印章圈蓋選舉票或公投票，\n致造成選舉票或公投票無效之情事。\n十一、直轄市、市之投票所以設置 1 個市長選舉票匭、1 個市\n議員選舉票匭、1 個里長選舉票匭、1 個公投票匭為原\n則，直轄市山地原住民區之投票所另增設 1 個區民代表\n選舉票匭及 1 個區長選舉票匭。縣之投票所以設置 1 個\n縣長選舉票匭、1 個縣議員選舉票匭、1 個鄉（鎮、市）\n長選舉票匭、1 個鄉（鎮、市）民代表選舉票匭、1 個村\n（里）長選舉票匭、1 個公投票匭為原則。投票匭應黏\n貼與選舉票、公投票顏色一致且顯目之選舉種類、公投\n案案別識別貼紙。\n十二、為利身心障礙選舉人或投票權人圈投選舉票或公投票，\n投票所內之圈票處遮屏、投票匭擺放位置，應考量身心\n障礙選舉人或投票權人之需求與便利性進行設置。其中\n投票匭之擺放，投票匭上緣距離地板面高度不得大於 85\n公分，投票口深度不得大於 25 公分。\n十三、投票處應於投票匭旁之適當位置設置座椅，管理員原則\n應坐於座椅上執行職務，嚴防選舉人或投票權人攜出選\n舉票或公投票等情事。\n十四、投票所於投票完畢後，應即改為開票所，佈置開票所\n時，不得關閉門窗，並應依規定設置參觀席，以備民眾\n入場參觀開票。開票時應當眾逐張檢票、唱票，非開票\n完畢，開票所門窗不得關閉。開票所應依規定之圖例佈\n置。（圖例見附錄二）\n十五、開票所應張貼「開票作業程序表」及「開票期間民眾攝\n影注意事項」海報，內容如下：\n（一）「開票作業程序表」：\n１、宣布開始開票、宣讀開票作業程序及宣布領票人"}, {"p": 8, "t": "數。\n２、查驗投票匭及開封。\n３、逐張檢票、唱票、記票。\n４、每一投票匭開票完畢，向參觀民眾展示空票匭。\n５、整票計票並核對記票紙。\n６、填寫投（開）票報告表。\n７、宣布開票結果，張貼投（開）票報告表。\n（二）「開票期間民眾攝影注意事項」：\n開票期間民眾攝影不得有下列行為：\n１、使用閃光燈、補光燈或其他光源。\n２、攝影民眾或其所持有之器材越過參觀席。\n３、攝影器材阻擋其他觀看開票民眾視線。\n４、以言語、手勢等方式，指揮、干擾或中斷開票作\n業。\n５、針對特定開票所工作人員進行拍攝。\n十六、開票時應將投票匭置於中央，面向參觀席，左右放置桌\n椅，以便放置選舉票或公投票，並應留檢票、唱票、監\n票人員站立位置。開票處與參觀席應用桌椅等隔離，避\n免民眾進入，高度不能妨礙參觀人員視線。\n十七、記票用紙，應貼在開票所內堂正面投票匭後方顯明處之\n牆壁或板架上，其間應留記票員站立位置，至檢票、唱\n票、監票等人員，應站在投票匭之旁邊，以免阻擋參觀\n人員之視線，使參觀人員均能清楚看到記票情形。\n十八、佈置開票所時，應注意另備之板架擺設是否妥當，並避\n免滑落，以免發生選舉人、投票權人或投開票所工作人\n員安全情事。"}, {"p": 9, "t": "十九、為利身心障礙選舉人或投票權人觀看開票過程，開票所\n工作人員如發現有身心障礙選舉人或投票權人在場時，\n應主動將其安排在容易觀看開票之位置。\n二十、投票所及開票所應用物品。（詳見附錄三）。"}, {"p": 10, "t": "肆、投票作業與職務分配\n一、主任管理員之職務：\n（一）點領選舉票、公投票及投開票所所需物品：\n１、投開票所主任管理員應會同主任監察員於投票日前 1\n日，按照鄉（鎮、市、區）選務作業中心通知時間，\n前往指定地點點領選舉票、公投票及投開票所所需物\n品。\n２、主任管理員及主任監察員依據投票所選舉票數量表領\n得選舉票及投（開）票報告表後，當場核對下列事\n項：\n（１）選舉人名冊選舉人統計數與冊內各類選舉人\n數是否相符。\n（２）投票所選舉票數量表所載選舉票數量，是否\n與選舉人名冊統計各類選舉人數相符。\n（３）選舉票與選舉公報各欄內容是否相符。\n（４） 投（開 ）票報 告表與 選舉公 報之候 選人號\n次、姓名是否相符。\n上述事項核對完畢無誤後，主任管理員應於執\n行任務確認表確依規定辦理欄內簽署己「姓」。\n３、主任管理員及主任監察員依據投票所公投票數量表領\n得公投票及投（開）票報告表後，當場核對下列事\n項：\n（１）投票權人名冊投票權人統計數與冊內投票權\n人數是否相符。\n（２）投票所公投票數量表所載公投票數量，是否\n與投票權人名冊統計投票權人數相符。"}, {"p": 11, "t": "上述事項核對完畢無誤後，主任管理員應於執\n行任務確認表確依規定辦理欄內簽署己「姓」。\n４、核對後即用牛皮紙或紙箱包封妥當，於封口處共同加\n蓋主任管理員及主任監察員印章，交由鄉（鎮、市、\n區）選務作業中心統一保管，但情況特殊，經鄉\n（鎮、市、區）選務作業中心認有必要時，可交由投\n票所主任管理員攜回妥善保管，並於投票日會同警衛\n人員攜往投票所使用。\n５、依投開票所主任管理員執行任務確認表逐項檢查確實\n辦理各項工作，並確認圈票處遮屏設置數量是否符合\n規定，即每一投票所以設置 6 個遮屏（至少含 1 個身\n障用遮屏），並預留備用遮屏為原則，於辦理完成之\n辦理事項欄內簽署己「姓」。\n６、檢查圈選工具兩端均未破損，確可使用。\n（二）佈置投票所：投票日前 1 日主任管理員應會同主任監\n察員及部分工作人員，依投票所佈置之有關規定，將\n投票所佈置完妥。\n（三）辦理工作人員報到及分發工作證件：投開票所工作\n人員，應於投票開始前半小時到達指定之投開票所執\n行職務，由主任管理員負責工作人員簽到，並分發工\n作證（格式見附錄四）。如有因故未能到場執行職務\n者，主任管理員應即通報鄉（鎮、市、區）選務作業\n中心儘速派員遞補。\n（四）分配管理員職務：\n１、查驗國民身分證管理員。\n２、領票處管理員。\n３、圈票處管理員。\n４、投票處管理員。"}, {"p": 12, "t": "前項工作人員，由主任管理員視人力多寡分配之。\n主任管理員並得視投票所選舉人人數或投票權人人數及\n工作人員多寡，採分鄰分組方式設置領票處，分 2 組領\n票時，每一組均以分設選舉票領票處及公投票領票處為\n原則，以達到分流效果。\n直轄市辦理優化原住民選舉人領票作業之投票所，\n主任管理員得視投票所原住民選舉人人數及工作人員多\n寡，彈性分配原住民引導管理員、原住民領票處管理員\n職務。\n主任管理員得視實際需要，彈性調度 1 名管理員至\n投票所外協助優先投票、維持排隊秩序。遇有選舉人或\n投票權人照顧之 6 歲以下兒童進入投票所時，亦得彈性\n調度 1 名管理員予以協助。\n（五）點交選舉票及公投票：投票開始前會同主任監察員\n將選舉票及公投票當眾啟封，一次點交領票處之發票\n管理員。\n（六）發交選舉人名冊及投票權人名冊：主任管理員於投\n票開始前，依發票管理員所負責之選舉票或公投票發\n票工作，分別發交選舉人名冊或投票權人名冊。\n（七）對時及宣布開始投票：主任管理員應會同主任監察員\n於投票開始前，告知各工作人員對準其所帶之手錶時\n間，以資一致，並於 8 點整宣布開始投票。\n（八）說明優先投票措施：請選舉人或投票權人禮讓行動不\n便、乘坐輪椅、年長者、孕婦及其他不適久站之選舉\n人或投票權人優先進入投票所投票。\n（九）直轄市辦理優化原住民選舉人領票作業之投票所，說\n明優化原住民選舉人領票作業：「本次地方公職人員\n選舉，本市辦理優化原住民選舉人領票作業，投票所"}, {"p": 13, "t": "設有原住民選舉票領票處，原住民選舉人到達投票所\n時，請出示投票通知單，將由工作人員引導至原住民\n選舉票領票處領票。」\n（十）啟驗投票匭：投票所投票匭，應於宣布開始投票後，\n由主任管理員會同主任監察員公開查驗後加封，查驗\n時應向民眾及監察員展示空票匭，以及紙票匭底部所\n加貼之封條。展示紙票匭時，應將底部紙板取出，展\n示後再裝回。\n（十一）督導投票作業之進行：主任管理員應督飭各管理員\n工作情形，並隨時處理各種突發狀況。\n１、發現冒名領票：冒領選舉票或公投票經當場發現，主\n任管理員應會同主任監察員，請警衛人員將該選舉人\n或投票權人予以留置，聯絡警察單位派員處理，另通\n報直轄市、縣（市）選舉委員會監察小組。\n２、選舉票或公投票被冒領：選舉人或投票權人本人前來\n投票時，發現選舉票或公投票已被冒領，經查明其確\n未投票，應准予領票，並由主任管理員會同主任監察\n員通報直轄市、縣（市）選舉委員會監察小組，並作\n下列之處理：\n（１）由領票處管理員在選舉人名冊或投票權人名冊備\n註欄註記「曾被冒領，准予領票」外，該選舉人\n或投票權人並應於備註欄簽名、蓋章或按指印。\n（２）統計票時，應列入發出票數計算，並應於投\n（開）票報告表「其他有關事項」欄加以註記\n「某某人選舉票（或公投票）被冒領，依規定准\n予領票」。（69 年 11 月 13 日中選一字第 1794 號\n函、69 年 11 月 22 日中選一字第 2212 號函）\n３、撕毀選舉票或公投票："}, {"p": 14, "t": "（１）發現選舉人或投票權人將領取之選舉票或公投票\n撕毀，主任管理員應會同主任監察員，請警衛人\n員將該選舉人或投票權人予以留置，另通報直轄\n市、縣（市）選舉委員會監察小組。\n（２）將撕毀之選舉票或公投票收回，並將事實附記於\n選舉人名冊或投票權人名冊內該選舉人或投票權\n人備註欄內。收回之選舉票或公投票另外包封，\n列入已領未投票計算，並將事實附記於投（開）\n票報告表之「其他有關事項」欄內（格式見附錄\n五）。惟如撕毀之選舉票或公投票，經選舉人或\n投票權人投入票匭者，以無效票計。\n４、攜出選舉票或公投票：\n（１）發現選舉人或投票權人將選舉票或公投票攜出投\n票所，主任管理員應會同主任監察員，請警衛人\n員將該選舉人或投票權人予以留置，聯絡警察單\n位派員處理，另通報直轄市、縣（市）選舉委員\n會監察小組。\n（２）將該張選舉票或公投票收回，並將事實附記於選\n舉人名冊或投票權人名冊內該選舉人或投票權人\n備註欄內。收回之選舉票或公投票另外包封，列\n入已領未投票計算，並將事實附記於投（開）票\n報告表之「其他有關事項」欄內。\n５、在投開票所有下列情事之一者，主任管理員應會同主\n任監察員令其退出：\n（１）在場喧嚷或干擾、勸誘他人投票或不投票，不服\n制止者。\n（２）投票進行期間，穿戴或標示政黨、政治團體、候\n選人之旗幟、徽章、物品或服飾，不服制止者。"}, {"p": 15, "t": "（３）穿著佩帶具有公民投票相關文字、符號或圖像之\n貼紙、服飾或其他物品，在場喧嚷或干擾、勸誘\n他人投票或不投票，不服制止。\n（４）攜帶武器或危險物品入場者。\n（５）干擾開票或妨礙他人參觀開票，不服制止者。\n（６）有其他不正當行為，不服制止者。\n選舉人或投票權人有前項情事之一者，令其退出\n時，應將所持選舉票或公投票收回，並將事實附記於\n選舉人名冊或投票權人名冊內該選舉人或投票權人備\n註欄內。其情節重大者，並通報直轄市、縣（市）選\n舉委員會。經令其退出而不退出者，主任管理員應會\n同主任監察員，請警衛人員入場取締並聯絡警察單位\n派員處理，另通報直轄市、縣（市）選舉委員會監察\n小組。\n收回之選舉票或公投票另外包封，列入已領未投\n票計算，並將事實附記於投（開）票報告表之「其他\n有關事項」欄內。\n６、主任管理員應督導工作人員，依領、領、投程序進\n行，維持投票動線，避免選舉人先到公投票領票處領\n票，再折回選舉票領票處領票。\n７、僅領公投票之投票權人，請工作人員引導沿選舉票領\n票動線，直接到公投票領票處領票、圈票、投票。\n８、督導工作人員禁止選舉人、投票權人、其陪同家屬或\n陪同之人攜帶手機或其他攝影器材進入投票所（但已\n關閉電源之行動裝置，不在此限），如有上開情形，\n應即由主任管理員會同主任監察員作成紀錄，迅即通\n報直轄市、縣（市）選舉委員會監察小組依法處理。"}, {"p": 16, "t": "９、為維持投票所秩序，任何人於投票時間站在門外攝\n影，應予以制止。（72 年 10 月 11 日中選一字第 8006\n號函）但佩帶有選舉委員會製發記者證者，基於採訪\n之需要，在不妨礙投票秘密及投票作業原則下，應可\n准予拍攝投票情形。（81 年 10 月 17 日中選一字第\n43306 號函）即新聞記者雖佩帶選舉委員會製發證\n件，於投票時間僅得於投票所外拍攝，亦不得違反公\n職人員選舉罷免法第 65 條第 4 項「任何人不得於投\n票所以攝影器材刺探選舉人圈選選舉票內容」之規\n定。（98 年 8 月 21 日中選一字第 0980003823 號函）\n１０、督導工作人員不得主動詢問選舉人或投票權人投票\n意願。\n（十二）投票時間截止，宣布停止投票：下午 4 時整，主任\n管理員應即宣布投票時間截止，但對於投票時間截\n止前到達投票所之選舉人 或投票權人仍應准其投\n票。為防止在投票時間截止後到達投票所者插隊，\n應指派專人手持「投票排隊終點」標語站於隊末，\n以利選舉人或投票權人識別，並請警衛人員協助維\n持隊末秩序。\n（十三）封鎖投票匭：投票時間截止，選舉人或投票權人投\n票完畢後，主任管理員應會同主任監察員將投票匭\n上鎖，貼上封條；紙票匭須將上蓋攤平闔上，貼上\n封條。\n（十四）投票所投票完畢，除依規定將投票匭封鎖或貼上封\n條，主任管理員會同主任監察員督導領票處管理\n員，點算選舉人名冊、投票權人名冊上之領票人數\n與未領票人數，並點數用餘票數，包封用餘票數，\n於用餘票袋記上張數，填寫投（開）票報告表（格"}, {"p": 17, "t": "式見附錄五）之「發出票數」（即選舉人名冊、投\n票權人名冊之領票人數）、「用餘票數」，並於開\n票時向參觀席民眾宣布領票人數 。另將選舉人名\n冊、投票權人名冊及用餘之選舉票及公投票分別包\n封，於封口處共同蓋章，待開票完畢後，一併送交\n鄉（鎮、市、區）選務作業中心轉送直轄市、縣\n（市）選舉委員會保管，除檢察官或法院依法行使\n職權外，不得開拆。\n（十五）投票通知單應包封後，送交鄉（鎮、市、區）選務\n作業中心。\n（十六）發生投開票所工作人員或選舉人、投票權人於投開\n票所發生意外受傷之處理：應依投開票所工作人員\n因執行職務或選舉人於投開票所發生意外傷亡事件\n處理及通報流程辦理（通報及處理流程見附錄\n六）。\n（十七）發生天災或其他不可抗力情事之處理：應依公職人\n員選舉罷免法第 66 條、選舉投票日前或投開票當日\n發生天災或其他不可抗力情事處理辦法、中央選務\n指揮及應變中心作業要點、直轄市縣市選舉委員會\n選務應變中心作業要點及全國性公民投票投票日前\n或投開票當日發生天災或其他不可抗力情事處理注\n意事項辦理。\n二、查驗國民身分證管理員之職務：\n（一）查驗國民身分證管理員應於投票所入口處外執行職\n務，告知選舉人、投票權人及依規定陪同之家屬或陪\n同之人不得攜帶手機及其他攝影器材進入投票所投\n票，如有攜帶手機或其他攝影器材者，請選舉人、投\n票權人、其陪同家屬或陪同之人將手機或攝影器材暫"}, {"p": 18, "t": "請他人代管或交由投票所工作人員（查驗國民身分證\n管理員）代為保管（但已關閉電源之行動裝置，不在\n此限）。由投票所保管手機或攝影器材時，以投票所\n準備之標籤紙，依上開物品所有人之國民身分證，填\n上所有人姓名，並黏貼於上開物品後，置於放置籃保\n管，於選舉人、投票權人、其陪同家屬或陪同之人投\n票完畢走出投票所驗明身分後發還。\n（二）選舉人或投票權人應憑本人國民身分證進入投票所領\n票，舊式國民身分證依內政部 95 年 9 月 29 日台內戶\n字第 0950156932 號公告，自 96 年 1 月 1 日公告停止\n使用。選舉人或投票權人應憑 94 年 12 月 21 日後換發\n之本人新式國民身分證進入投票所投票，持舊式國民\n身分證或其他證件如駕照、健保卡或戶口名簿等，應\n予委婉說明，拒絕其進入投票所。\n（三）核對前來投票選舉人或投票權人容貌與其國民身分證\n所貼相片是否相符，選舉人年齡是否已滿 20 歲或投票\n權人年齡是否已滿 18 歲。如遇有佩戴口罩之選舉人或\n投票權人，應請其暫時脫下口罩，以利核對。\n（四）投票所工作人員對選舉人或投票權人進行身分查驗\n時，應尊重其個人性別認同，如選舉人或投票權人容\n貌與國民身分證所貼相片難以辨別者，得請其提供第\n二證件（例如：健保卡、駕照等）輔助查驗，不得對\n選舉人或投票權人進行驗身，或以歧視、侮辱之言行\n損害選舉人或投票權人之人格尊嚴。\n（五）檢查國民身分證反面村（里）、鄰別，是否屬於該投\n票所所轄範圍，不屬於所轄範圍者，應予委婉說明。\n選舉人或投票權人於 115 年 11 月 8 日後遷徙、分赴兩\n地投票之原住民選舉人、投票所異動後之原住民選舉"}, {"p": 19, "t": "人，其戶籍地址可能與該投票所所轄範圍不同，應以\n投票通知單或選舉人名冊、投票權人名冊所載資料為\n準。\n（六）倘選舉人或投票權人未帶通知單，查驗國民身分證管\n理員得利用內政部「投票所地點查詢系統」確認選舉\n人或投票權人是否確實屬於該投票所，如有必要，請\n主任管理員聯繫戶政事務所查詢。\n（七）請選舉人或投票權人排隊，依序查驗，視領票處選舉\n人或投票權人多寡陸續准其入場，以免影響投票所內\n之秩序。\n（八）遇有行動不便、乘坐輪椅、年長者、孕婦及其他不適\n久站之選舉人或投票權人到達投票所等候投票時，應\n洽商其他在場選舉人或投票權人，禮讓其優先進入投\n票所投票。主任管理員並視需要彈性調度 1 名管理員\n協助優先投票及維持排隊秩序。\n（九）遇有返回戶籍地投票之投開票所工作人員主動出示工\n作證，應准其優先進入投票所投票，並向其他在場選\n舉人或投票權人說明。\n（十）遇有選舉人或投票權人照顧之 6 歲以下兒童進入投票\n所，主任管理員得視需要彈性調度 1 名管理員予以協\n助。\n（十一）選舉人或投票權人吸煙、嚼食檳榔或口香糖，應請\n其先熄滅煙火或吐掉檳榔、口香糖，再准其進入投\n票所投票，若有不從，應請警衛人員處理。\n（十二）投票所除選舉人或投票權人及其照顧之 6 歲以下兒\n童、因身心障礙不能自行圈投而能表示其意思者之\n家屬或陪同之人外，非佩帶各級選舉委員會製發證\n件之人員，不得進入。但檢察官依法執行職務者，"}, {"p": 20, "t": "不在此限。其他人員欲進入投票所時，應予以制\n止。\n（十三）如遇家屬或陪同之人輔助身心障礙選舉人或投票權\n人投票，投票所工作人員應向該身心障礙選舉人或\n投票權人確認該家屬或陪同之人確實為其選擇之輔\n助投票人員。\n（十四）選舉人或投票權人照顧之 6 歲以下兒童進入投票\n所，投票所工作人員應本於職權，依事實認定，如\n有必要，得由該選舉人或投票權人舉證，或備具有\n關戶籍資料證明。另 6 歲以下兒童進入投票所不得\n有妨礙或擾亂投票之行為。\n三、領票處管理員之職務：\n（一）選舉人名冊或投票權人名冊管理員：\n１、選舉人名冊或投票權人名冊管理員檢查主任管理員發\n交之名冊是否與所負責之選舉票或公投票發票工作相\n符，確認無誤後始開始分別進行選舉人或投票權人之\n身分核對等工作。\n２、本次選舉，多種地方公職人員選舉同日舉行投票，每\n一選舉人所行使選舉權不盡相同，發票時應確實注意\n下列事項：\n（１）選舉人名冊「簽名或蓋章或按指印」欄內有\n「 」標記者，即表示該選舉人不具有該種選\n舉之選舉權，不得發給選舉票；選舉人名冊「簽\n名或蓋章或按指印」欄內無「 」標記者，表\n示該選舉人具有該種選舉之選舉權，應發給選舉\n票。\n（２）選舉人名冊簽名或蓋章或按指印欄蓋有「工作地\n投票」戳記者，不得發給選舉票。"}, {"p": 21, "t": "（３）為保障原住民選舉人投票秘密，１村（里）僅１\n名平地原住民選舉人或１名山地原住民選舉人之\n情形，該原住民選舉人係分赴兩地投票：\n①一般選舉人名冊遇有選舉人「簽名或蓋章或按指\n印」欄之議員選舉欄位以雙橫線劃去，備註欄註\n記「請至第○投票所行使議員選舉權」者，應提\n醒該選舉人前往備註欄所載投票所行使議員選舉\n權。\n②原住民選舉人名冊遇有選舉人「簽名或蓋章或按\n指印」之議員選舉欄位空白，其餘選舉種類均有\n「 」標記，備註欄註記「請至第○投票所行\n使其他地方公職人員選舉權」者，應提醒該選舉\n人前往備註欄所載投票所行使其他地方公職人員\n選舉權。\n３、核對選舉人或投票權人容貌：選舉人名冊或投票權人\n名冊管理員核對前來投票選舉人或投票權人容貌與其\n國民身分證相片是否相符，如遇有佩戴口罩之選舉人\n或投票權人，應請其暫時脫下口罩。\n４、查對選舉人名冊或投票權人名冊：憑選舉人或投票權\n人所持國民身分證及投票通知單，迅速查對選舉人名\n冊或投票權人名冊內之記載資料，是否相符。\n５、選舉人或投票權人持補領或換領國民身分證領票時，\n應核對其國民身分證之補、換發日期與選舉人名冊或\n投票權人名冊備註欄或戶政機關列冊資料上之補、換\n發日期，二者日期一致或國民身分證補、換發日期在\n選舉人名冊或投票權人名冊備註欄補、換證日期之後\n者，為有效之國民身分證，應發給選舉票或公投票。\n【選舉人或投票權人向戶政機關申報國民身分證遺"}, {"p": 22, "t": "失，補領國民身分證者，其國民身分證上有補發之日\n期；如係持原國民身分證換領新國民身分證者，其換\n發之國民身分證有換發之日期，原國民身分證則由戶\n政機關收回。至於在選舉人名冊、投票權人名冊編造\n基準日（即 115 年 11 月 8 日，含當日）後至投票日前\n1 日之期間，若有選舉人或投票權人補換領國民身分\n證者，則由戶政機關列冊送鄉（鎮、市、區）選務作\n業中心轉發投票所查對用】\n６、指導選舉人或投票權人於選舉人名冊或投票權人名冊\n簽章：\n（１）國民身分證與選舉人名冊或投票權人名冊資料經\n查相符後，即在冊內該選舉人或投票權人名下之\n「簽名或蓋章或按指印」欄內依所領選舉票或公\n投票種類逐欄蓋章或請其簽名。蓋章前應先檢查\n印章上之姓名是否與名冊上之姓名相符，如印章\n上沾有印泥，並應以印章刷刷乾淨後，再將印章\n蓋在規定欄位方格內，應特別注意避免蓋錯欄\n位。（選舉人名冊格式如附錄七）\n（２）選舉人名冊或投票權人名冊管理員在選舉人名冊\n或投票權人名冊規定欄位蓋章後，應將印章交還\n選舉人或投票權人，並提醒勿用印章圈蓋選舉票\n或公投票，應以選舉委員會提供之圈選工具圈蓋\n選舉票或公投票，以免造成無效票。\n（３）選舉人或投票權人以簽名領取選舉票或公投票\n時，應請其簽可辨之姓名全名。選舉人或投票權\n人如未攜帶印章或不能簽名者，應按指印，以用\n大姆指為原則，指紋力求完整清晰，並應由管理\n員及監察員各 1 人，立即於「證明人蓋章」欄內"}, {"p": 23, "t": "共同蓋章證明，並請選舉人或投票權人用置備之\n擦手紙巾，將指上印泥擦抹乾淨後發給選舉票或\n公投票，以免塗污選舉票或公投票，成為無效\n票。\n７、選舉人或投票權人持戶政事務所核發之臨時證明書領\n票者，應於選舉人名冊或投票權人名冊備註欄註明\n「憑臨時證明書領票」。\n８、選舉人名冊或投票權人名冊上之姓名顯係筆誤、因婚\n姻關係而冠姓或回復本姓致與國民身分證不符者，經\n主任管理員會同主任監察員辨明後，應准領取選舉票\n或公投票。\n９、選舉人名冊或投票權人名冊上無其姓名或姓名不符\n者，不得發票。\n１０、依內政部 65 年 3 月 2 日臺內戶字第 675438 號函規\n定，國民身分證遺失，申請補發後，若尋獲原證，\n應即繳回依法處理，不得留下繼續使用。故已報遺\n失之國民身分證，應視為無效。（69 年 10 月 20 日\n中選一字第 1142 號函）選舉人或投票權人若持已\n報遺失之國民身分證，應不准其領票，請其持補領\n之國民身分證領票，並告知選舉人或投票權人將已\n報遺失之國民身分證繳送戶政機關銷燬，不宜逕予\n沒收。\n１１、選舉人或投票權人交付之投票通知單應妥為收存，\n以備交回鄉（鎮、市、區）選務作業中心。\n１２、依選舉人或投票權人申請填發選舉人或投票權人到\n達投票所證明書。（格式見附錄八）\n（二）發票管理員："}, {"p": 24, "t": "１、點收選舉票或公投票：於投票開始前，發票管理員點\n收主任管理員會同主任監察員點交之選舉票或公投\n票。如有原住民選舉票，應與其他選舉票均一同放置\n於桌面，謹慎保管，不得收存於抽屜或其他空間。\n２、選舉人名冊或投票權人名冊經蓋章或簽名或按指印\n後，發票管理員再行發放選舉票或公投票。\n３、依選舉人名冊或投票權人名冊登載資料發給選舉票或\n公投票；凡名冊「簽名或蓋章或按指印」欄蓋有「工\n作地投票」戳記者，不得發票。\n４、發票應力求迅速、謹慎，嚴防 2 票重疊誤作 1 票發\n出。\n５、選舉人或投票權人提出問題，應請主任管理員答覆或\n解決，以免延誤時間，影響其他選舉人或投票權人領\n票。\n６、選舉票或公投票如有漏蓋關防、破損、污點、模糊不\n清或雙面印製等缺失者，不得發出。\n７、選舉票或公投票領取後自行污損者，不再予以更換或\n補發。\n（三）直轄市辦理原住民選舉人領票作業注意事項：\n本次選舉，直轄市辦理優化原住民選舉人領票作\n業，投開票所辦理原住民選舉人領票作業，應注意下\n列事項：\n１、身分查驗（查驗國民身分證管理員、原住民引導管理\n員）\n（１）原住民公職人員選舉，基於維護原住民選舉人投票\n秘密需要，戶政機關編造選舉人名冊得辦理投票所\n異動作業。投票所異動後之原住民選舉人，其戶籍"}, {"p": 25, "t": "地址可能與該投票所所轄鄰別不同，應以投票通知\n單或選舉人名冊所載資料為準。\n（２）核對投票通知單「選舉種類」是否載明「平地（山\n地）原住民議員」，倘選舉人未帶通知單，查驗國\n民身分證管理員得利用內政部「投票所地點查詢系\n統」確認選舉人是否確實屬於該投票所，如有必\n要，請主任管理員聯繫戶政事務所查詢。\n（３）主動引導選舉人： 具「平地原住民議員」或「山\n地原住民議員」選舉投票資格者，原住民引導管理\n員或引導人員主動引導。\n２、專人引導（原住民引導管理員、引導人員）\n（１）原住民選舉票領票處原則與一般選舉人領票處合併\n設置，並張貼「原住民選舉票領票處」標示。\n（２）主任管理員、原住民引導管理員或彈性指派之引導\n人員應以和藹態度主動服務原住民選舉人，於完成\n身分查驗後，主動引導原住民選舉人，並陪同至原\n住民選舉票領票處領票。\n（３）原住民引導管理員忙碌時，由主任管理員彈性調度\n人員引導，或由查驗國民身分證管理員協助引導。\n３、領票及發票（引導人員、原住民引導管理員、原住民\n領票處管理員）\n（１）原住民選舉人名冊係單獨編造，原住民選舉票領票\n處設有原住民領票處管理員時，由該管理員保管原\n住民選舉人名冊及原住民選舉人之各種選舉票。\n（２）原住民引導管理員或引導人員到達領票處時，名冊\n管理員即於「原住民投票所異動選舉人名冊」查找\n原住民選舉人資料，並提醒發票管理員應發給原住"}, {"p": 26, "t": "民議員選舉票，山地原住民發給「淺綠色」選舉\n票；平地原住民發給「淺藍色」選舉票。\n（３）原住民引導管理員或引導人員站在領票處前，協助\n確認選舉人名冊所載原住民選舉人得領取之選舉票\n種類是否正確時，不得任意碰觸選舉人名冊或選舉\n票，並應嚴守保護選舉人個人隱私，以免引發不必\n要之誤解。\n（４）若發票管理員未發給原住民選舉人正確選舉票，原\n住民引導管理員或引導人員應「輕聲提醒」發票管\n理員。\n（５）為保障原住民選舉人投票秘密，１村（里）僅１名\n平地原住民選舉人或１名山地原住民選舉人之情\n形，該原住民選舉人係分赴兩地投票：\n①一般選舉人名冊遇有選舉人「簽名或蓋章或按指\n印」欄之議員選舉欄位以雙橫線劃去，備註欄註\n記「請至第○投票所行使議員選舉權」者，應提\n醒該選舉人前往備註欄所載投票所行使議員選舉\n權。\n②原住民選舉人名冊遇有選舉人「簽名或蓋章或按\n指印」之議員選舉欄位空白，其餘選舉種類均有\n「 」標記，備註欄註記「請至第○投票所行\n使其他地方公職人員選舉權」者，應提醒該選舉\n人前往備註欄所載投票所行使其他地方公職人員\n選舉權。\n（６）原住民公職人員選舉原住民選舉人已辦理投票所異\n動者，為便利投票權人投票，全國性公民投票係配\n合辦理投票所異動作業。\n４、其他注意事項"}, {"p": 27, "t": "（１）引導原住民選舉人領票時，應依據投票通知單所載\n選舉種類引導其前往原住民選舉票領票處，並注意\n招呼之音量及引導方式之適當性。\n（２）投票所應善用手持標語，宣導投票所辦理優化原住\n民選舉人領票作業。\n（３）原住民引導管理員或引導人員應於選舉人依序完成\n身分查驗後，始提供原住民選舉人引導服務，以維\n護現場排隊秩序。\n（四）縣（市）辦理原住民選舉人領票作業注意事項：\n１、身分查驗：\n（１）原住民公職人員選舉，基於維護原住民選舉人投票\n秘密需要，戶政機關編造選舉人名冊得辦理投票所\n異動作業。投票所異動後之原住民選舉人，其戶籍\n地址可能與該投票所所轄鄰別不同，應以投票通知\n單或選舉人名冊所載資料為準。\n（２）核對投票通知單「選舉種類」是否載明「平地（山\n地）原住民議員」，倘選舉人未帶通知單，查驗國\n民身分證管理員得利用內政部「投票所地點查詢系\n統」確認選舉人是否確實屬於該投票所，如有必\n要，請主任管理員聯繫戶政事務所查詢。\n２、領票及發票：\n（１）選舉人名冊之原住民選舉人與一般選舉人依其戶\n籍地址合併編造；但投票所異動之原住民選舉\n人，其戶籍地址與該投票所所轄鄰別不同，其選\n舉人名冊裝訂於各鄰選舉人名冊後之「原住民投\n票所異動選舉人名冊」。\n（２）為避免誤發選舉票，遇有原住民選舉人，選舉人\n名冊管理員應朗誦「平地（或山地）原住民選"}, {"p": 28, "t": "票」，提醒發票管理員，發票管理員應複誦 1\n次，並提醒發票管理員應發給原住民議員選舉\n票，山地原住民發給「淺綠色」選舉票；平地原\n住民發給「淺藍色」選舉票，平地原住民鄉\n（鎮、市）民代表發給「淺橘色」選舉票，避免\n錯發選舉票，選舉人名冊管理員朗誦之音量不宜\n過大，以發票管理員可聽到為原則。\n（３）為保障原住民選舉人投票秘密，１村（里）僅１\n名平地原住民選舉人或１名山地原住民選舉人之\n情形，該原住民選舉人係分赴兩地投票：\n①一般選舉人名冊遇有選舉人「簽名或蓋章或按指\n印」欄之議員選舉欄位以雙橫線劃去，備註欄註\n記「請至第○投票所行使議員選舉權」者，應提\n醒該選舉人前往備註欄所載投票所行使議員選舉\n權。\n②原住民選舉人名冊遇有選舉人「簽名或蓋章或按\n指印」之議員選舉欄位空白，其餘選舉種類均有\n「 」標記，備註欄註記「請至第○投票所行\n使其他地方公職人員選舉權」者，應提醒該選舉\n人前往備註欄所載投票所行使其他地方公職人員\n選舉權。\n（４）原住民公職人員選舉原住民選舉人已辦理投票所\n異動者，為便利投票權人投票，全國性公民投票\n係配合辦理投票所異動作業。\n（五）本次選舉，多種地方公職人員選舉同日舉行投票，選舉\n人應一次同時領取各該選舉選舉票，如僅願領取部分\n選舉票時，應於選舉人名冊備註欄註記，並由管理員"}, {"p": 29, "t": "及監察員各 1 人共同簽章證明，同時告知選舉人，不得\n再要求第二次領票。\n（六）本次地方公職人員選舉與全國性公民投票同日於同一投\n票所舉行投票，選舉人或投票權人應一次進入投票所\n投票，離開投票所後不得再次進入投票所投票。\n四、圈票處管理員之職務：\n（一）維持圈票處秩序：\n１、各圈票處如均有人正在圈選，應告知後來之選舉人或\n投票權人在等待圈票線排隊等候圈票。\n２、依各選舉人或投票權人進入之先後排隊靜候，圈票處\n一有空出，即通知依序分別前往圈票。\n（二）照顧身心障礙及有需要之選舉人或投票權人：\n１、因身心障礙不能自行圈投而能表示其意思者，得依其\n請求，由家屬或陪同之人 1 人在場，依據本人意思，\n眼同協助或代為圈投；其無家屬或陪同之人在場者，\n亦得依其請求，由投票所管理員及監察員各 1 人，依\n據本人意思，眼同協助或代為圈投。其身心障礙者不\n以領有身心障礙手冊人員為限，凡有身體或心智功能\n障礙，不能自行圈投而能表示其意思者，均適用上開\n規定。其所稱「不能自行圈投」，係指肢體功能不健\n全致不能自行圈投，心智障礙者如肢體功能健全，仍\n應自行圈投。「能表示意思」，以口頭明示之意思表\n示為限，但有語言障礙而無法口頭意思表示者，得以\n其他明示之意思表示為之。（93 年 1 月 7 日中選一字\n第 0933100006 號、93 年 1 月 20 日中選一字第\n0933100027 號函）心智障礙者因其肢體功能健全，故\n不得由家屬代為圈選，仍應由本人親自圈選。"}, {"p": 30, "t": "身心障礙不能自行圈投之選舉人或投票權人，其\n無家屬或陪同之人在場者，請求管理員會同監察員代\n為圈投時，應確實依選舉人或投票權人之明確意思，\n謹慎眼同協助或代為圈投。\n２、如遇家屬或陪同之人輔助身心障礙選舉人或投票權人\n投票，投票所工作人員應向該身心障礙選舉人或投票\n權人確認該家屬或陪同之人確實為其選擇之輔助投票\n人員。\n３、工作人員不得以確認陪同家屬或陪同之人是否依據本\n人意思，眼同協助或代為圈投為由，窺視刺探選舉人\n圈選選舉票或投票權人圈蓋公投票之內容。\n４、身心障礙及有需要之選舉人或投票權人行動困難，應\n予照顧扶助，如必須引至圈票處，於到達時，立即退\n回原位置工作，俟其圈票完畢，招請時，再前進扶引\n至投票處投票。\n（三）如選舉人或投票權人、其陪同家屬或陪同之人在圈票處\n持用手機或攝影器材（但已關閉電源之行動裝置，不\n在此限），圈票處管理員及監察員應即告知主任管理\n員，並由主任管理員會同主任監察員作成紀錄，迅即\n通報直轄市、縣（市）選舉委員會監察小組依法處\n理。\n（四）檢查圈選工具及圈票處遮屏：\n１、在投票開始前檢查圈選工具，以其他紙張試蓋圈選工\n具之圖樣是否符合規定，如有不合即予更換。投票前\n並確實檢查印台及油墨，如有油墨過多可能污染選舉\n票、公投票或油墨過少顏色可能模糊不清者，應即時\n改善或聯繫鄉（鎮、市、區）選務作業中心更換。"}, {"p": 31, "t": "２、利用無人圈選時，檢查各圈票處之圈選工具及遮屏桌\n面是否沾染油墨可能污染選舉票或公投票，並整理\n之。\n３、圈選工具或遮屏如必須即時整理，應請選舉人或投票\n權人稍候，俟整理完妥後，再請選舉人或投票權人圈\n選。\n（五）嚴防選舉人或投票權人調換圈選工具及圈票用紅色印\n台。如發現有被調換情事，應即時補換。\n（六）圈票處應絕對禁止任何人近前窺視或刺探選舉人或投票\n權人之圈選。\n五、投票處管理員之職務：\n（一）投票時間內，投票處管理員原則應坐於投票處座椅上，\n執行下列職務，不得任意走動：\n１、指導選舉人或投票權人將選舉票或公投票摺疊投入各\n該種選舉或全國性公民投票案之投票匭內，投畢後告\n知由出口處離去，不可任其停留投票所內。\n２、注意選舉人或投票權人圈選後不得將圈選內容出示他\n人。\n３、嚴防選舉票或公投票攜出：\n（１）嚴防選舉人或投票權人將所領之選舉票或公投票\n攜出投票所。\n（２）選舉人或投票權人如有不投票之情事，即應會同\n監察員勸導其投入投票匭後始准離去。\n４、注意防範選舉人或投票權人將選舉票或公投票以外之\n物品，故意或錯誤投入投票匭。\n５、嚴守投票匭：\n（１）注意保管投票匭及其放置位置，不准任何人移\n動。"}, {"p": 32, "t": "（２）維護投票匭上封條、鎖鑰之完整。\n（３）自開始投票，直至投票完畢，投票所改為開票所\n為止，應隨時注意投票匭。\n（二）投票完畢後，配合主任管理員、主任監察員將投票匭密\n封上鎖，貼上封條；紙票匭須將上蓋攤平闔上，貼上\n封條。\n六、主任監察員之職務：\n（一）綜理投票之監察事務，並監督監察員執行下列任務：\n１、監察投票所管理員辦理投票有無違法情事。\n２、監察選舉人或投票權人投票有無違法情事。\n有前項之違法情事時，主任監察員應迅即通報直轄\n市、縣（市）選舉委員會監察小組依法處理。\n（二）分配監察員職務：\n１、領票處監察員。\n２、圈票處監察員。\n３、投票處監察員。\n前項工作人員，由主任監察員視人力多寡分配之。\n（三）會同主任管理員辦理之事項：\n１、點領選舉票及公投票。\n２、佈置投票所。\n３、點交選舉票及公投票。\n４、啟驗投票匭。\n５、處理各種突發狀況。\n６、維持投票所秩序。\n７、封鎖投票匭。\n８、填具投（開）票報告表投票部分。\n９、包封選舉人名冊、投票權人名冊及用餘票。"}, {"p": 33, "t": "（四）監察員於投票開始時不到場執行職務者，視為放棄擔\n任，主任監察員應迅即通報鄉（鎮、市、區）選務作業\n中心轉報各該直轄市、縣（市）選舉委員會派員遞補。\n（五）選舉人或投票權人將選舉票或公投票圈定內容出示他人\n者，主任監察員應當場檢舉，並將事實附記於投（開）\n票報告表之「其他有關事項」欄，但仍准其將選舉票或\n公投票投入投票匭，另請警衛人員將該選舉人或投票權\n人予以留置，聯絡警察單位派員處理，並迅即通報直轄\n市、縣（市）選舉委員會監察小組依法處理。\n七、領票處監察員之職務：\n（一）監察選舉人或投票權人領票、管理員發票，有無違法情\n事。\n（二）選舉人或投票權人領取選舉票或公投票，在選舉人名冊\n或投票權人名冊上按指印者，監察員及管理員各 1 人在\n選舉人名冊或投票權人名冊「證明人蓋章」欄內共同\n蓋章證明。\n（三）選舉人如僅願領取部分選舉票時，應於選舉人名冊備註\n欄註記，並由管理員及監察員各１人共同蓋章證明。\n八、圈票處監察員之職務：\n（一）如選舉人、投票權人、其陪同家屬或陪同之人在圈票處\n持用手機或攝影器材（但已關閉電源之行動裝置，不\n在此限），圈票處管理員及監察員應即告知主任管理\n員，並由主任管理員會同主任監察員作成紀錄，迅即\n通報直轄市、縣（市）選舉委員會監察小組依法處\n理。\n（二）監察選舉人或投票權人圈票有無違法情事。"}, {"p": 34, "t": "（三）身心障礙不能自行圈投而能表示其意思且無家屬或陪同\n之人在場者，請求協助或代為圈投時，應由管理員及\n監察員各 1 人依據本人意思眼同協助或代為圈投。\n九、投票處監察員之職務：監察選舉人或投票權人投票有無違\n法情事。\n十、投開票所工作人員如有未依標準作業程序辦理投票作業情\n事，由直轄市、縣（市）選舉委員會於調查事實後，依據\n投開票所工作人員實際執行投開票工作情形覈實辦理獎\n懲。"}, {"p": 35, "t": "伍、開票作業與職務分配\n一、主任管理員職務：\n（一）分配管理員工作，每一開票組其分配原則如下：\n１、檢票員 1 人。\n２、唱票員 1 人。\n３、記票員 1 人。\n４、整票計票員 1 人。\n前項工作之分配，主任管理員得視人力多寡分配\n之。\n（二）佈置開票所：主任管理員會同主任監察員督導各工作人\n員於最短期間內，將開票所佈置完妥。開票所應設置\n參觀席，備民眾參觀，非開票完畢，開票所門窗不得\n關閉。\n（三）督導管理員將記票紙粘貼在牆壁上或另備之板架上，以\n備開票，佈置開票所時，應注意另備之板架是否擺設\n妥當，並避免滑落，以免發生危害選舉人、投票權人\n或投開票所工作人員情事。\n（四）督導管理員張貼「開票作業程序」及「開票期間民眾攝\n影注意事項」海報。\n（五）宣布開票：\n１、主任管理員於開票前向參觀席民眾宣布「現在開始開\n票」並宣讀「開票作業程序表」海報。\n２、主任管理員向參觀席民眾宣布「經初步統計結果，○\n長選舉，領票人數○人；○議員選舉，領票人數○\n人；○長選舉，領票人數○人；○代表選舉，領票人\n數○人；○長選舉，領票人數○人、全國性公民投票\n案第 22 案領票人數○人，開票結果應以全部投票匭"}, {"p": 36, "t": "之選舉票、公投票開出後，彙計之投（開）票報告表\n為準。」\n３、主任管理員會同主任監察員驗明封條及鎖鑰完好後，\n即向參觀民眾宣布開票，拆封開鎖，啟開投票匭內外\n蓋，正式開票。\n４、開票前向參觀民眾說明開票程序，先開選舉票，次開\n公投票。\n（六）電燈失明開啟輔助照明設備：\n１、開票時萬一電燈失明，主任管理員應督飭各工作人員\n嚴守崗位，立即將預先置備之照明設備打開，並注意\n保管物件，不得離開。\n２、主任管理員應迅速通知參觀席參觀民眾靜待，並督飭\n警衛人員注意糾察，維持秩序。\n（七）督導開票作業之進行：\n１、本次選舉及全國性公民投票開票所均分 2 組同時開\n票，應分別以「男聲」、「女聲」分組唱呼為原則，\n並避免相互干擾情形。本次選舉及全國性公民投票開\n票順序如下：\n（１）直轄市（不包含直轄市山地原住民區）及市之開\n票所，分別先開市長與市議員選舉票，再進行里\n長選舉票之開票。\n（２）縣之開票所，1 組負責依序進行縣長、鄉（鎮、\n市）長、村（里）長選舉票之開票，另 1 組負責\n依序進行縣議員、鄉（鎮、市）民代表選舉票之\n開票。\n（３）直轄市山地原住民區之開票所，1 組負責依序進\n行市長、區長、里長選舉票之開票，另 1 組負責\n依序進行市議員、區民代表選舉票之開票。"}, {"p": 37, "t": "（４）選舉票開票完畢後，次開公投票。\n２、分 2 組開票時，由檢票管理員檢出選舉票、公投票\n後，交由同組唱票管理員唱票，並由同組之記票管理\n員記票。\n３、開票應公開為之，逐張唱名開票，並依檢票、唱票、\n記票及整票計票作業程序進行，不得先整票後再行唱\n票或計票。每一投票匭開票完畢，向參觀席參觀民眾\n展示空票匭。\n（八）民眾開票攝影時應予制止之行為及處理程序：\n開票期間民眾攝影如有（１）使用閃光燈、補光燈或其\n他光源；（２）攝影民眾或其所持有之器材越過參觀\n席；（３）攝影器材阻擋其他觀看開票民眾視線；\n（４）以言語、手勢等方式，指揮、干擾或中斷開票\n作業；（５）針對特定開票所工作人員進行拍攝等行\n為時，致影響開票程序進行或其他民眾觀看開票過程\n時，主任管理員應視現場情形及情節輕重，依公職人\n員選舉罷免法第 65 條第 1 項規定予以制止。不服制止\n者，主任管理員應會同主任監察員令其退出。經令其\n退出而不退出者，應請警衛人員予以留置，聯絡警察\n單位派員處理，另通報直轄市、縣（市）選舉委員會\n監察小組。\n（九）認定無效票：\n１、選舉票或公投票有無效情事者，主任管理員應會同主\n任監察員依法認定並應當場為之。不得於其他選舉票\n或公投票全部唱票完畢後始一併予以認定。\n２、選舉票無效票認定標準：選舉票有下列情事之一者，\n無效：\n（１）圈選 2 人以上。"}, {"p": 38, "t": "（２）不用選舉委員會製發之選舉票。\n（３）所圈位置不能辨別為何人。\n（４）圈後加以塗改。\n（５）簽名、蓋章、按指印、加入任何文字或符號。\n（６）將選舉票撕破致不完整。\n（７）將選舉票污染致不能辨別所圈選為何人。\n（８）不加圈完全空白。\n（９）不用選舉委員會製備之圈選工具。\n前項無效票，應由開票所主任管理員會同主任\n監察員認定；認定有爭議時，由全體監察員表決\n之。表決結果正反意見同數者，該選舉票應為有\n效。\n３、公投票無效票認定標準：公投票有下列情事之一者，\n無效：\n（１）同時圈選同意及不同意。\n（２）不用選舉委員會製發之公投票。\n（３）所圈位置不能辨別為同意或不同意。\n（４）圈後加以塗改。\n（５）簽名、蓋章、按指印、加入任何文字或符號。\n（６）將公投票撕破致不完整。\n（７）將公投票污染致不能辨別所圈選為同意或不同\n意。\n（８）不加圈完全空白。\n（９）不用選舉委員會製備之圈選工具。\n前項無效票，應由開票所主任管理員會同主任\n監察員認定；認定有爭議時，由全體監察員表決\n之。表決結果正反意見同數者，該公投票應為有\n效。"}, {"p": 39, "t": "４、適用選舉票或公投票有效票與無效票認定圖例應行注\n意事項（有效票與無效票之認定圖例見附錄九及附錄\n十）：\n（１）圖例係就裁量事項中典型案例，作一般例示性的\n規定，選務人員若遇有圖例所未例示之特殊案\n例，並非即屬無效票，仍應依各該法律所定各款\n無效票規定之本旨，由開票所主任管理員會同主\n任監察員認定；認定有爭議時，由全體監察員表\n決之。表決結果正反意見同數者，該選舉票或公\n投票應為有效。\n（２）於選舉票上「任何位置」有足以辨識之指印紋\n者，應屬無效票，但沾染印泥而留於選舉票之痕\n跡，非客觀上顯然可以認定係按指印，亦非符\n號，且仍能辨別為圈選何組或何人或何政黨者，\n應屬有效票。\n（３）如係選舉委員會製備之圈選工具，因該工具之瑕\n疵致印出變異之符號，仍應屬有效票。\n（４）圈選選舉票或公投票依規定應使用紅色印台，其\n間若被調換黑色、藍色或其他顏色印台，發現後\n當即行換補，但已圈選之選舉票或公投票仍為有\n效。（74 年 10 月 24 日中選法字第 14243 號函）\n（５）印痕因印水過多擴散，惟仍顯現部分圈選痕跡，\n依其印痕弧度能辨別係選舉委員會製備之圈選工\n具者，為有效票。\n（６）圈選時因力道不一，或以拖曳方式，致雖未能完\n整呈現圈印，惟依其印痕弧度能辨別係選舉委員\n會製備之圈選工具者，為有效票。"}, {"p": 40, "t": "（７）選票空白處圈蓋數圈印，惟於相片或名字部分，\n仍有部分印痕，且依其印痕弧度能辨別係選舉委\n員會製備之圈選工具者，為有效票。\n（８）於候選人欄格圈印繪製圖案而能辨別係圈選何人\n者，例如：於候選人頭像週邊圈印，形成光環圖\n樣，為有效票。\n（９）圈印於相鄰候選人共用空間，且部分圈印加蓋於\n候選人欄格之格線，為有效票。\n（１０）圈選於某一候選人欄格與選票邊緣之間，且部\n分圈印加蓋於欄格線上，仍能辨別為圈選何人\n者，應屬有效票。\n（１１）圈選於相鄰候選人共用空間，且圈印加蓋於格\n線外，不能辨別為圈選何人者，應屬無效票。\n（１２）圈選於相鄰候選人共用空間，且部分圈印加蓋\n於某一候選人欄格線上，仍能辨別為圈選何人\n者，應屬有效票。\n５、誤投票匭之選舉票或公投票，仍屬有效投票，計入投\n票數，依法認定其為有效或無效。\n（十）填具投（開）票報告表開票部分：\n１、全部投票匭開票完畢後，由主任管理員會同主任監察\n員填寫選舉及全國性公民投票投（開）票報告表，各\n一式 3 份，將其中 1 份先派管理員 1 人送至鄉（鎮、\n市、區）選務作業中心彙計。\n２、填具選舉投（開）票報告表：\n（１）投開票所編號、投開票日期、開票起止時間應確\n實填寫。\n（２）候選人得票數及無效票數，依記票管理員與整票\n計票管理員相互核對正確無誤，並確認未有候選"}, {"p": 41, "t": "人得票數錯置情形後，填入各候選人得票數及無\n效票數。\n（３）候選人（甲）得票數＋候選人（乙）得票數\n＋……=有效票數\n（４）有效票數＋無效票數=投票數\n（５）投票數＋已領未投票數=發出票數\n（６）發出票數＋用餘票數=選舉人數（原領票數）\n（７）遇有投票數多於發出票數，或發出票數加用餘票\n數少於選舉人數（原領票數）時，應據實於投\n（開）票報告表「其他有關事項」欄中註記。如\n有投票數少於發出票數（即領票人數），其已領\n票數即列為「已領未投票數」。\n３、填具全國性公民投票案投（開）票報告表：\n（１）投開票所編號、投開票日期、開票起止時間應確\n實填寫。\n（２）全國性公民投票案同意票數、不同意票數及無效\n票數，依記票管理員與整票計票管理員相互核對\n正確無誤並再確認未有票數錯置情形後，填入同\n意票數、不同意票數及無效票數。\n（３）同意票數＋不同意票數=有效票數\n（４）有效票數＋無效票數=投票數\n（５）投票數＋已領未投票數=發出票數\n（６）發出票數＋用餘票數=投票權人數（原領票數）\n（７）遇有投票數多於發出票數，或發出票數加用餘票\n數少於投票權人數（原領票數）時，應據實於投\n（開）票報告表「其他有關事項」欄中註記。\n４、投（開）票報告表填寫完畢後，請記票管理員及整票\n計票管理員協助檢視，並由投（開）票報告表遞送工"}, {"p": 42, "t": "作人員協助依記票紙核對投（開）票報告表填寫內容\n是否有錯誤或錯置情形，確認無誤後於快遞封袋(參\n考格式如附錄十一)簽名。\n５、主任管理員及主任監察員須親自確認投（開）票報告\n表票數正確無誤後核章，不得有未核對或將印章交由\n他人於投開票報告表核章情形。\n６、推薦候選人之政黨及未受政黨推薦之候選人所指派之\n人員，領取選舉投（開）票報告表副本時，另行填發\n所需份數。\n７、投（開）票報告表應謹慎確實填寫，儘量避免塗改，\n如有塗改時，由主任管理員會同主任監察員於塗改處\n蓋章，以示負責。\n（十一）宣布開票結果：全部選舉票及公投票開票完畢，由主\n任管理員會同主任監察員填寫選舉及全國性公民投\n票案第 22 案投開票報告表，並應即宣布選舉票及公\n投票開票結果。\n（十二）張貼投（開）票報告表：由主任管理員會同主任監察\n員將投（開）票報告表 1 份張貼於開票所門口，在不\n妨礙選舉人或投票權人閱覽之情況下，允許任何人\n拍攝。\n（十三）投（開）票報告表共 3 份，第 3 份張貼開票所門口。\n另 2 份送鄉（鎮、市、區）選務作業中心，其中第 1\n份應先裝入封袋由主任管理員會同主任監察員簽章\n密封，先派工作人員 1 人，送至鄉（鎮、市、區）選\n務作業中心核對無誤後輸入電腦；另 1 份俟開票所關\n閉後，由主任管理員會同主任監察員送回鄉（鎮、\n市、區）選務作業中心，鄉（鎮、市、區）選務作\n業中心收到主任管理員送回的投（開）票報告表，"}, {"p": 43, "t": "應與之前收到的投（開）票報告表核對，2 份報告表\n如有不一致之處，應向主任管理員查明更正。\n（十四）選舉之投（開）票報告表副本交付推薦候選人之政黨\n及未受政黨推薦之候選人所指派之人員：\n１、交付時間：自投（開）票報告表張貼後，至投開票所\n工作人員全部離開投開票所以前。\n２、得請求交付之人員：推薦候選人之政黨及未受政黨推\n薦之候選人所指派之人員應憑委託書領取。（格式見\n附錄十二）\n３、領取份數：每一推薦候選人之政黨及未受政黨推薦之\n候選人之領取，以 1 份為限。\n４、 投 （ 開） 票報 告 表 副本 填法 ： 應 將同 一內 容 之投\n（開）票報告表抄錄並校對無誤或以事務機器複印\n後，由主任管理員及主任監察員會同簽名並註記「副\n本」。\n５、交付記錄：備具投（開）票報告表副本領取清冊，清\n冊應載明政黨名稱或候選人姓名、指派人員姓名與領\n取時間，具領人員領取時，請其簽名或蓋章。（領取\n清冊格式見附錄十三）\n（十五）包封有效票、無效票、已領未投票、記票紙及投票通\n知單：\n１、每一種選舉之有效票以每一候選人為單位，以 100 張\n為一疊，分為若干疊，合併包封裝入有效票袋（注意\n應註明開票所編號類別及票數），無效票以 100 張為\n一疊，分為若干疊，包封裝入無效票袋，已領未投票\n裝入已領未投票袋，記票紙裝入記票紙袋，投票通知\n單裝入投票通知單封袋，有效票袋、無效票袋、已領"}, {"p": 44, "t": "未投票袋及記票紙袋裝入總投票袋，每一紙袋均應由\n主任管理員會同主任監察員於封口處加蓋印章。\n２、全國性公民投票案之同意票、不同意票，以 100 張為\n一疊，分別包封裝入同意票袋、不同意票袋（注意應\n註明開票所編號類別及票數），無效票以 100 張為一\n疊，分為若干疊，包封裝入無效票袋，已領未投票裝\n入已領未投票袋，記票紙裝入記票紙袋，投票通知單\n裝入投票通知單封袋，同意票袋、不同意票袋、無效\n票袋、已領未投票袋及記票紙袋裝入總投票袋，每一\n紙袋均應由主任管理員會同主任監察員於封口處加蓋\n印章。\n（十六）整理場地，檢查物品：督導全體工作人員整理場地回\n復原狀，檢查有無選舉票、公投票或開票物品遺\n漏。\n（十七）辦理工作人員簽退。\n（十八）護送選舉票及公投票等至鄉（鎮、市、區）選務作業\n中心：會同主任監察員將已包封完畢之選舉人名冊\n或投票權人名冊、用餘票、有效票、無效票、記票\n紙、投（開）票報告表、投票通知單及相關物品，\n在警衛人員護送下送至鄉（鎮、市、區）選務作業\n中心，俟鄉（鎮、市、區）選務作業中心清點核算\n無誤後，始得離去。\n二、檢票管理員職務：\n投票匭啟封後，將選舉票及公投票逐張檢取，立即轉交唱\n票管理員唱呼。\n三、唱票管理員職務：\n（一）選舉之唱票，應高舉選舉票，並將選舉票正面向參觀民\n眾展示，逐張將選舉票中所圈候選人之號次、姓名，"}, {"p": 45, "t": "用國語高聲唱出「○號○○○1 票」，唱票之快慢，以\n達到記票與唱呼之配合為度。2 組同時開票，應唱出\n「市長（或縣長或鄉長或鎮長或區長或村長或里長）\n○號○○○1 票」、「議員（或代表） ○號○○○1\n票」。\n（二）全國性公民投票案之唱票，應高舉公投票，並將公投票\n正面向參觀民眾展示，唱票管理員接到公投票時，用\n國語高聲唱出「同意票 1 票」、「不同意票 1 票」、\n「無效票 1 票」，「不同意票」不得唱為「反對票」，\n唱票之快慢，以達到記票與唱呼之配合為度。\n（三）唱完票後將選舉票、公投票交與整票計票員。選舉同額\n競選時，其開票亦應逐張唱名開票。選舉票、公投票\n有無效情事時，應即交由主任管理員會同主任監察員\n當場認定後唱票。\n四、記票管理員職務：\n（一）唱票管理員每唱 1 票時，記票管理員應即在選舉記票紙\n上各候選人號次、姓名及無效票下方格內，或全國性\n公民投票案記票紙同意票、不同意票、無效票下方格\n內，按「正」字筆劃順序記錄，每票劃 1 筆，每一\n「正」字 5 票。\n（二）記票時每記 1 票應配合唱票員之唱呼，複唱 1 次。\n（三）每張選舉記票紙上端應註明該候選人號次、姓名、無效\n票及記票紙張數。全國性公民投票案記票紙上端應註\n明該全國性公民投票案編號、同意票、不同意票、無\n效票及記票紙張數。\n（四）開票完畢，各候選人、選舉票無效票、公投票同意票、\n不同意票與公投票無效票最後 1 張之記票紙最後一個\n「正」字下方，應記載該候選人得票、選舉票無效"}, {"p": 46, "t": "票、公投票同意票、不同意票或公投票無效票之總票\n數，在記載總票數之前，應詳加計算並與整票計票管\n理員清點該候選人有效票、公投票同意票、不同意票\n複核無誤後再行記入，如有兩種以上選舉票或公投票\n時，應俟各種選舉票及公投票全部開完後，再予計算\n記入。\n五、整票計票管理員職務：\n（一）接到唱過之選舉票時，即按候選人及無效票等分類放\n置。接到唱過之公投票時，即按同意票、不同意票及\n無效票分類放置。\n（二）選舉票或公投票分類放置後，即利用時間，將各類選舉\n票或公投票隨時清點，以每 100 張為 1 疊，以便複算。\n（三）全部計票完畢，會同監察員分別複算，並與記票管理員\n核對無誤後，交由主任管理員會同主任監察員包封。\n六、主任監察員職務：\n（一）綜理開票之監察事務，監察開票所管理人員辦理開票有\n無違法情事。\n（二）分配監察員職務：\n１、檢票唱票監察員。\n２、記票監察員。\n３、整票計票監察員。\n前項工作人員，主任監察員得視人力多寡分配之。\n（三）會同主任管理員辦理事項：\n１、佈置開票所。\n２、認定無效票。\n３、填具投（開）票報告表開票部分。\n４、張貼投（開）票報告表。\n５、填發選舉投（開）票報告表副本。"}, {"p": 47, "t": "６、包封有效票、無效票、已領未投票、記票紙及投票通\n知單，於封口處加蓋印章。\n７、整理場地，檢查物品。\n８、護送選舉票及公投票等至鄉（鎮、市、區）選務作業\n中心。\n七、監察員職務：\n（一）檢票唱票、記票、整票計票處監察員，分別監察管理員\n辦理檢票、唱票、記票、整票計票，有無違法情事。\n（二）主任管理員與主任監察員認定無效票有爭議時，由全體\n監察員表決之。表決結果正反意見同數者，該選舉票\n或公投票應為有效票。\n八、投開票所工作人員如有未依標準作業程序辦理開票作業情\n事，由直轄市、縣（市）選舉委員會於調查事實後，依據\n投開票所工作人員實際執行投開票工作情形覈實辦理獎\n懲。"}, {"p": 48, "t": "陸、警衛人員職務\n一、投開票所之警衛人員，由直轄市、縣（市）選舉委員會洽\n請當地警察機關調派之。\n二、負責投開票所安全之維護及秩序之維持，並受投開票所主\n任管理員之指導監督及主任監察員之監察辦理下列事項：\n（一）依鄉（鎮、市、區）選務作業中心通知時間，會同主任\n管理員及主任監察員護送選舉票、公投票至投開票\n所。\n（二）選舉人或投票權人如有擁擠或不守秩序之勸導事項。\n（三）協助禁止選舉人、投票權人、其陪同家屬或陪同之人攜\n帶手機或其他攝影器材進入投票所（但已關閉電源之\n行動裝置，不在此限），以及協助禁止非選舉人、投\n票權人及其照顧之 6 歲以下兒童或不屬於因身心障礙不\n能自行圈投而能表示其意思者之陪同家屬 或陪同之\n人，或未佩帶各級選舉委員會製發證件者，進入投票\n所。\n（四）選舉人在投票所、開票所有：１、在場喧嚷或干擾勸誘\n他人投票或不投票，不服制止者。２、攜帶武器或危\n險物品入場者。３、投票進行期間，穿戴或標示政\n黨、政治團體、候選人之旗幟、徽章、物品或服飾，\n不服制止者。４、干擾開票或妨礙他人參觀開票，不\n服制止者。５、有其他不正當行為，不服制止者。經\n投開票所主任管理員會同主任監察員令其退出投開票\n所之執行事項。\n（五）投票權人在投票所、開票所有：１、穿著佩帶具有公民\n投票相關文字、符號或圖像之貼紙、服飾或其他物\n品、在場喧嚷或干擾、勸誘他人投票或不投票，不服"}, {"p": 49, "t": "制止者。２、攜帶武器或危險物品入場者。３、有其\n他不正當行為，不服制止者。經投開票所主任管理員\n會同主任監察員令其退出投開票所之執行事項。\n（六）經投開票所主任管理員指示糾正或制止事項。\n（七）投開票所四周 30 公尺內，有民眾喧嚷、干擾或勸誘他\n人投票或不投票，應予以制止，經制止後仍繼續為之\n者，應聯絡警察單位派員處理。\n（八）於下午 4 時整投票時間截止時，協助維持隊末秩序。\n（九）開票完畢後，應與主任管理員及主任監察員會同護送選\n舉票及公投票至鄉（鎮、市、區）選務作業中心。\n（十）主任管理員其他交辦事項。"}, {"p": 50, "t": "柒、投票及開票時遇有緊急情況之處理\n一、 選舉、公民投票之投票或開票，遇有天災或其他不可抗力\n情事，應依公職人員選舉罷免法第 66 條、選舉投票日前\n或投開票當日發生天災或其他不可抗力情事處理辦法、中\n央選務指揮及應變中心作業要點、直轄市縣市選舉委員會\n選務應變中心作業要點及選舉投票日前或投開票當日發生\n天災或其他不可抗力情事處理辦法及全國性公民投票投票\n日前或投開票當日發生天災或其他不可抗力情事處理注意\n事項辦理。\n二、投開票當日發生天災或其他不可抗力情事之處理\n（一）投開票當日發生或預見將發生天災或其他不可抗力情\n事，致個別投開票所，不能投票或開票時：\n1、各該投、開票所主任管理員應通知鄉（鎮、市、區）\n選務作業中心，並報請直轄市、縣（市）選舉委員會\n由主管選舉委員會改定投開票日期或逕行改定投開票\n場所，直轄市、縣（市）選舉委員會應提委員會議審\n議決定是否報請中央選舉委員會改定投開票日期或逕\n行改定投開票場所。\n2、本次地方公職人員選舉有多種公職人員選舉同日於同\n一投票所舉行投票，各該投開票所有縣市級以上公職\n人員選舉，經由直轄市、縣（市）選舉委員會報中央\n選舉委員會核准，改定投開票日期時，同一投開票所\n其他公職人員選舉之投開票日期，由各該主管選舉委\n員會配合一併改定之。\n3、直轄市、縣（市）選舉委員會如經決定報請中央選舉\n委員會改定投開票日期，應先向中央選務指揮及應變\n中心通報，函報中央選舉委員會核准，並由中央選舉"}, {"p": 51, "t": "委員會發布停止投票公告；改定之投開票日期，由中\n央選舉委員會於改定之投開票日 3 日前公告。\n4、直轄市、縣（市）選舉委員會如經決定改定投開票場\n所，應先填具「改定投開票場所之鄉（鎮、市、區）\n投開票所一覽表」（參考格式如附錄十四）傳真或電\n話通報中央選務指揮及應變中心，函報中央選舉委員\n會備查，並由直轄市、縣（市）選舉委員會發布改定\n投開票場所公告。\n（二）天災或其他不可抗力情事，發生在投票進行中時，投票\n所主任管理員經通知鄉（鎮、市、區）選務作業中\n心，並報請直轄市、縣（市）選舉委員會改定投票場\n所後，應將尚未發出之選舉票、 公投票、選舉人名\n冊、投票權人名冊妥善包封，並將投票匭密封後，一\n併攜帶至改定之投票所繼續投票；如所發生天災或其\n他不可抗力情事，致無法改定投票場所時，經通知鄉\n（鎮、市、區）選務作業中心，並報請直轄市、縣\n（市）選舉委員會陳報中央選舉委員會核准改定投票\n日期後，應將尚未發出之選舉票、公投票、選舉人名\n冊、投票權人名冊妥善包封，並將投票匭密封後，一\n併攜回鄉（鎮、市、區）選務作業中心或其指定之場\n所。\n（三）天災或其他不可抗力情事，發生在投票結束後，開票進\n行中時，開票所主任管理員經通知鄉（鎮、市、區）\n選務作業中心，並報請直轄市、縣（市）選舉委員會\n改定開票場所後，應將用餘票、已完成開票之選舉\n票、公投票、選舉人名冊、投票權人名冊妥善包封，\n並將投票匭密封後，一併攜帶至改定之開票所繼續開\n票；如所發生天災或其他不可抗力情事，致無法改定"}, {"p": 52, "t": "開票場所時，通知鄉（鎮、市、區）選務作業中心，\n並經報請直轄市、縣（市）選舉委員會陳報中央選舉\n委員會核准改定開票日期後，應將用餘票、已完成開\n票之選舉票、公投票、選舉人名冊、投票權人名冊妥\n善包封，並將投票匭密封後，一併攜回鄉（鎮、市、\n區）選務作業中心。\n（四）改定投開票所場所時，直轄市、縣（市）選舉委員會應\n督導鄉（鎮、市、區）選務作業中心通知投開票所工\n作人員至改定之投開票場所執行職務，洽警察機關派\n員護送選舉票及公投票，並指派預備員或其他工作人\n員協助將選舉票、公投票、選舉人名冊、投票權人名\n冊、圈票處遮屏、票匭及各項物品運送至改定之投開\n票場所，協助佈置投開票所。\n（五）直轄市、縣（市）選舉委員會發布改定投開票所地點公\n告，鄉（鎮、市、區）選務作業中心應於原投開票場\n所張貼指示，提供簡要地圖或說明內容，並安排工作\n人員引導選舉人或投票權人，前往改定投開票所繼續\n投票。改定投票場所後，主任管理員於下午 4 時整應即\n宣布投票時間截止，但對於投票時間截止前到達投票\n所之選舉人或投票權人仍應准其投票。為防止在投票\n時間截止後到場者插隊，應指派專人手持「投票排隊\n終點」標語站於隊末，以利選舉人或投票權人識別，\n並請警衛人員協助維持隊末秩序。\n三、遇有空襲時應行注意事項：\n（一）在投票時間內，如遇空襲，主任管理員應即會同主任監\n察員指揮迅作如下處理：\n１、選舉人或投票權人已領票者，應請迅速投畢。"}, {"p": 53, "t": "２、領票處管理員，應立即停止發票，並將選舉人名冊或\n投票權人名冊及未發之選舉票或公投票，妥慎包封，\n攜帶疏散負責保管。\n３、投票處管理員，應即將投票匭封鎖，妥為安置。\n４、將投票所大門關閉，全體工作人員，應即疏散。\n（二）空襲警報解除後，如投票時間尚未截止，應繼續投票，\n在繼續投票前，主任管理員應會同主任監察員，根據\n選舉人名冊或投票權人名冊，核對已發票數及剩餘票\n數，是否相符，再繼續投票。\n（三）空襲時間過長，致影響投票時，主任管理員應會同主任\n監察員，將當日情形，陳報直轄市、縣（市）選舉委員\n會處理。\n（四）在開票時間內，如遇空襲，主任管理員應即會同主任監\n察員指揮迅作如下之處理：\n１、立即停止開票，並將已唱之票，全部投入投票匭，嚴\n密封鎖，並妥為安置。\n２、將開票所大門關閉，熄滅燈火，全體工作人員，應即\n疏散。\n（五）空襲警報解除後，應繼續開票，但如空襲時間過長致不\n能開票時，主任管理員應會同主任監察員通知鄉（鎮、\n市、區）選務作業中心，報請直轄市、縣（市）選舉委\n員會處理。"}, {"p": 54, "t": "捌、協助身心障礙選舉人或投票權人投票注意事項\n一、協助身心障礙選舉人或投票權人投票應有之態度：\n身心障礙選舉人或投票權人至投票所投票時，投票所\n工作人員應本尊重之精神，以真誠和藹之態度，主動予以\n適當協助，以方便其行使選舉權或投票權。提供身心障礙\n選舉人或投票權人協助時，應注意其協助方式之適當性，\n不得損害其個人尊嚴。\n二、公職人員選舉罷免法第 18 條第 3 項眼同協助或代為圈投規\n定之定義與執行：\n（一）公職人員選舉罷免法第 18 條第 3 項規定：「選舉人領\n得選舉票後應自行圈投。但因身心障礙不能自行圈投\n而能表示其意思者，得依其請求，由家屬或陪同之人\n一人在場，依據本人意思，眼同協助或代為圈投；其\n無家屬或陪同之人在場者，亦得依其請求，由投票所\n管理員及監察員各一人，依據本人意思，眼同協助或\n代為圈投。」其身心障礙者不以領有身心障礙手冊人\n員為限，凡因身心障礙，不能自行圈投而能表示其意\n思者，均適用上開法條規定。\n（二）定義：\n１、「不能自行圈投」，係指肢體功能不健全致不能自行\n圈投，心智障礙者如肢體功能健全，仍應自行圈投。\n「能表示意思」，以口頭明示之意思表示為限，但有\n語言障礙而無法口頭意思表示者，得以其他明示之意\n思表示為之。（93 年 1 月 7 日中選一字第 0933100006\n號、93 年 1 月 20 日中選一字第 0933100027 號函）心\n智障礙者如其肢體功能健全，不得由家屬代為圈選，\n仍應由本人親自圈選，但工作人員不得以確認陪同家"}, {"p": 55, "t": "屬或陪同之人是否依據本人意思，眼同協助或代為圈\n投為由，窺視刺探選舉人圈選選舉票或投票權人圈蓋\n公投票之內容。\n２、如遇家屬或陪同之人輔助身心障礙選舉人或投票權人\n投票，投票所工作人員應向該身心障礙選舉人或投票\n權人確認該家屬或陪同之人確實為其選擇之輔助投票\n人員。\n（三）執行：\n１、部分身心障礙選舉人或投票權人從外觀上難以認定其\n是否確屬公職人員選舉罷免法第 18 條第 3 項「不能\n自行圈投」者，如認定有爭議時，選舉人或投票權人\n得出示身心障礙證明，作為判斷標準。\n２、身心障礙不能自行圈投而能表示其意思無家屬或陪同\n之人在場者，請求協助或代為圈投時，應由管理員及\n監察員各 1 人，確實依據選舉人或投票權人本人之明\n確意思，謹慎眼同協助或代為圈投。\n三、照顧身心障礙及有需要之選舉人或投票權人：\n身心障礙及有需要之選舉人或投票權人行動困難，應\n予照顧扶助，如必須引至圈票處，於到達時立即退回原位\n置工作，俟其圈票完畢，招請時，再前進扶引至投票處投\n票。選舉人或投票權人圈選時，工作人員應將布簾放下，\n且不得窺探圈選內容。\n四、協助乘坐輪椅之選舉人或投票權人：\n（一）如為乘坐輪椅選舉人或投票權人，遇有上下坡道時，投\n票所工作人員應主動予以協助通行，並洽商其他在場\n選舉人或投票權人，禮讓其優先投票。\n（二）投票所應設置適合乘坐輪椅選舉人或投票權人使用之圈\n票處遮屏，以方便其投票。"}, {"p": 56, "t": "五、圈票處遮屏及投票匭之擺放：\n為利身心障礙選舉人或投票權人圈投選舉票、公投票，投\n票所內之圈票處遮屏、投票匭擺放位置，應考量身心障礙\n選舉人或投票權人之需求與便利性進行設置。其中投票匭\n之擺放，投票匭上緣距離地板面高度不得大於 85 公分，投\n票口深度不得大於 25 公分。\n六、領票、圈票及投票之動線應有利於身心障礙選舉人或投票\n權人使用，並保持暢通。\n七、與視障選舉人或投票權人交談及引導：\n（一）投票所工作人員應主動將投票所內相關規定及程序，適\n時告知視障選舉人或投票權人。\n（二）投票所工作人員與視障選舉人或投票權人交談時，應以\n一般音量及音調表達，如須引導視障選舉人或投票權\n人行走時，投票所工作人員站立於視障選舉人或投票\n權人之左前方（約半步至一步之距離），並讓視障選\n舉人的手搭在投票所工作人員的右肩上或右手肘上，\n不要抓著視障選舉人或投票權人的手臂，在引導過程\n中告知所在路況與位置，如高低差、障礙物等，以協\n助其順利完成投票。\n八、投票所應備置視障者投票輔助器，輔助視障選舉人或投票\n權人自行圈投，其協助方式及步驟如下：\n（一）投票所主任管理員於視障選舉人或投票權人至投票所投\n票時，應向該視障選舉人或投票權人說明投票所備有\n投票輔助器，並詢問視障選舉人或投票權人係自行圈\n投或由他人協助，如使用視障者投票輔助器，應向視\n障選舉人或投票權人說明其使用方法，輔助視障選舉\n人或投票權人自行圈蓋選舉票或公投票。"}, {"p": 57, "t": "（二）視障選舉人或投票權人如需使用投票輔助器時，應由視\n障選舉人或投票權人之陪同家屬、陪同之人或投票所\n主任管理員協助視障選舉人或投票權人將選舉票或公\n投票夾入投票輔助器，並對齊後，交予視障選舉人或\n投票權人進行圈選。如使用紙製視障者投票輔助器，\n投票所主任管理員得協助以長尾夾加強固定。\n（三）選舉票或公投票夾入投票輔助器後，應由視障選舉人或\n投票權人之陪同家屬、陪同之人或投票所工作人員導\n引視障選舉人至圈票處，指引圈票處圈選工具與印泥\n擺放位置，並提醒避免雙手沾到印泥污染選舉票或公\n投票後，由視障選舉人或投票權人自行圈蓋選舉票。\n視障選舉人或投票權人如請求陪同家屬、陪同之人或\n投票所管理員及監察員協助，投票所工作人員不得拒\n絕。\n（四）使用視障者投票輔助器，以 1 次 1 張選舉票、1 次 1 張\n公投票為原則，逐張遞送予視障選舉人或投票權人，\n以利其完成圈選。視障選舉人或投票權人圈蓋選舉票\n或公投票完畢後，除視障選舉人或投票權人要求協助\n外，應由視障選舉人或投票權人自行將投票輔助器內\n之選舉票或公投票抽出摺疊後，放置於遮屏內之圈票\n隔板上，待完成所有選舉票及公投票之圈選後，再由\n其陪同家屬、陪同之人或投票所工作人員引導，將選\n舉票依選舉種類或公投票依案別投入投票匭，投票輔\n助器交還投票所工作人員。\n（五）圈蓋選舉票方式係將選舉票夾入投票輔助器後，由視障\n選舉人觸摸投票輔助器上之候選人號次之點字與號次\n上方挖空之圈選欄方格，對準方格內之選舉票圈選欄\n蓋圈選戳記。視障選舉人如未受點字教育者，仍可自"}, {"p": 58, "t": "左而右摸數投票輔助器上挖空之圈選方格順序，找出\n所屬意之候選人之圈選欄位置，圈蓋圈選戳記。\n（六）圈蓋公投票方式係將公投票夾入投票輔助器後，由視障\n投票權人觸摸輔助器上同意欄、不同意欄之符號（同\n意欄符號為○，不同意欄符號為Ｘ）上方挖空之圈選\n欄方格，對準方格內之公投票圈選欄蓋圈選戳記。\n（七）投票所工作人員應隨時維持投票輔助器清潔，以免視障\n選舉人或投票權人投票時沾污選舉票或公投票。\n（八）視障選舉人或投票權人如不擬使用投票輔助器投票，仍\n可由視障選舉人或投票權人之陪同家屬或陪同之人，\n依據視障選舉人或投票權人意思，眼同協助或代為圈\n投；其無陪同家屬或陪同之人在場者，亦得依其請\n求，由投票所管理員及監察員各 1 人，依據其本人意\n思，眼同協助或代為圈投。\n（九）投票輔助器於投開票完畢後，應交回鄉（鎮、市、區）\n選務作業中心轉交直轄市、縣（市）選舉委員會集中\n保管。\n九、協助聽障選舉人或投票權人投票：\n（一）為利聽障選舉人或投票權人瞭解投票所內相關規定及程\n序，投票所內應製備文字標示，例如「不得攜帶手機\n進入投票所」、「請出示國民身分證」、「請提供印\n章」等，並張貼於顯著位置。\n（二）對於聽障選舉人或投票權人提出投票相關疑問時，現場\n工作人員應友善的即時以文字、溝通圖卡、清楚的嘴\n型或手語提供解答。與聽障選舉人 或投票權人交談\n時，應與其面對面，眼睛直視對方，慢慢地說，使聽\n障選舉人或投票權人可由投票所工作人員的臉部表情\n和唇形變化，得知表達的訊息，但不誇大嘴形，避免"}, {"p": 59, "t": "限制聽障選舉人或投票權人讀唇語之能力。若聽障選\n舉人或投票權人不瞭解某一個字、詞、語，可換用其\n它的說法或語句，或用紙、筆書寫。\n十、投票所宜視選舉人或投票權人人數多寡，適度增加工作人\n員協助身心障礙選舉人或投票權人投票。\n十一、為利身心障礙選舉人或投票權人觀看開票過程，開票所\n工作人員如發現有身心障礙選舉人或投票權人在場時，\n應主動協助將其安排在容易觀看開票之位置。\n十二、主任管理員應督導工作人員落實執行協助身心障礙選舉\n人或投票權人投票相關措施，身心障礙選舉人或投票權\n人如有需要協助時應及時處理。"}, {"p": 60, "t": "玖、其他\n一、開票延宕原因，如係因路途遙遠、天色昏暗、道路中斷、\n交通工具故障等因素，致無法派員送達投（開）票報告\n表，應以電話（手機）、傳真、電子郵件、電腦網際網路\n等替代方式，迅速將開票情況報告鄉（鎮、市、區）選務\n作業中心，以利電腦計票，並補送投（開）票報告表。\n二、主任管理員與主任監察員將選舉票、公投票及投（開）票\n報告表等送往鄉（鎮、市、區）選務作業中心，並離去\n後，至計票中心正式公布選舉及公民投票結果前，手機仍\n應保持暢通，以利聯繫。\n三、由於投開票所工作時間長，工作人員之體力與精神負擔均\n相當大，早出晚歸天色昏暗，因此，各投開票所工作人員\n務必做好車輛安全檢查，行車保持安全距離，勿超速駕\n駛，並特別注意巷口、十字路口應減速及大車之視線死\n角，以維護自身安全。"}, {"p": 61, "t": "拾、附錄\n附錄一、採「領、領、投」方式投票所佈置圖例\n圈 票 處\n○\n監察員\n○\n管理員\n等待圈票線\n管\n理 ○\n員\n公 領 選舉\n管 投 票 票匭\n理 ○ 票 處 投\n員 選舉\n監 票匭\n察 ○\n員 管\n○理票\n管 員\n理 ○ 選 領 公投\n員 舉 票 票匭\n票 處 處\n管\n理 ○\n員\n○\n○\n主任管理員\n主任監察員\n入口 出口\n○\n手機放置處 管理員\n說明：\n一、 選舉人先至「選舉票領票處」領取選舉票，次至「公投票領票處」領取公投票；領取選舉\n票與公投票後，再至「圈票處」圈選選舉票與公投票；圈票後至「投票處」，分別將選舉\n票與公投票投入選舉票匭與公投票匭。\n二、 僅領公投票之投票權人，由投票所工作人員引導，沿選舉領票動線至公投票領票處領票。\n三、 圈票處遮屏缺口朝外（朝向投開票所工作人員）。\n四、 工作人員視實際狀況調整配置。\n五、 投票匭旁之適當位置設置座椅，管理員原則應坐於座椅上執行職務，嚴防選舉人（投票權\n人）攜出選舉票（公投票）等情事。"}, {"p": 62, "t": "附錄二、開票所佈置圖例\n置 位 貼 張 紙 票 記\n投票匭\n距 1.5 公尺以上\n為宜\n說明：\n一、 投票匭與參觀席應保持相當距離。\n二、 開票處與參觀席應用桌椅或木槓等隔離，避免觀眾進入，\n高度不能妨礙參觀人員視線。\n三、 記票紙應貼在開票所內堂正面，非因特殊必要勿向兩側張\n貼。\n四、 整理選舉票或公投票宜在桌上。"}, {"p": 63, "t": "附錄三、投票所及開票所應用物品清單\n項 目 與 品 名 數 量 備 註\n一、書冊與一般表件\n1 工作人員簽到簽退簿 1本\n2 工作人員工作費印領清冊 2份\n3 工作人員手冊 每 1 工作人員 講 習 會 時\n1 本 發給\n4 工作人員證件 每人 1 只\n5 選舉人名冊、投票權人名冊 1份\n6 選舉人名冊、投票權人名冊封袋 1 個 酌發\n7 選舉、公民投票通知單封袋 1個\n8 選舉人或投票權人到達投票所證明書 疊 酌發\n9 選舉整票用候選人名單 1張\n10 選舉、公民投票投（開）票報告表 3份\n11 選舉、公民投票投開票報告表密封袋 1個 開票完畢\n後，指派\n專人速送\n鄉（鎮、\n市、區）\n選務作業\n中心使用\n12 投 \n（4） （5） （6）\n說明：同（3）理由。 說明：同（3）理由。 說明：圈選於相鄰組或候\n選人或政黨共用空間，且\n圈印加蓋於欄格線外，不\n能辨別為圈選何組或何人\n或何政黨者，應屬無效\n票。"}, {"p": 82, "t": "（7） （8） （9）\n說明：圈選後加以塗改另 說明：圈選後加以塗改 說明：簽名者，應屬無效\n行圈選者，應屬無效票。 者，應屬無效票。 票。\n（10） （11） （12）\n說明：圈選後加以簽名 說明：蓋章者，應屬無效 說明：圈選後加以蓋章\n者，應屬無效票。 票。 者，應屬無效票。"}, {"p": 83, "t": "（13） （14） （15）\n說明：按指印者，應屬無 說明：同（13）理由。 說明：同（13）理由。\n效票。\n（16） （17） （18）\n說明：圈選後加以按指印 說明：同（16）理由。 說明：同（16）理由。\n者，應屬無效票。"}, {"p": 84, "t": "（19） （20） （21）\n說明：圈選後記載任何 說明：劃寫符號者，應 說明：圈選後加以劃寫\n文字者，應屬無效票。 屬無效票。 符號者，應屬無效票。\n（22） （23） （24）\n說明：將選舉票任何一 說明：將選舉票污染致 說明：不用選舉委員會\n角撕破致不完整者，應 不能辨別所圈為何組或 製備之圈選工具圈選\n屬無效票。 何人或何政黨者，應屬 者，應屬無效票。\n無效票。"}, {"p": 85, "t": "（25）\n漏印關防之選舉票\n為無效票。"}, {"p": 86, "t": "附錄十、公民投票公投票有效與無效之認定圖例"}, {"p": 87, "t": ""}, {"p": 88, "t": ""}, {"p": 89, "t": ""}, {"p": 90, "t": ""}, {"p": 91, "t": ""}, {"p": 92, "t": ""}, {"p": 93, "t": ""}, {"p": 94, "t": ""}, {"p": 95, "t": "附錄十一、投（開）票報告表快遞封袋參考格式"}, {"p": 96, "t": "115 年全國性公民投票\n投（開）票報告表\n快遞封袋\n投開票所 ○○鄉（鎮、市、區）第○投（開）票所\n主任管理員 簽名或蓋章\n主任監察員 簽名或蓋章\n送 達 員 簽名或蓋章\n公所收件人 簽名或蓋章\n※上列人員均應核對投（開）票報告表票數無誤後核章"}, {"p": 97, "t": "附錄十二、投（開）票報告表副本領取委託書格式\n一、推薦候選人之政黨領取投(開)票報告表副本委託書\n茲指派 領取 年\n選舉投(開)票報告表副本乙份。\n政黨或其分支機構 簽章\n圖 記\n中 華 民 國 年 月 日\n說明：\n一、「指派」之後填寫指派人員姓名。\n二、「選舉」之前填寫選舉年度及種類。如「115 年地方公職人員」。\n三、「圖記」欄應加蓋中央主管機關（內政部）發給該黨之圖記。（得以套印為\n之。）\n四、政黨簽章，須書明政黨全銜或其分支機構名稱。\n五、投(開)票報告表副本，由推薦候選人之政黨所指派之人員，於投(開)票報告\n表張貼於投(開)票所門口後，至投(開)票所全部工作人員離開投(開)票所\n前，憑委託書至投(開)票所領取。每一推薦候選人之政黨以領取 1 份為限。"}, {"p": 98, "t": "二、未受政黨推薦之候選人所指派之人員領取投(開)票報告表副本\n委託書\n茲指派 領取 年\n選舉投(開)票報告表副本乙份。\n未受政黨推薦之候選人 簽章\n中 華 民 國 年 月 日\n說明：\n一、「指派」之後填寫指派人員姓名。\n二、「選舉」之前填寫選舉年度及種類。如「115 年直轄市市長」、「115 年\n縣議員」。\n三、投(開)票報告表副本，由未受政黨推薦之候選人所指派之人員，於投(開)\n票報告表張貼於投(開)票所門口後，至投(開)票所全部工作人員離開投\n(開)票所前，憑委託書至投(開)票所領取。每一未受政黨推薦之候選人以\n領取 1 份為限。"}, {"p": 99, "t": "附錄十三、投（開）票報告表副本領取清冊格式\n115 年地方公職人員選舉 縣市 鄉鎮市區 第 投(開)票所 投(開)票報\n告表副本領取清冊\n政 黨 名 稱指 派 人 員\n領 取 時 間具 領 人 員備 考\n或 姓 名 簽 名 或 蓋 章\n候 選 人 姓 名\n年 月 日\n時 分\n說明：\n一、第一欄「政黨名稱」填寫推薦候選人之政黨，「候選人姓名」填寫未受政黨\n推薦之候選人。本欄得事先填妥。\n二、投(開)票所主任管理員與主任監察員交付投(開)票報告表副本時，推薦候選\n人之政黨及未受政黨推薦之候選人所指派之人員，應憑委託書，於投(開)票\n報告表張貼於投(開)票所門口後，至投(開)票所全部工作人員離開投(開)票\n所前領取之。每一推薦候選人之政黨及未受政黨推薦之候選人（或未受政黨\n推薦之同一組候選人）以領取 1 份為限。"}, {"p": 100, "t": "附錄十四、相關法規節錄\n壹、選舉投票日前或投開票當日發生天災或其他不可抗力情事\n處理辦法\n第 一 條 本辦法依總統副總統選舉罷免法第六十二條第四項規定及\n公職人員選舉罷免法第六十六條第四項規定訂定之。\n第 二 條 總統副總統選舉罷免法第六十二條第一項及公職人員選舉\n罷免法第六十六條第一項所定天災或其他不可抗力情事如\n下：\n一、發生或可預見將發生颱風、地震、洪水等天災，經通\n報權責機關依天然災害停止辦公及上課作業辦法宣布\n停止上班者。\n二、其他不可預見或不可避免之自然災害或事件，致個別\n投開票所不能投票或開票。\n第 三 條 選舉投票日前或投開票當日，發生或可預見將發生天災或\n其他不可抗力情事，致個別投開票所，不能投票或開票\n時，依下列規定辦理：\n一、總統、副總統選舉及縣（市）級以上選舉，由直轄\n市、縣（市）選舉委員會報中央選舉委員會核准，改\n定投開票日期；或由直轄市、縣（市）選舉委員會逕\n行改定投開票場所，並報中央選舉委員會備查。\n二、前款以外之選舉，由直轄市、縣（市）選舉委員會改\n定投開票日期或場所，並報中央選舉委員會備查。\n第 四 條 前條天災或其他不可抗力情事，發生在投票進行中時，由\n各該投票所主任管理員報請所屬選舉委員會改定投票場所\n後，應將選舉票及選舉人名冊妥善包封攜帶至改定之投票\n所繼續投票；如所發生天災或其他不可抗力情事，致無法\n改定投票場所時，報請所屬選舉委員會改定或由該選舉委"}, {"p": 101, "t": "員會報中央選舉委員會改定投票日期後，應將選舉票及選\n舉人名冊妥善包封攜回選務作業中心。\n前條天災或其他不可抗力情事，發生在投票結束後，開票\n進行中時，由各該開票所主任管理員報請所屬選舉委員會\n改定開票場所後，應將選舉票及選舉人名冊妥善包封攜帶\n至改定之開票所繼續開票；如所發生天災或其他不可抗力\n情事，致無法改定開票場所時，報請所屬選舉委員會改定\n或由該選舉委員會報中央選舉委員會改定開票日期後，應\n將選舉票及選舉人名冊妥善包封攜回選務作業中心。\n第 五 條 第三條不能投票或開票之投開票所，已達或可預見其將達\n各該選舉區三分之一以上投開票所不能投票或開票時，主\n管選舉委員會應逕行改定該選舉區投開票日期。但總統、\n副總統選舉不能投票或開票之投開票所已達或可預見其將\n達各直轄市、縣（市）三分之一以上投開票所，不能投票\n或開票時，各該直轄市、縣（市）選舉委員會應報中央選\n舉委員會，改定各該直轄市、縣（市）之投開票日期；全\n國有三分之一以上直轄市、縣（市）投開票所，不能投票\n或開票時，中央選舉委員會應逕行改定投開票日期。\n總統、副總統選舉與公職人員選舉，或二種以上公職人員\n選舉同日於同一投票所舉行投票，各該投開票所有總統、\n副總統選舉或其中一種公職人員選舉，經依第三條或前項\n規定改定投開票日期時，同一投開票所其他公職人員選舉\n之投開票日期，由各該主管選舉委員會配合一併改定之。\n第 六 條 遇有天災或其他不可抗力情事，經改定投票、開票日期或\n場所時，主辦選舉委員會應透過大眾傳播媒體、村（里）\n幹事或其他適當管道，周知當地選舉人。\n前項改定之投開票日期，應由主管選舉委員會於投開票日\n三日前公告。"}, {"p": 102, "t": "第 七 條 投票日遇有天災或其他不可抗力情事，直轄市、縣（市）\n選舉委員會應與通報權責機關或其他相關機關保持聯繫，\n以決定投票日應變措施。\n第 八 條 本辦法規定，於公職人員之罷免及全國性公民投票準用\n之 。\n第 九 條 本辦法自發布日施行。"}, {"p": 103, "t": "貳、全國性公民投票投票日前或投開票當日發生天災或其他不\n可抗力情事處理注意事項\n一、為規範全國性公民投票投票日前或投開票當日發生天災或其他不可\n抗力情事應變處理作業機制，以利投開票及計票作業順利進行，\n特訂定本注意事項。\n二、全國性公民投票投票日前或投開票當日發生天災或其他不可抗力情\n事之處理，依公民投票法第二十四條準用公職人員選舉罷免法第\n六十六條、選舉投票日前或投開票當日發生天災或其他不可抗力\n情事處理辦法、中央選務指揮及應變中心作業要點、直轄市縣市\n選舉委員會選務應變中心作業要點及本注意事項辦理。\n三、本注意事項所稱天災或其他不可抗力情事如下：\n（一）發生或可預見將發生風災、水災、震災、土石流災害等天\n災，經直轄市、縣(市)政府或鄉(鎮、市、區)公所依天然災\n害停止上班及上課作業辦法宣布停止上班者。\n（二）其他不可預見或不可抗力之自然災害或事件，致個別投開票\n所不能投票或開票。\n四、投票日前發生天災或其他不可抗力情事\n（一）投票日前中央選舉委員會、直轄市、縣（市）選舉委員會應\n密切注意天災發生或可預見將發生天災或其他不可抗力情\n事，並與權責機關密切保持聯繫，掌握災情狀況或是否有致\n災之虞，並評估是否有停止上班致須改定投開票日期或場所\n之必要，以及進行應變準備。\n（二）直轄市、縣(市)政府災害應變中心二級以上開設時以及經評\n估有必要時，直轄市、縣(市)選舉委員會總幹事或副總幹事\n應向主任委員報告，依據公民投票法第二十四條準用公職人\n員選舉罷免法第六十六條及選舉投票日前或投開票當日發生\n天災或其他不可抗力情事處理辦法規定，經直轄市、縣(市)\n政府或鄉(鎮、市、區)公所依天然災害停止上班及上課作業"}, {"p": 104, "t": "辦法宣布停止上班地區，該區域辦理之全國性公民投票應改\n定投票日期，以及投開票作業應變準備情形。\n（三）直轄市、縣(市)選舉委員會應與直轄市、縣(市)政府災害應\n變中心、權責機關及相關機關保持密切聯繫，掌握天災可能\n危害範圍及規模，以及直轄市、縣(市)政府或鄉(鎮、市、\n區)公所依天然災害停止上班及上課作業辦法宣布停止上班之\n地區。\n（四）直轄市、縣(市)選舉委員會應督導鄉(鎮、市、區)選務作業\n中心針對設置於易積水地區、山坡地老舊聚落、土石流潛勢\n地區等高風險區域之投開票所，密切觀察注意投票日是否有\n影響投票或開票進行情形，並預為規劃改定之投開票場所，\n以應改定投開票場所需要。\n（五）直轄市、縣(市)選舉委員會應檢視公投票、投票權人名冊、\n投開票所應用物品（如圈票處遮屏、公投票匭等）存放地\n點，避免因天災致公投票、投票權人名冊、投開票所應用物\n品破損、汙染或銷燬等情事發生。\n（六）可預見投票日前一日將發生天災或其他不可抗力情事，鄉\n(鎮、市、區)選務作業中心辦理點領公投票、投票權人名\n冊、投開票所應用物品、佈置投開票所等作業，得視需要提\n前至投票日前二日辦理。\n（七）直轄市、縣(市)政府或鄉(鎮、市、區)公所宣布停止上班地\n區，以及經直轄市、縣（市）選舉委員會評估因天災或其他\n不可抗力情事，致個別投開票所不能投票或開票時，應由直\n轄市、縣（市）選舉委員會報中央選舉委員會核准，改定投\n開票日期或場所。\n（八）中央選舉委員會應經委員會議審議決定是否核准改定投開票\n日期或場所，如經決定改定投開票日期，由中央選舉委員會\n發布停止投票公告，改定之投開票日期，由中央選舉委員會"}, {"p": 105, "t": "於改定之投開票日三日前公告；改定之投開票場所，由直轄\n市、縣(市)選舉委員會公告。\n五、投開票當日發生天災或其他不可抗力情事\n（一）投開票當日發生或預見將發生天災或其他不可抗力情事，致\n個別投開票所，不能投票或開票時：\n1、各該投、開票所主任管理員應通知鄉(鎮、市、區)選務作\n業中心，並報請直轄市、縣（市）選舉委員會核准，改定\n投開票日期或場所，直轄市、縣（市）選舉委員會應提委\n員會議審議決定是否改定投開票日期或場所。\n2、直轄市、縣（市）選舉委員會如經決定改定投開票日期，\n應先向中央選務指揮及應變中心通報，函報中央選舉委員\n會備查，並由直轄市、縣(市)選舉委員會發布停止投票公\n告；改定之投開票日期，由中央選舉委員會於改定之投開\n票日三日前公告。\n3、直轄市、縣（市）選舉委員會如經決定改定投開票場所，\n應先填具「改定投開票場所之鄉鎮市區投開票所一覽表」\n（格式如附件一）傳真或電話通報中央選務指揮及應變中\n心，函報中央選舉委員會備查，並由直轄市、縣（市）選\n舉委員會發布改定投開票場所公告。\n（二）天災或其他不可抗力情事，發生在投票進行中時，投票所主\n任管理員經通知鄉(鎮、市、區)選務作業中心，並報請所屬\n選舉委員會改定投票場所後，應將尚未發出之公投票、投票\n權人名冊妥善包封，並將公投票匭密封後，一併攜帶至改定\n之投票所繼續投票；如所發生天災或其他不可抗力情事，致\n無法改定投票場所時，經通知鄉(鎮、市、區)選務作業中\n心，並報請所屬選舉委員會核准改定投票日期後，應將尚未\n發出之公投票、投票權人名冊妥善包封，並將公投票匭密封\n後，一併攜回鄉（鎮、市、區）選務作業中心或其指定之場\n所。"}, {"p": 106, "t": "（三）天災或其他不可抗力情事，發生在投票結束後，開票進行中\n時，開票所主任管理員經通知鄉(鎮、市、區)選務作業中\n心，並報請所屬選舉委員會改定開票場所後，應將用餘票、\n已完成開票之公投票、投票權人名冊妥善包封，並將公投票\n匭密封後，一併攜帶至改定之開票所繼續開票；如所發生天\n災或其他不可抗力情事，致無法改定開票場所時，通知鄉\n(鎮、市、區)選務作業中心，並經報請所屬選舉委員會核准\n改定開票日期後，應將用餘票、已完成開票之公投票、投票\n權人名冊妥善包封，並將公投票匭密封後，一併攜回鄉\n（鎮、市、區）選務作業中心。\n（四）改定投開票所場所時，直轄市、縣（市）選舉委員會應督導\n鄉（鎮、市、區）選務作業中心通知投開票所工作人員至改\n定之投開票場所執行職務，洽警察機關派員護送公投票，並\n指派預備員或其他工作人員協助將公投票、投票權人名冊、\n圈票處遮屏、公投票匭及各項物品運送至改定之投開票場\n所，協助佈置投開票所。\n（五）直轄市、縣（市）選舉委員會發布改定投開票所地點公告，\n鄉(鎮、市、區)選務作業中心應於原投開票場所張貼指示，\n提供簡要地圖或說明內容，並安排工作人員引導投票權人，\n前往改定投開票所繼續投票。改定投票場所後，主任管理員\n於下午四時整應即宣布投票時間截止，但對於投票時間截止\n前到場之投票權人仍應准其投票。為防止在投票時間截止後\n到場者插隊，應指派警衛人員或其他工作人員站於隊末。\n六、因天災或其他不可抗力情事已達或可預見將達各直轄市、縣(市)三\n分之一以上投開票所不能投票或開票時，各該直轄市、縣(市)選舉\n委員會應報中央選舉委員會核准，改定該直轄市、縣(市)之投開票\n日期或場所。\n前項不能投票或開票之投開票所，已達或可預見將達全國三分之一\n以上投開票所不能投票或開票時，應由中央選舉委員會委員會議審"}, {"p": 107, "t": "議決定全國改定投開票日期，並由中央選舉委員會發布停止投票公\n告；改定之投開票日期，由中央選舉委員會於改定之投開票日三日\n前公告(流程圖如附件二)。\n七、遇有天災或其他不可抗力情事，經改定投票、開票日期或場所時，\n直轄市、縣(市)選舉委員會應透過大眾傳播媒體、村(里)幹事、網\n站、第四台跑馬燈、村里廣播或其他適當管道，周知當地投票權\n人。\n八、發生天災或其他不可抗力情事致影響電腦計票作業：\n（一）投票日二日前：\n電腦計票之教育訓練、設備安裝、投票權人登錄及全國電腦計\n票演練等工作項目，辦理工作項目可預見當日將發生天災或其\n他不可抗力情事，得視需要提前或延後辦理。\n（二）投票日前一日之電腦計票全國總演練：\n1、直轄市、縣(市)政府或鄉(鎮、市、區)公所宣布停止上班\n地區之選務作業中心停止演練，中央選情中心、直轄市、\n縣（市）選舉委員會及其他選務作業中心照常進行演練。\n2、得視需要召開中央選情中心選前記者會。\n3、為使中央選情中心及計票任務能順利進行，於各直轄市、\n縣（市）政府或鄉(鎮、市、區)公所宣布停止上班前，中\n央選情中心、直轄市、縣（市）選舉委員會、選務作業中\n心及配合廠商應規劃提前進駐之人力。\n（三）投開票當日：\n1、中央選舉委員會發布全國停止投票公告前:\n中央選情中心、直轄市、縣（市）選舉委員會、選務作業中\n心、配合機關（警察局、消防局、台灣電力公司等）及配合\n廠商應規劃提前進駐之人力。\n2、部分直轄市、縣(市)選舉委員會發布停止投票公告：\n中央選情中心、未發布停止投票公告之直轄市、縣（市）選\n舉委員會、選務作業中心照常開設，進行電腦計票作業。已"}, {"p": 108, "t": "發布停止投票公告之直轄市、縣（市）選舉委員會、選務作\n業中心停止電腦計票作業，上開進駐之人力經總指揮宣布解\n散後始得離開。\n3、中央選舉委員會發布全國停止投票公告：\n中央選情中心、直轄市、縣（市）選舉委員會、選務作業中\n心停止電腦計票作業，上開進駐之人力經總指揮宣布解散後\n始得離開。\n（四）中央選舉委員會、直轄市、縣(市)選舉委員會發布停止投票\n公告後，電腦計票相關配套措施：\n1、中央選情中心、發布停止投票公告之直轄市、縣(市)選舉\n委員會及選務作業中心設備及網路應關機暫不拆除，並避\n免遺失或損壞。已開完票之直轄市、縣(市)選舉委員會或\n選務作業中心設備及網路拆除。\n2、電腦計票資料庫封存，計票系統暫時關閉，依電腦計票標\n準作業流程(SOP)辦理。\n3、已開票之投開票所一覽表以 Excel 形式公開於中央選舉委員\n會網站，開放民眾下載。\n九、地方性公民投票投票日前或投開票當日發生天災或其他不可抗力情\n事應變處理作業，準用本注意事項規定。"}, {"p": 109, "t": "附件一、改定投開票場所之鄉鎮市區投開票所一覽表\n選舉委員會填造\n改定之 改定之\n鄉鎮市 投開票所 投開票所\n場所名稱 投開票所 投開票所 備註\n區別 編號 地址\n場所名稱 地址"}, {"p": 110, "t": "附件二、全國性公民投票投票日前或當日發生天災或其他不可\n抗力情事之標準作業程序流程圖\n1.投票日前：\n發生或可預見將發生天災或\n其他不可抗力情事，致個別\n投開票所，不能投票或開票\n直轄市、縣(市)選舉委員會\n陳報\n中央選舉委員會\n核准\n改定投開票日期或場所\n2.投開票當日：\n發生或可預見將發生天災或\n其他不可抗力情事，致個別\n投開票所，不能投票或開票\n投開票所主任管理員\n通知 陳報\n鄉(鎮、市、區)\n選務作業中心\n直轄市、縣(市)選舉委員\n會\n改定投開票 中央選舉委\n日期或場所 員會備查"}, {"p": 111, "t": "3.投票進行中：\n發生天災或其他不可抗力情事\n投票所主任管理員\n通知 陳報\n鄉(鎮、市、區)\n選務作業中心\n直轄市、縣(市)選舉委員會\n改定 無法改定\n投票場所 投票場所\n改定投票日期\n投票所主任管理員\n應妥善包封公投票\n及投票權人名冊 投票所主任管理員\n應妥善包封公投票\n及投票權人名冊\n攜帶至改定之\n投票所繼續投票 攜回選務作業中心"}, {"p": 112, "t": "4.投票結束後，開票進行中：\n發生天災或其他不可抗力情事\n開票所主任管理員\n通知 陳報\n鄉(鎮、市、區)\n選務作業中心\n直轄市、縣(市)選舉委員會\n改定 無法改定\n開票場所 開票場所\n改定開票日期\n開票所主任管理員\n應妥善包封公投票\n及投票權人名冊 開票所主任管理員\n應妥善包封公投票\n及投票權人名冊\n攜帶至改定之\n開票所繼續開票 攜回選務作業中心"}, {"p": 113, "t": "參、防範選舉人重複投票或冒領選舉票辦法\n第 一 條 本辦法依總統副總統選舉罷免法第十四條第五項及公職人\n員選舉罷免法第十八條第四項規定訂定之。\n第 二 條 投票所工作人員應確實核對選舉人身分，防範選舉人重複\n投票或冒領選舉票。\n第 三 條 選舉人應一次進入投票所投票，離開投票所後不得再次進\n入投票所投票。\n二種以上選舉同日舉行時，選舉人如僅領取一種選舉票\n時，投票所工作人員應於選舉人名冊備註欄註記，並告知\n選舉人離開投票所後不得再次進入投票所投票。\n第 四 條 選舉人投票時，除另有規定外，應憑本人國民身分證領取\n選舉票。\n在國外之中華民國自由地區人民返國行使總統副總統選舉\n權之選舉人應憑本人有效之中華民國護照領取選舉票。\n選舉人遺失國民身分證，在申請補發之新身分證尚未領得\n前，應憑戶政機關發給貼有相片之臨時證明書領取選舉\n票。\n第 五 條 投票所查驗身分證管理員應於投票所入口處，確實核對前\n來投票選舉人容貌與其國民身分證或護照之相片是否相\n符，符合者始得准予進入投票所，以防止選舉人持他人國\n民身分證或護照前往投票。\n第 六 條 投票所領票處管理員於發票前，應確實核對前來投票選舉\n人容貌與其國民身分證或護照之相片是否相符，同時查對\n國民身分證或護照上姓名、出生年月日是否與選舉人名冊\n之記載資料相符，經核對符合者，應於選舉人名冊內該選\n舉人名下，按選舉權種類欄，請選舉人簽名或蓋章或按指\n印，按指印者，應由管理員及監察員各一人，於「證明人\n蓋章」欄共同蓋章證明後發給選舉票。"}, {"p": 114, "t": "第 七 條 二種以上選舉同日舉行投票時，投票所領票處管理員應確\n實按照選舉人名冊所載選舉人具有之選舉權種類發給選舉\n票，避免發錯選舉票。\n第 八 條 選舉人名冊備註欄蓋有「工作地投票」戳記者，不得發給\n選舉票。\n第 九 條 選舉人憑臨時證明書領取選舉票時，各投票所管理員應確\n實核對其臨時證明書相片與本人無誤，並於選舉人名冊備\n註欄內加蓋「憑臨時證明書領票」後，方可發給選舉票。\n第 十 條 重複投票或冒領選舉票者，經當場發現，涉有刑法第一百\n四十六條第三項之妨害投票正確未遂及第一百四十七條妨\n害投票秩序等罪嫌，投票所主任管理員應會同主任監察\n員，請警衛人員將該選舉權人或冒領人予以留置，聯絡當\n地警察分局派員處理，另通報各該直轄市、縣（市）選舉\n委員會依法處理。\n第 十一 條 本辦法自發布日施行。"}, {"p": 115, "t": "肆、投開票所工作人員應行注意相關法規摘要\n刑事法規\n（一）刑法\n第一二二條 公務員或仲裁人對於違背職務之行為，要求、期約或收受\n賄賂或其他不正利益者，處三年以上十年以下有期徒刑，\n得併科二百萬元以下罰金。\n因而為違背職務之行為者，處無期徒刑或五年以上有期徒\n刑，得併科四百萬元以下罰金。\n對於公務員或仲裁人關於違背職務之行為，行求、期約或\n交付賄賂或其他不正利益者，處三年以下有期徒刑，得併\n科三十萬元以下罰金。但自首者減輕或免除其刑。在偵查\n或審判中自白者，得減輕其刑。\n第一三四條 公務員假借職務上之權力、機會或方法，以故意犯本章\n（按：第四章瀆職罪）以外各罪者，加重其刑至二分之\n一。但因公務員之身分已特別規定其刑者，不在此限。\n第一四六條 以詐術或其他非法之方法，使投票發生不正確之結果或變\n造投票之結果者，處五年以下有期徒刑。\n意圖使特定候選人當選，以虛偽遷徙戶籍取得投票權而為\n投票者，亦同。\n前二項之未遂犯罰之。\n第二一三條 公務員明知為不實之事項，而登載於職務上所掌之公文\n書，足以生損害於公眾或他人者，處一年以上七年以下有\n期徒刑。\n（二）公職人員選舉罷免法\n第一○九條 意圖妨害或擾亂投票、開票而抑留、毀壞、隱匿、調換或\n奪取投票匭、選舉票、罷免票、選舉人名冊、投票報告"}, {"p": 116, "t": "表、開票報告表、開票統計或圈選工具者，處五年以下有\n期徒刑。\n第一一三條 犯本章之罪，其他法律有較重處罰之規定者，從其規定。\n辦理選舉、罷免事務人員，假借職務上之權力、機會或方\n法，以故意犯本章之罪者，加重其刑至二分之一。\n犯本章之罪或刑法分則第六章之妨害投票罪，宣告有期徒\n刑以上之刑者，並宣告褫奪公權。\n（三）公民投票法\n第四十條 意圖妨害或擾亂公民投票案投票、開票而抑留、毀壞、隱\n匿、調換或奪取投票匭、公投票、投票權人名冊、投票報\n告表、開票報告表、開票統計或圈選工具者，處五年以下\n有期徒刑。\n第四十六條 犯本章（按：第五章 罰則）之罪，其他法律有較重處罰之\n規定者，從其規定。\n辦理公民投票事務人員，假借職務上之權力、機會或方\n法，以故意犯本章之罪者，加重其刑至二分之一。\n犯本章之罪，宣告有期徒刑以上之刑者，併宣告褫奪公\n權。"}, {"p": 117, "t": "伍、投票所選擇具備無障礙設施場地注意事項\n一、 為落實投票所應選擇具備無障礙設施場地，以利行動不便之選舉\n人行使投票權，特訂定本注意事項。\n二、 投票所以設置於一樓為原則，如有設於地下室或二樓以上之樓層\n者，須有電梯、昇降設備或坡道通達，無電梯、昇降設備或坡道\n通達者，應另覓其他適當場所。\n三、 投票所無障礙通路\n(一) 自投票所所在場地之主要道路或人行道通往投票所出入口之間，\n至少應確保一條無障礙通路，以利行動不便之選舉人進出及通\n行。\n(二) 無障礙通路之地面應平整、堅固、防滑。通路地面高低差距過大\n處，應作斜角處理或設置坡道。\n(三) 無障礙通路淨寬應足供使用輪椅之選舉人順利通行。\n(四) 無障礙通路兩側如有妨礙通行之懸空突出物，投票日當天應予以\n移除。如為必要設置之突出物，應於其下方設置警示或其他防撞\n設施。\n(五) 室內無障礙通路上如有設置門扇，投票日當天應維持開啟。\n(六) 無障礙通路動線上有樓梯，且樓梯底版下方鏤空者，應加裝護\n欄、圍牆，或者改變通路之動線。\n四、 無障礙通路上之坡道\n(一) 坡道淨寬應足供使用輪椅之選舉人順利通行，其地面應平整、堅\n固、防滑。\n(二) 坡道應儘量平緩，避免坡度（高度與水平長度之比）過大者。\n(三) 坡道之上、下方平臺高低差較大者，坡道兩側應設有連續性扶\n手。\n五、 使用電梯及昇降設備之投票所\n(一) 通往投票所之主要出入口及沿路轉彎處，應設置電梯及昇降設備\n標誌。"}, {"p": 118, "t": "(二) 電梯及昇降設備門淨寬應足供使用輪椅之選舉人順利進出。\n(三) 電梯及昇降設備機廂深度應充足，機廂內兩側應設置扶手。\n(四) 電梯及昇降設備操作盤之按鈕應附有點字標示，或有專人予以協\n助。\n(五) 電梯及昇降設備應裝設語音系統或觸覺裝置，以報知停靠樓層及\n開關門之動作，或有專人予以協助。\n六、 投票所擇定後，如發現有其他可能造成行動障礙之物品，應於投\n票日前先行移除，或規劃其他動線。\n七、 直轄市、縣（市）選舉委員會應指揮、監督鄉（鎮、市、區）公\n所依據投票所無障礙設施檢核表逐一檢核投票所，如有不符規定\n之項目，應予以改善或另覓其他符合規定之場地。投票所無障礙\n設施檢核表格式如附表。"}, {"p": 119, "t": "投票所選擇具備無障礙設施場地注意事項第七點附表\n投票所無障礙設施檢核表\n檢核情形\n檢核項目\n（請打 V）\n不符\n類別 編號 內 容 符合\n合\n樓 1 投票所以設置於 1 樓為原則，如設置於地下室或 2 樓以上者，應有電\n層 梯、昇降設備或坡道通達。\n通 2 自投票所所在場地之主要道路或人行道通往投票所出入口之間，至少\n往 有 1 條無障礙通路，並應設置引導標誌。\n投 3 通路地面平整、堅固、防滑。\n票 4 投票所儘量選擇通路上未設置水溝格柵者，如設置\n所 水溝格柵，在其主要行進方向，開口不得大於 1.3\n之 公分。\n無\n障\n礙\n通 5 通路地面無高低差在 0.5 公分以上之情形，或雖有高低差在 0.5 公分\n路 以上之情形，但已進行以下處置：\n（1）高低差在 0.5 公分至 3 公分者：作 1/2\n斜角處理。\n（2）高低差大於 3 公分者：設置符合規定\n之坡道。\n6 室外通路淨寬不得小於 130 公分，室內通路走廊淨寬不得小於 120 公\n分。\n7 通路上未有門扇，或雖裝置門扇，門扇淨寬不得小於 80 公分，並於\n投票日當天全程維持開啟。\n8 通路上未有門檻或門檻高度在 0.5 公分以下，或門檻高度雖在 0.5 公\n分至 3 公分，但已作 1/2 斜角處理。\n9 室內通路兩邊之牆壁，自地面起 60 公分至 190 公分以內，不得有 10\n公分以上之懸空突出物；如為必要設置之突出物，其下方已設置警示\n或其他防撞設施。\n10 通路動線上有樓梯，且樓梯底版下方鏤空者，底版至其直下方地板面\n淨高未達 190 公分部分應設護欄、圍牆或\n其他防護設施。"}, {"p": 120, "t": "不符\n類別 編號 內 容 符合\n合\n無 無障礙通路上是否須設置坡道？\n障 □是（請繼續檢核下列項目） □否（請跳至「電梯及昇降設備」）\n礙 11 坡道淨寬不得小於 90 公分。如為取代樓梯之坡道，其淨寬不得小於\n通 150 公分。\n路 12 坡道地面平整、堅固、防滑。\n上 13 坡度不大於 1/12；高低差在 3 公分以下者，坡度不大於 1/2；高低差\n之 在 5 公分以下者，坡度不大於 1/5；高低差在 20 公分以下者，坡度不\n坡 大於 1/10。（註：坡度係指坡面垂直上升高度與水平距離之比，如坡\n道 度 1/12，即指坡面垂直高度上升 1 公分，水平距離延伸 12 公分）\n14 高低差大於 20 公分之坡道，兩側須設有連續性扶手，地面至扶手上緣\n高度以 75 公分為原則，且該扶手設置堅固，接頭處平整，無銳利之突\n出物。但如設置扶手將妨礙通行者，則不須設置扶手。\n15 高低差大於 20 公分之坡道，其未鄰牆壁之一側或兩側已設置不低於 5\n公分高之防護緣。\n16 坡道端點平台兩端須淨空，坡道方向變換處已設置長、寬各 150 公分\n以上之平台，且平台坡度不大於 1/50。\n電 投票所設置地點是否須使用電梯及昇降設備？\n梯 □是（請繼續檢核下列項目） □否（請跳至「投票所內」）\n及 17 通往投票所之主要出入口及沿路轉彎處，均設有電梯及昇降設備標\n昇 誌，且標誌設置方向須與行進方向垂直。\n降 18 電梯及昇降設備門淨寬不得小於 80 公分。\n設 19 電梯及昇降設備機廂深度不得小於 110 公分（不需扣除扶手佔用之空\n備 間），機廂內兩側並設有扶手。\n20 電梯及昇降設備操作盤之按鈕距離地板面高度為 85 公分至 120 公分，\n並應附有點字標示，或有專人予以協助。\n21 電梯及昇降設備已裝設語音系統或觸覺裝置，報知停靠樓層及開關門\n之動作，或有專人予以協助。\n22 電梯及昇降設備到達門開啟至關閉時間為 5 秒鐘至 10 秒鐘，或有專人\n予以協助。\n投 23 出入口未設有門檻，或雖有門檻，其高度在 3 公分以下，並作 1/2 斜\n票 角處理。但高度在 0.5 公分以下者得不受限制。\n所 24 設有無障礙圈票處遮屏，遮屏尺寸應便利行動不便選舉人之圈票。\n內 25 張貼明確之文字標示及圖示，引導選舉人投票。\n26 備有視障者投票輔助器。\n27 投票匭上緣距離地板面高度不得大於 85 公分，投票口深度不得大於 25\n公分。\n28 領票、圈票及投票之動線應有利於身心障礙選舉人使用，並保持暢\n通。"}, {"p": 121, "t": "不符合規定項目之改善或替代方案說明：\n備註：編號第 24 項至第 28 項，檢核人員毋庸於檢核情形欄勾選，投票所主任管理員於佈置投票所\n時納入檢查，檢查完竣後於執行任務確認表簽署己姓。\n檢核日期： 年 月 日\n檢核人員： （簽章）"}, {"p": 122, "t": "陸、身心障礙選舉人及投票權人投票協助措施\n依公職人員選舉罷免法第 57 條第 2 項規定：「投票所應選擇具備無\n障礙設施之場地，若無符合規定之無障礙場地，應使用相關輔具或器材\n協助行動不便者完成投票。選舉委員會應視場所之無障礙程度，適度增\n加投票所之工作人力，主動協助行動不便者。」為便利身心障礙選舉人\n或投票權人行使投票權，選舉委員會特提供下列協助措施：\n一、 錄製有聲選舉公報\n為便利視障選舉人或投票權人瞭解候選人政見，錄製有聲選舉公\n報，提供行使投票權參考。\n二、 投票所選擇具備無障礙設施場地\n投票所以設置於一樓為原則，如設於地下室或二樓以上，應有電\n梯、昇降設備或坡道通達。投票所入口處，如不便於身體障礙選\n舉人或投票權人進出，應鋪設簡易無障礙設施。\n三、 投票所張貼明確文字標示及圖示\n為利身心障礙選舉人或投票權人瞭解投票規定及程序，投票所內\n張貼明確文字標示及圖示，例如「請出示國民身分證」、「請提\n供印章」等，引導身心障礙選舉人或投票權人投票。\n四、 設置身心障礙圈票處遮屏\n投票所設置適合乘坐輪椅選舉人或投票權人使用之圈票處遮屏，\n以方便其投票。\n五、 妥慎規劃領票、圈票及投票動線\n領票、圈票及投票動線設計利於身心障礙選舉人或投票權人使\n用，並保持暢通。乘坐輪椅選舉人或投票權人進入投票所時，工\n作人員應主動予以協助，並洽商其他在場選舉人或投票權人，禮\n讓其優先投票。\n六、 備置視障者投票輔助器"}, {"p": 123, "t": "視障選舉人或投票權人至投票所投票時，投票所主任管理員應向\n該視障選舉人或投票權人說明投票所備有視障者投票輔助器，並\n說明其使用方法，輔助視障選舉人自行圈蓋選舉票或公投票。\n七、 眼同協助或代為圈投\n視障選舉人或投票權人如不擬使用投票輔助器投票，仍可由視障\n選舉人或投票權人之陪同家屬或陪同之人，依據視障選舉人意\n思，眼同協助或代為圈投；其無陪同家屬或陪同之人在場者，亦\n得依其請求，由投票所管理員及監察員各 1 人，依據其本人意\n思，眼同協助或代為圈投。\n八、 優先投票措施\n遇有行動不便、乘坐輪椅、年長者、孕婦或其他不適久站之選舉\n人或投票權人到達投票所等候投票時，投開票所工作人員將洽商\n其他在場選舉人或投票權人，禮讓優先進入投票所投票。\n九、 提供易讀版投票指南手冊\n為協助心智障礙選舉人或投票權人瞭解選舉相關規定，本會編製\n易讀版投票指南手冊，使用淺白文字及配合圖片，說明選舉種\n類、日期、投票流程及投票時應注意事項，上傳本會網站提供下\n載。"}, {"p": 124, "t": "附錄十五、投開票所曾發生案例及其改進預防措施\n投開票所曾發生案例 改 進 預 防 措 施\n一、投票 圈票遮屏未設置白色布 (一) 為保障選舉人投票秘密，圈票處\n所佈 簾。 遮屏 3 面以不透光材質遮蔽，缺\n置 口處則設置布簾，以確保選舉人\n圈票時不受窺視或刺探。\n(二) 主任管理員於佈置投票所時應確\n實依工作人員手冊及圖例佈置。\n投票所動線太窄，輪椅 (一) 依公職人員選舉罷免法第 57 條第\n使用者行進困難。 2 項規定，投票所應選擇具備無\n障礙設施之場地，工作人員並應\n主動協助行動不便者完成投票。\n(二) 依 投 票 所 無 障 礙 設 施 檢 核 表 規\n定，領票、圈票及投票之動線應\n有利於身心障礙選舉人使用，並\n保持暢通。\n(三) 主任管理員於佈置投票所時應確\n實依上開規定辦理檢核。\n投票所無障礙動線標示 (一) 依公職人員選舉罷免法第 57 條第\n不清，工作人員導引不 2 項規定，投票所應選擇具備無\n佳。 障礙設施之場地，工作人員並應\n主動協助行動不便者完成投票。\n(二) 應事先確實辦理投票動線規劃，\n加強督導主任管理員依規劃佈置\n投票所，並將相關動線標示於明\n顯處，方便身心障礙選舉人依\n循。\n投票所出入口有門檻且 (一) 依 投 票 所 無 障 礙 設 施 檢 核 表 規\n未作斜角處理。 定，出入口不設門檻，或雖有門\n檻，其高度在 3 公分以下，並作\n1/2 斜角處理。門檻高度在 0.5 公\n分以下者得不受限制。\n(二) 主任管理員於佈置投票所時應確\n實依上開規定辦理檢核。"}, {"p": 125, "t": "已備妥之無障礙坡道或 (一) 依 投 票 所 無 障 礙 設 施 檢 核 表 規\n斜角，於投票日未設置 定，出入口不設門檻，或雖有門\n於投票所出入口。 檻，其高度在 3 公分以下，並作\n1/2 斜角處理。門檻高度在 0.5\n公分以下者得不受限制。\n(二) 主任管理員於佈置投票所時應依\n規定佈置投票所，並檢查已備妥\n之無障礙坡道或斜角是否已確實\n設置於投票所出入口。\n未設置無障礙圈票處。 (一) 依公職人員選舉罷免法第 57 條第\n2 項規定，選擇具備無障礙設施\n之場地設置投票所，並主動協助\n行動不便者完成投票。\n(二) 依 投 票 所 無 障 礙 設 施 檢 核 表 規\n定，投票所內應設置無障礙圈票\n處遮屏，並張貼明確之文字標示\n及圖示，引導選舉人投票，其領\n票、圈票及投票之動線應有利於\n身心障礙選舉人使用，並保持暢\n通。\n(三) 主任管理員於佈置投票所時應確\n實依上開規定辦理檢核。\n投票匭高度太高。 (一) 依 投 票 所 無 障 礙 設 施 檢 核 表 規\n定，投票匭上緣距離地板面高度\n不得大於 85 公分，投票口深度不\n得大於 25 公分。\n(二) 主任管理員於佈置投票所時應確\n實依上開規定辦理檢核。\n投票所工作人員開票所 (一) 佈置開票所時，應注意物品擺設\n佈置時，貼有記票紙之 是否妥當，並避免物品滑落，以\n木板因斜置於桌面與牆 免發生危害選舉人或投開票所工\n面間，工作人員記票時 作人員安全情事。\n木板滑落導致工作人員 (二) 主任管理員發現選舉人或投開票\n受傷。 所工作人員於投開票所發生意外\n受傷時，應立即通報鄉（鎮、\n市、區）選務作業中心、直轄"}, {"p": 126, "t": "市、縣（市）選舉委員會，並由\n直轄市、縣（市）選舉委員會通\n報中央選舉委員會知悉。\n二、領票 查驗國民身分證時未要 查驗國民身分證管理員、選舉人名冊\n求選舉人暫時脫下口罩 管理員進行選舉人身分查驗時，遇有\n佩戴口罩選舉人，應請選舉人脫下口\n罩，核對前來投票者容貌與其國民身\n分證相片是否相符。\n選舉人於選舉人名冊上 選舉人名冊管理員請其重簽與選舉人\n之簽名與其姓名不符、 姓名相符或足可辨識之簽名。\n無法辨識或以英文簽\n名。\n選舉人名冊上之選舉人 (一) 選舉人憑本人國民身分證及印章\n領票印章與名冊上姓名 領票時，發票管理員應先檢查選\n不符、用印章背面蓋章 舉人印章上之姓名是否與名冊上\n領票或印章蓋得模糊不 姓名相符，如印章沾有印泥，並\n清者、或未蓋在規定欄 應以印章刷刷乾淨後，再將印章\n位方格內。 蓋在規定欄位方格內。選舉人蓋\n章或按指印應左右錯開，以避免\n選舉人印章或指印相互覆蓋。\n(二) 如無法確認為本人章時，請其用\n簽名或按指印。\n選舉人錯蓋印、簽名或 (一) 選舉人名冊管理員持選舉人印章\n按指印於證明人簽章欄 於選舉人名冊蓋印時，應注意蓋\n處。 於選舉人欄處，而非證明人簽章\n欄。\n(二) 選舉人簽名或按指印時，選舉人\n名冊管理員應指導選舉人簽名或\n按指印於選舉人欄處。\n數位選舉人使用同一印 發票管理員應禁止同一戶數位選舉人\n章領取選舉票。 用同一印章領取選舉票。\n選舉人按指印領票，但 按指印領票者，管理員及監察員各 1 人\n證明人簽章欄處無管理 應立即於選舉人名冊「證明人簽章」\n員及監察員簽章。 欄內共同蓋章證明。\n發票管理員應利用發票空檔，檢查選\n舉人名冊上，以按指印領票之選舉人"}, {"p": 127, "t": "「證明人簽章」欄內，是否有漏蓋管\n理員與監察員之印章，如有漏蓋，應\n即時補蓋。\n管理員以未攜帶印章為 管理員應攜帶印章執行職務，如經分\n由，主張無法於選舉人 配指導選舉人簽章等工作，遇有選舉\n按指印時會章證明。 人按指印領取選舉票而需管理員及監\n察員各 1 人於選舉人名冊「證明人簽\n章」欄內共同蓋章證明，此時該管理\n員如未攜帶印章時，應以簽名為之。\n投 票 所 內 排 隊 人 潮 眾 主任管理員應隨時留意民眾領票、圈\n多 ， 民 眾 圈 票 速 度 較 票及投票流程之順暢度及投票所可容\n慢，部分選舉人於投票 納人員之狀況，倘同時進入投票所之\n所入口領票後，排隊至 民眾較多，且於領、圈、投票流程速\n投票所外。 度較慢時，應及時指揮查驗國民身分\n證管理員及發票管理員，暫停發票，\n並請民眾於投票所外稍候，以避免發\n生民眾領票後無法圈投，甚至因排隊\n人潮眾多而將選舉票攜出投票所外之\n情形。\n因選舉人使用原子章或 公職人員選舉罷免法第 18 條第 2 項規\n造型圖案印章，投開票 定，選舉人領取選舉票時，應在選舉\n所工作人員拒絕發給選 人名冊上簽名或蓋章或按指印。上開\n舉票。 規定並未限制選舉人蓋章所使用之印\n章材質，惟選舉人所提供之印章，須\n可辨識選舉人姓名，請工作人員依法\n令規定辦理。\n未允許選舉人以簽名方 查公職人員選舉罷免法第 18 條第 2 項\n式領取選舉票。 規定，選舉人領取選舉票時，應在選\n舉人名冊上簽名或蓋章或按指印。依\n上開規定，選舉人領取選舉票時，除\n在選舉人名冊上蓋章外，亦得採簽名\n方式辦理，請於辦理投開票所工作人\n員講習時加強宣導，俾依法令規定辦\n理。"}, {"p": 128, "t": "未落實執行優先投票措 為維護選舉人投票權益，本會已於投\n施。 開票所工作人員手冊增訂優先投票措\n施，投開票所工作人員如遇有行動不\n便、乘坐輪椅、年長者、孕婦及其他\n不適久站之選舉人到達投票所等候投\n票時，應洽商其他在場選舉人，禮讓\n其優先進入投票所投票，請於辦理投\n開票所工作人員講習加強宣導，要求\n工作人員依規定辦理。\n投 票 所 工 作 人 員 誤 發 (一) 選舉人名冊管理員憑選舉人國\n（平地原住民選舉人發 民身分證及投票通知單，查對\n給山地原住民選舉票） 選舉人名冊內之記載資料，經\n或漏發原住民選舉票。 查相符後，即在冊內該選舉人\n名下之「簽名或蓋章或按指\n印」欄內蓋章或請其簽名或按\n指印。\n(二) 發票應確實依照選舉人名冊所\n標示選舉種類發票，核對選舉\n人名冊管理員應朗誦平地（山\n地）原住民選舉票，提醒發票\n員，以避免有誤發或漏發原住\n民選舉票情事發生，選舉人名\n冊管理員朗誦之音量，以發票\n管理員可聽到為原則之方式辦\n理。\n未允許選舉人照顧之 6 109 年 5 月 6 日修正公布之總統副總統\n歲 以 下 兒 童 進 入 投 票 選舉罷免法第 53 條、公職人員選舉罷\n所。 免法第 57 條條文，業開放選舉人照顧\n之 6 歲以下兒童得進入投票所。又選舉\n人照顧之 6 歲以下兒童進入投票所，投\n票所工作人員應本於職權，依事實認\n定，如有必要，得由該選舉人舉證，\n或備具有關戶籍資料證明。另 6 歲以下\n兒童進入投票所不得有妨礙或擾亂投\n票之行為，請工作人員依規定辦理。"}, {"p": 129, "t": "三、圈票 工作人員未依規定讓家 (一) 利用各種文宣管道或教育訓練課\n屬或陪同之人協助身心 程，加強宣導公職人員選舉罷免\n障礙選舉人投票；投票 法第 18 條第 3 項之規定如下：\n所監察員協助身心障礙 1. 所稱「身心障礙」者，不以領有\n選舉人投票時，未會同 身心障礙手冊人員為限。凡有身\n管理員 1 人，依據選舉 體或心智功能障礙，不能自行圈\n人本人意思代為圈投選 投而能表示其意思者，均有適\n舉票。 用。\n2. 所稱「不能自行圈投」，係指肢\n體功能不健全致不能自行圈投，\n心智障礙者如肢體功能健全，仍\n應自行圈投。\n3. 所稱「能表示意思」，以口頭明\n示之意思表示為限，但有語言障\n礙而無法口頭意思表示者，得以\n其他明示之意思表示為之。\n4. 如遇家屬或陪同之人輔助身心障\n礙選舉人投票，投票所工作人員\n應向該身心障礙選舉人確認該家\n屬或陪同之人確實為其選擇之輔\n助投票人員。\n(二) 公職人員選舉罷免法第 18 條第 3\n項但書後段規定得由投票所管理\n員及監察員各 1 人，眼同協助或\n代為圈投選舉票之要件如下：\n1. 選舉人須為「身心障礙不能自行\n圈投而能表示其意思者」。\n2. 須 選 舉 人 無 家 屬 或 陪 同 之 人 在\n場。\n3. 須依選舉人之請求。\n4. 須 依 據 選 舉 人 本 人 意 思 代 為 圈\n投。\n(三) 改進預防措施如下：\n1. 辦理每次選舉前，加強宣導公職\n人員選舉罷免法第 18 條第 3 項規\n定之相關注意事項。"}, {"p": 130, "t": "2. 辦理選務工作人員講習及投開票\n所工作人員講習等教育訓練課程\n時，加強宣導相關規定，並確實\n播放中央選舉委員會製作之投開\n票所作業程序動畫教材。\n圈選工具圖樣發現有非 (一) 鄉（鎮、市、區）選務作業中心\n正確圖樣。 發交圈選工具予投開票所主任管\n理員時，均應確實檢查圈選工具\n是否符合中央選舉委員會規定之\n式樣。\n(二) 圈 票 處 管 理 員 應 利 用 無 人 圈 選\n時，檢查圈票處之圈選工具，如\n發現有被調換或不符合規定之圈\n選工具，應即補換。\n圈票工具不足或以筆蓋 各選舉委員會應確實提供充足且適當\n等其他物品代替圈選工 之快乾打印台、厚墊及圈選工具供選\n具。 舉人圈蓋選舉票使用。發交投開票所\n應用物品時，各選舉委員會、選務作\n業中心及投開票所主任管理員均應確\n實檢查紅色打印台、圈選工具及遮屏\n等數量是否相符，圈選工具等亦應預\n備備品，以便及時替換。\n選舉人圈票用打印台， (一) 各選舉委員會應確實提供快乾打\n未使用快乾打印台（使 印台供選舉人圈蓋選舉票使用，\n用印泥）、打印台油墨 如檢查發現印台油墨太濃或太\n太濃或太淡，致選舉人 淡，應予以汰換。投票所工作人\n圈選後污染選舉票或模 員亦應確實檢查之。\n糊不清。 (二) 主任管理員及圈票處管理員均應\n注意不可將發票處之印泥，誤置\n入圈票處供圈票。\n四、投票 投票所工作人員要求選 (一) 投票所圈票處應備紅色快乾打印\n舉人吹乾選舉票再投入 台及厚墊，供選舉人圈選選舉票\n投票匭，致其他選舉人 之用。發交投開票所應用物品\n誤解有亮票之嫌。 時，選舉委員會、選務作業中心\n及投開票所主任管理員均應確實\n檢查打印台油墨，如有太濃或太"}, {"p": 131, "t": "淡之情形應予以更換。\n(二) 圈票處管理員在投票開始前，應\n確實檢查印台及油墨，如有油墨\n過多可能污染選舉票或油墨過少\n顏色可能模糊不清者，應即時改\n善或聯繫鄉（鎮、市、區）選務\n作業中心更換。\n(三) 投票處管理員應指導選舉人將選\n舉票摺疊投入投票匭內，並提醒\n選舉人不得將圈選內容出示他\n人。\n五、開票 佈置開票所時不慎關閉 主任管理員督導工作人員將投票所改\n所佈 門窗，引發民眾質疑， 佈置為開票所時，應公開為之，不得\n置 且疑似要衝越開票觀眾 將大門或窗戶關閉。\n席至開票作業區。\n以開票所採 2 組同時開 投開票所工作人員講習時應加強說明\n票，開票所空間不足為 開票所佈置圖例，俾依規定佈置開票\n由，未設置參觀席。 所，並設置參觀席。\n未允許參觀開票民眾攝 本會 104 年 10 月 20 日第 470 委員會議\n錄影。 決議，本會 72 年、81 年及 98 年函釋\n有關開票所禁止民眾攝影部分停止適\n用，並經本會以 104 年 10 月 28 日中選\n務字第 1043150291 號函知直轄市、縣\n（市）選舉委員會。上開函釋經停止\n適用後，開票時民眾已可於開票時進\n行攝錄影，請於辦理投開票所工作人\n員講習加強宣導，並請工作人員依規\n定辦理。\n六、開票 開票所檢票管理員於執 主任管理員應熟悉開票作業流程，工\n行開票職務時，將選舉 作人員如未依規定進行開票各項程序\n票檢集成疊後交由唱票 時，應立即指正，請其依規定進行，\n管理員唱票，未依規定 投開票所工作人員講習應加強宣導，\n逐張檢取選舉票。 不得有將選舉票檢集成疊後再唱票情\n形。"}, {"p": 132, "t": "開票所工作人員於開票 (一) 工 作 人 員 於 開 票 過 程 須 角 色 互\n進行中，因個人生理需 換，須上洗手間或其他重大事\n求於中途離開開票所， 故，應告知現場民眾並由相關人\n引發質疑。 員遞補其職務，避免在場民眾質\n疑。\n(二) 投票所紀錄簿須詳實記載每一階\n段異動原因，並由所有監察員簽\n名。\n選舉票屬有效或無效， (一) 按目前公職人員選舉票、公職人\n未依規定圖例認定。 員罷免票、公投票之有效或無效\n有三種認定圖例，各選舉委員會\n辦理投開票所工作人員講習時，\n應加強詳細講解，提醒工作人員\n注意。\n(二) 投開票所工作人員在執行開票職\n務前，應再翻閱工作手冊，記住\n正確之認定圖例。\n(三) 唱 票 管 理 員 唱 票 時 ， 主 任 管 理\n員、主任監察員、監察員應注意\n有效、無效之認定是否正確，如\n有未符合規定之認定，應立即予\n以更正。\n開 票 前 未 宣 布 領 票 人 (一) 投開票作業程序已納入開票前宣\n數，又將選舉人名冊帶 布領票人數程序，主任管理員如\n至後方房間統整。 未依規定進行開票各項程序時，\n主任監察員應立即指正，請其依\n規定進行，投開票所工作人員講\n習應加強宣導。\n(二) 開票應公開為之，工作人員將選\n舉人名冊帶至後方敞開房門之房\n間整理，造成民眾誤解，投開票\n所工作人員講習應重申並教導工\n作人員正確選務觀念，開票過程\n須公開透明。"}, {"p": 133, "t": "唱票管理員未正面高舉 依公職人員選舉罷免法第 57 條第 5 項\n選舉票正面向參觀民眾 及同法施行細則第 33 條第 2 項規定，\n展示。 開票應公開為之，逐張唱名開票，並\n依檢票、唱票、記票及整票計票作業\n程序進行，不得先整票後再行唱票或\n計票，又選舉票之唱票，投開票所工\n作人員應高舉選舉票，並將選舉票正\n面向參觀席參觀民眾展示，工作人員\n如未依規定進行開票各項程序時，應\n立即指正，請其依規定進行，投開票\n所工作人員講習應加強宣導。\n唱 票 完 成 後 整 票 點 數 選舉票不論尚未發出、已發出或已唱\n時，疏未注意，在選舉 完票，均不可於選舉票上畫記號。\n票上打「ˇ」記號。\n七、填寫 投開票報告表填載有 (一) 記票管理員應確實配合唱票員之\n投開 誤。 唱呼，複唱 1 次，並正確劃記\n票報 「正」字。\n告表 (二) 開票完畢，記票管理員在記載得\n票數或無效票之總票數前，應詳\n加計算並與整票計票員相互核\n對，複核無誤後再行記入。\n(三) 主任管理員會同主任監察員填寫\n投開票報告表之投票數前，應查\n對選舉人名冊之領票數，如有票\n數不符時，應重新點算覈實；另\n主任監察員應確實核對主任管理\n員所填票數是否正確。\n未領票數多出數張空 (一) 主任管理員、主任監察員於投票\n白票。 日前 1 日至選務作業中心點領選\n舉票時，應確實逐張點算，如發\n現選舉票數量不符時，即應向主\n辦人員報告，經複核無誤後，應\n予補發或繳回。\n(二) 主任管理員填載投開票報告表用\n餘票數前，應確實點算無誤後，\n正確記載，不得以扣除發出票數"}, {"p": 134, "t": "之方式逕行填載；主任監察員應\n確實核對主任管理員所填票數是\n否正確。\n投票數與依選舉人名冊 (一) 主任管理員、主任監察員應督導\n填載之領票數不符。 工作人員確實核對選舉人身分及\n其選舉權，正確發票，防止誤\n發、漏發選舉票之情形，並應嚴\n禁選舉人攜出選舉票。\n(二) 開票完畢應確實清點票數，並核\n對選舉人名冊之領票數，如有開\n出票數多於或少於領票數，應在\n投開票報告表其他有關事項欄內\n記載。\n驗票驗冊時發現投票數 (一) 主任管理員、主任監察員應督導\n加用餘票數等於選舉人 所有工作人員確實核對選舉人身\n數，但投票數少於領票 分，正確蓋章並正確發票（不可\n數。 兩票當成一票發出），嚴禁選舉\n人攜出選舉票，如有開出票數多\n於或少於領票數，應在投開票報\n告表其他有關事項欄內記載。\n(二) 主 任 管 理 員 填 寫 投 開 票 報 告 表\n時，應確實點算、加計各該票數\n並查對無誤後，正確記載。主任\n監察員亦應確實核對所填票數是\n否正確。\n投開票報告表兩組候選 (一) 主任管理員填寫投開票報告表候\n人得票數顛倒記載或候 選人得票數時，應確實點算候選\n選人得票數、有效票 人得票數並核對記票紙所記載之\n數、無效票數或用餘票 票數無誤後，再將每一候選人得\n數等，與實際票數不 票數確實填入各該候選人得票數\n符。 欄位。\n(二) 主任管理員及主任監察員須親自\n確認投開票報告表無誤後核章，\n不得有未核對或將印章交由他人\n於投開票報告表核章情形。\n(三) 主任監察員於投開票報告表簽章"}, {"p": 135, "t": "前，應確實核對主任管理員所填\n候選人得票數是否正確無誤。\n(四) 主任管理員會同主任監察員填寫\n投（開）票報告表填寫完畢後，\n請記票管理員及整票計票管理員\n協助檢視，以及由投（開）票報\n告表遞送工作人員協助依記票紙\n核對投開票報告表填寫內容是否\n有錯誤或錯置情形。\n填寫投開 投（開）票報告表塗改 直 轄 市 、 縣 （ 市 ） 選 舉 委 員 會 或 鄉\n票報告表 處疏未蓋章或僅由主任 （鎮、市、區）選務作業中心如發現\n管理員蓋章 前開塗改處疏未蓋章或僅由主任管理\n員蓋章之情形，應請主任管理員或主\n任監察員簽名或蓋章補正，俾作為確\n認投（開）票報告表塗改處確係由主\n任管理員會同主任監察員共同作成。\n八、包封 主任管理員將選舉票用 (一) 主任管理員包封選舉票時，應確\n餘票，誤置入個人隨身 實清點票袋封面記載之票數是否\n物品袋帶回家。 與票袋之票數相符。\n(二) 開票完畢，主任管理員會同主任\n監察員將選舉票及用品送回鄉\n（鎮、市、區）選務作業中心\n前，應確實檢查選舉票及用品有\n無遺漏。\n(三) 工作人員隨身用品應與選舉票及\n投開票應用物品等分開放置，以\n免誤裝選舉票及投開票應用物\n品。\n九、開票 投開票所作業完畢後， 投開票作業完畢後，主任管理員應督\n結束 工 作 人 員 離 開 投 開 票 導工作人員收拾、整理投開票所現場\n後作 所，未清除投開票所內 環境，佈置投開票所時張貼之宣導海\n業 外張貼之選舉公報、海 報、選舉公報等，均須妥善清理，現\n報。 場垃圾亦應整理妥當後帶離。\n十、工作 管 理 員 因 故 請 他 人 替 (一) 投開票所工作人員確有不能執行\n人員 代，惟該替代人員未曾 職務之情事時，應主動報請選務\n作業中心派員接替，不得逕自委"}, {"p": 136, "t": "參加投開票所工作人員 請他人替代。\n講習。 (二) 主任管理員發現報到人員與工作\n人員名冊不符時，應報請選務作\n業中心指派接替人員，非由選務\n作業中心指派者，不得允其擔任\n工作人員。\n管理員以投票日選務工 (一) 主 任 管 理 員 於 分 配 管 理 員 職 務\n作採輪流方式為由，無 時，應將擔任查驗國民身分證、\n法協助釐清投開票作業 領票處、圈票處及投票處管理員\n瑕疵之原因。 姓名予以記載，領票處管理員如\n有 2 至 3 人分別辦理，由何人擔\n任核對選舉人容貌、查對選舉人\n名冊與身分資料、指導選舉人於\n選舉人名冊簽章、發票等工作應\n予記明，其於中途較長時間換手\n者亦同。\n(二) 主任管理員於投票開始，前幾位\n選舉人依序領票時，應注意領票\n處管理員是否均依規定辦理。"}];

, {"p": 23, "t": "持戶政事務所核發之臨時證明書領票者，應於選舉人名冊或投票權人名冊備註欄註明「憑臨時證明書領票」"}], "note": ["健保卡、駕照只能作為「容貌難辨」時的第二證件輔助查驗，不能取代身分證（p.18）"], "pages": [18, 23]}, {"id": "A32", "cat": "身分查驗", "q": "選民本人和身分證照片長得不像怎麼辦？", "alt": ["照片不像", "臉對不起來", "看起來不是本人", "變性", "外觀和照片差很多", "性別認同", "照片不像本人", "認不出來", "臉跟照片差很多", "身分證照片太舊", "跨性別選民", "性別外觀不同"], "steps": ["核對容貌與身分證相片；戴口罩者請其暫時脫下", "容貌與相片難以辨別時，得請其提供第二證件（例如健保卡、駕照）輔助查驗", "應尊重其性別認同，不得驗身，不得以歧視、侮辱言行損害其人格尊嚴"], "basis": [{"p": 18, "t": "如選舉人或投票權人容貌與國民身分證所貼相片難以辨別者，得請其提供第二證件（例如：健保卡、駕照等）輔助查驗，不得對選舉人或投票權人進行驗身"}], "note": [], "pages": [18]}, {"id": "A33", "cat": "身分查驗", "q": "選民戴口罩要脫下來嗎？", "alt": ["戴口罩", "口罩要拿下來嗎", "不肯脫口罩", "不肯拿口罩", "口罩要脫嗎"], "steps": ["查驗身分時應請其暫時脫下口罩，核對容貌與身分證相片是否相符", "查驗身分證管理員與選舉人名冊管理員都要核對"], "basis": [{"p": 18, "t": "如遇有佩戴口罩之選舉人或投票權人，應請其暫時脫下口罩，以利核對"}, {"p": 126, "t": "應請選舉人脫下口罩，核對前來投票者容貌與其國民身分證相片是否相符"}], "note": [], "pages": [18, 21, 126]}, {"id": "A34", "cat": "身分查驗", "q": "選民年齡夠嗎？幾歲可以投票？", "alt": ["幾歲可以投票", "18 歲可以投選舉嗎", "未滿 20 歲", "年輕人只能投公投", "公投幾歲", "幾歲可以投", "十八歲可以投選舉嗎", "十九歲", "未滿二十歲"], "steps": ["選舉人須年滿 20 歲；公投投票權人須年滿 18 歲", "查驗身分證時應核對年齡", "18～19 歲者僅具公投投票權：引導沿選舉票領票動線直接到公投票領票處領票、圈票、投票"], "basis": [{"p": 18, "t": "選舉人年齡是否已滿 20 歲或投票權人年齡是否已滿 18 歲"}, {"p": 15, "t": "僅領公投票之投票權人，請工作人員引導沿選舉票領票動線，直接到公投票領票處領票、圈票、投票"}], "note": ["實際領票資格以名冊記載為準"], "pages": [15, 18]}, {"id": "A35", "cat": "身分查驗", "q": "選民的戶籍不在本投票所範圍（走錯投票所）？", "alt": ["走錯投票所", "不是這裡投", "戶籍地址不對", "鄰別不對", "不知道在哪裡投", "地址不是這個里", "不是這裡的選民", "不知道要去哪裡投"], "steps": ["檢查身分證反面村（里）、鄰別是否屬本投票所範圍，不屬者應委婉說明", "但 115 年 11 月 8 日後遷徙者、分赴兩地投票之原住民、投票所異動之原住民，戶籍地址可能不同，應以投票通知單或名冊記載為準", "未帶通知單時，可用內政部「投票所地點查詢系統」確認，必要時請主任管理員聯繫戶政事務所"], "basis": [{"p": 18, "t": "檢查國民身分證反面村（里）、鄰別，是否屬於該投票所所轄範圍，不屬於所轄範圍者，應予委婉說明"}, {"p": 19, "t": "查驗國民身分證管理員得利用內政部「投票所地點查詢系統」確認"}], "note": [], "pages": [18, 19]}, {"id": "A36", "cat": "身分查驗", "q": "選民沒帶投票通知單可以投票嗎？", "alt": ["沒帶通知單", "通知單忘了", "通知單不見", "通知單不見了", "沒收到通知單"], "steps": ["可以，通知單不是必要文件，憑本人國民身分證即可", "查驗身分證管理員得用內政部「投票所地點查詢系統」確認其是否屬本投票所", "必要時請主任管理員聯繫戶政事務所查詢"], "basis": [{"p": 19, "t": "倘選舉人或投票權人未帶通知單，查驗國民身分證管理員得利用內政部「投票所地點查詢系統」確認選舉人或投票權人是否確實屬於該投票所"}], "note": [], "pages": [19]}, {"id": "A37", "cat": "秩序", "q": "選民抽菸、吃檳榔或嚼口香糖要進來？", "alt": ["抽菸", "吃檳榔", "口香糖", "叼著菸", "嚼口香糖", "叼著香菸進來"], "steps": ["請其先熄滅煙火或吐掉檳榔、口香糖，再准其進入投票", "若不聽從，請警衛人員處理"], "basis": [{"p": 19, "t": "選舉人或投票權人吸煙、嚼食檳榔或口香糖，應請其先熄滅煙火或吐掉檳榔、口香糖，再准其進入投票所投票，若有不從，應請警衛人員處理"}], "note": [], "pages": [19]}, {"id": "A38", "cat": "優先投票", "q": "老人、孕婦、坐輪椅的人可以優先投票嗎？", "alt": ["優先投票", "禮讓", "老人家不能久站", "孕婦要排隊嗎", "輪椅族先投", "孕婦先投", "可以讓他先投嗎", "輪椅族優先", "身體不舒服想先投", "有人插隊說他是孕婦"], "steps": ["遇行動不便、乘坐輪椅、年長者、孕婦及其他不適久站者等候時，應洽商其他在場選舉人禮讓其優先進入", "主任管理員可視需要彈性調度 1 名管理員至投票所外協助優先投票及維持排隊秩序", "開始投票時應說明優先投票措施，入口張貼優先投票海報"], "basis": [{"p": 19, "t": "應洽商其他在場選舉人或投票權人，禮讓其優先進入投票所投票。主任管理員並視需要彈性調度 1 名管理員協助"}], "note": [], "pages": [6, 12, 19, 128]}, {"id": "A39", "cat": "優先投票", "q": "工作人員要回戶籍地投票可以插隊嗎？", "alt": ["其他投票所的工作人員來投票", "工作人員優先", "出示工作證來投票", "其他投票所工作人員來投票", "工作人員回來投票", "出示工作證插隊"], "steps": ["返回戶籍地投票之投開票所工作人員主動出示工作證者，應准其優先進入投票", "並向其他在場選舉人說明"], "basis": [{"p": 19, "t": "遇有返回戶籍地投票之投開票所工作人員主動出示工作證，應准其優先進入投票所投票，並向其他在場選舉人或投票權人說明"}], "note": [], "pages": [19]}, {"id": "A40", "cat": "投票所進出", "q": "選民帶小孩進投票所可以嗎？", "alt": ["帶小孩", "嬰兒可以進來嗎", "小朋友", "帶孩子", "幾歲小孩可以進", "國小學生可以陪", "抱嬰兒", "帶小朋友", "帶七歲的孩子", "國小學生可以進來嗎", "推嬰兒車進來"], "steps": ["選舉人照顧之 6 歲以下兒童可以進入投票所", "工作人員依事實認定；如有必要，得請選舉人舉證或備具戶籍資料證明", "6 歲以下兒童不得有妨礙或擾亂投票之行為", "主任管理員得視需要彈性調度 1 名管理員協助", "超過 6 歲的兒童不可進入"], "basis": [{"p": 20, "t": "選舉人或投票權人照顧之 6 歲以下兒童進入投票所，投票所工作人員應本於職權，依事實認定，如有必要，得由該選舉人或投票權人舉證"}, {"p": 12, "t": "遇有選舉人或投票權人照顧之 6 歲以下兒童進入投票所時，亦得彈性調度 1 名管理員予以協助"}], "note": [], "pages": [12, 19, 20, 128]}, {"id": "A41", "cat": "領票", "q": "選民可以用簽名或按指印領票嗎？", "alt": ["沒帶印章", "用簽名", "按指印", "按手印", "不會寫字", "英文簽名", "簽名看不懂", "用英文簽名", "蓋到證明人欄", "蓋錯欄位"], "steps": ["可以：領票時得簽名、蓋章或按指印", "簽名應請其簽可辨識之姓名全名；簽名與姓名不符、無法辨識或英文簽名，請其重簽", "未帶印章或不能簽名者按指印，原則用大拇指，指紋力求完整", "按指印時由管理員及監察員各 1 人立即於「證明人蓋章」欄共同蓋章證明（未帶印章的工作人員以簽名為之）", "請其用擦手紙巾擦淨印泥後再發票，避免弄污選票"], "basis": [{"p": 22, "t": "選舉人或投票權人以簽名領取選舉票或公投票時，應
