const QIDX = QA.map(it=>{const tf=new Map(),core=new Set();
  const add=(s,w,c)=>{for(const g of grams(s)){tf.set(g,(tf.get(g)||0)+w);if(c)core.add(g)}};
  add(it.q,2,1);it.alt.forEach(a=>add(a,2,1));add(it.cat,.6);add(it.steps.join(' '),.35);add(it.note.join(' '),.2);
  return {it,tf,core,len:[...tf.values()].reduce((a,b)=>a+b,0)}});
const QAVG=QIDX.reduce((a,b)=>a+b.len,0)/QIDX.length;
const QDF=new Map();for(const d of QIDX)for(const k of d.tf.keys())QDF.set(k,(QDF.get(k)||0)+1);
const QBY=Object.fromEntries(QA.map(x=>[x.id,x]));
function bmAll(q){
  const terms=queryTerms(q),N=QIDX.length;
  const orig=[...terms].filter(([,w])=>w>=1).map(([t])=>t);
  return QIDX.map(d=>{let s=0;for(const [t,w] of terms){const tf=d.tf.get(t);if(!tf)continue;const df=QDF.get(t);const idf=Math.log(1+(N-df+.5)/(df+.5));s+=w*idf*tf*2.2/(tf+1.2*(.25+.75*d.len/QAVG));}
    const cov=orig.length?orig.filter(t=>d.core.has(t)).length/orig.length:0;return {it:d.it,s,cov}});
}
function matchQA(q){
  const res=bmAll(q).filter(r=>r.s>0).sort((a,b)=>b.s-a.s);
  const top=res[0],second=res[1]?.s||0;const r=top?top.s/(second||1):0;const strong=!!top&&((top.cov>=.5&&top.s>=8&&r>=1.15)||(r>=1.5&&top.s>=10));
  return {list:res.slice(0,5),strong};
}
/* semantic + keyword: sem[i] is cosine similarity to item i's closest phrasing */
function hybridQA(q,sem){
  const all=bmAll(q);const mb=Math.max(...all.map(r=>r.s))||1;
  const sc=all.map((r,i)=>({it:r.it,s:sem[i]+.1*r.s/mb,c:sem[i]})).sort((a,b)=>b.s-a.s);
  return {list:sc.slice(0,5),strong:sc[0].c>=.7&&sc[0].s-sc[1].s>=.06};
}
function qaCard(it,label){
  const li=a=>a.map(x=>`<li>${linkPages(esc(x))}</li>`).join('');
  return `<div class="card qa"><p class="qa-tag">${label||'預先整理答案｜依手冊'}</p><h2>${esc(it.q)}</h2>
  <h3>立即處置</h3><ol>${li(it.steps)}</ol>
  ${it.note.length?`<h3>注意</h3><ul>${li(it.note)}</ul>`:''}
  <h3>手冊依據</h3><ul class="basis">${it.basis.map(b=>`<li>${pgChip(b.p)}「${esc(b.t)}」</li>`).join('')}</ul>
  <div class="rel">相關頁：${[...new Set(it.pages)].sort((a,b)=>a-b).map(p=>pgChip(p)).join('')}</div></div>`;
}
function showQA(q,m){
  const box=$('qaBox');box.hidden=false;
  const others=(m.strong?m.list.slice(1,4):m.list.slice(0,4));
  const alts=others.length?`<p class="label" style="margin-top:12px">${m.strong?'其他可能情境':'可能相關的情境（點選查看）'}</p><div class="alts">${others.map(r=>`<button type="button" class="chip" data-qa="${r.it.id}">${esc(r.it.q)}</button>`).join('')}</div>`:'';
  box.innerHTML=(m.strong?qaCard(m.list[0].it,'最接近的情境｜預先依手冊整理'):'')+alts;
  if(!m.strong&&!others.length)box.hidden=true;
  return m.strong;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-qa]');if(!b)return;e.preventDefault();const it=QBY[b.dataset.qa];if(!it)return;
  if(!$('reviewBox').hidden){location.hash='';}
  $('startBox').hidden=true;$('qaBox').hidden=false;$('qaBox').innerHTML=qaCard(it);window.scrollTo({top:0})});

/* ---------- review mode (#review) ---------- */
function renderReview(){
  const st=store.get('review',{});const box=$('reviewBox');
  const ok=QA.filter(x=>st[x.id]?.s==='ok').length,fix=QA.filter(x=>st[x.id]?.s==='fix').length;
  const cats=[...new Set(QA.map(x=>x.cat))];
  box.innerHTML=`<div class="card"><div class="review-head"><div><b>問答庫審閱</b>（共 ${QA.length} 題）<br><span id="rvCount" style="color:var(--muted);font-size:13.5px">已確認 ${ok}｜需修改 ${fix}｜未審 ${QA.length-ok-fix}</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="rvCopy" type="button">複製需修改清單</button><button class="btn ghost" id="rvExit" type="button">離開審閱</button></div></div>
    <p class="note" id="rvMsg">逐題對照紅色頁碼的原頁，正確按「正確」，有誤按「需修改」並寫下原因。紀錄只存在這支手機的瀏覽器。</p></div>`+
  cats.map(c=>`<p class="cat">${esc(c)}</p>`+QA.filter(x=>x.cat===c).map(it=>{const r=st[it.id]||{};return `<details class="rv" data-s="${r.s||''}" id="rv-${it.id}"><summary><small>${it.id}</small>${esc(it.q)}</summary>${qaCard(it,'')}
    <div class="rv-acts"><button type="button" class="ok" data-rv="${it.id}" data-v="ok" aria-pressed="${r.s==='ok'}">正確</button><button type="button" class="fix" data-rv="${it.id}" data-v="fix" aria-pressed="${r.s==='fix'}">需修改</button></div>
    <textarea id="rvn-${it.id}" data-rvn="${it.id}" placeholder="需修改的原因（選填）">${esc(r.n||'')}</textarea></details>`}).join('')).join('');
}
$('reviewBox').addEventListener('click',async e=>{
  const b=e.target.closest('[data-rv]');
  if(b){const st=store.get('review',{});const id=b.dataset.rv;st[id]={...(st[id]||{}),s:st[id]?.s===b.dataset.v?'':b.dataset.v};store.set('review',st);
    const d=$('rv-'+id);d.dataset.s=st[id].s;d.querySelectorAll('[data-rv]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===st[id].s));
    const ok=QA.filter(x=>st[x.id]?.s==='ok').length,fix=QA.filter(x=>st[x.id]?.s==='fix').length;$('rvCount').textContent=`已確認 ${ok}｜需修改 ${fix}｜未審 ${QA.length-ok-fix}`;return}
  if(e.target.id==='rvExit'){location.hash='';return}
  if(e.target.id==='rvCopy'){const st=store.get('review',{});
    const txt=QA.filter(x=>st[x.id]?.s==='fix').map(x=>`${x.id}｜${x.q}｜${st[x.id].n||'（未填原因）'}`).join('\n')||'（目前沒有標記需修改的題目）';
    try{await navigator.clipboard.writeText(txt);$('rvMsg').textContent='已複製，可直接貼給 Claude 修改。'}catch{$('rvMsg').textContent=txt}}
});
$('reviewBox').addEventListener('input',e=>{const id=e.target.dataset?.rvn;if(!id)return;const st=store.get('review',{});st[id]={...(st[id]||{}),n:e.target.value};store.set('review',st)});
function route(){const rv=location.hash==='#review';
  $('reviewBox').hidden=!rv;['startBox','qaBox','answerBox','hitsBox','histBox','tocBox'].forEach(id=>{if(rv)$(id).hidden=true});
  if(rv){renderReview();window.scrollTo({top:0})}else{$('tocBox').hidden=false;$('startBox').hidden=!!$('qaBox').innerHTML&&!$('qaBox').hidden;renderHist()}}
window.addEventListener('hashchange',route);

/* ---------- UI helpers ---------- */
function pgChip(a,b){const n=+a;const lbl=b&&b!==a?`p.${a}–${b}`:`p.${a}`;return `<button type="button" class="pg" data-p="${n}">${lbl}</button>`}
function linkPages(html){
  return html
    .replace(/〔\s*(?:p\.?|第)?\s*(\d{1,3})\s*(?:[–\-~～至]\s*(\d{1,3}))?\s*頁?\s*〕/gi,(m,a,b)=>valid(a)?pgChip(a,b):m)
    .replace(/第\s*(\d{1,3})\s*(?:[–\-~～至]\s*(\d{1,3})\s*)?頁/g,(m,a,b)=>valid(a)?pgChip(a,b):m)
    .replace(/(?<![\w.])p\.\s?(\d{1,3})(?:[–\-](\d{1,3}))?/g,(m,a,b)=>valid(a)?pgChip(a,b):m);
}
function valid(n){n=+n;return n>=1&&n<=PAGES.length}
function md(src){
  const lines=src.replace(/\r/g,'').split('\n'); let html='',list=null;
  const close=()=>{if(list){html+=`</${list}>`;list=null}};
  const inline=s=>linkPages(esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'));
  for(let raw of lines){const l=raw.trim();
    if(!l){close();continue}
    let m;
    if((m=l.match(/^#{1,4}\s*(.+)$/))||(m=l.match(/^\*\*([^*]+)\*\*[:：]?$/))){close();html+=`<h3>${inline(m[1])}</h3>`;continue}
    if((m=l.match(/^\d+[.、)]\s*(.+)$/))){if(list!=='ol'){close();html+='<ol>';list='ol'}html+=`<li>${inline(m[1])}</li>`;continue}
    if((m=l.match(/^[-*•・]\s*(.+)$/))){if(list!=='ul'){close();html+='<ul>';list='ul'}html+=`<li>${inline(m[1])}</li>`;continue}
    close();html+=`<p>${inline(l)}</p>`;
  }
  close();return html;
}

/* ---------- page sheet ---------- */
let cur=1,view='img';
function openPage(p){cur=Math.min(Math.max(1,+p),PAGES.length);$('sheet').hidden=false;document.body.style.overflow='hidden';renderPage()}
function renderPage(){
  $('sheetNo').textContent=`第 ${cur} 頁`;$('sheetSec').textContent=secOf(cur);
  $('pimg').src=`pages/p${cur}.jpg`;$('pimg').alt=`手冊第 ${cur} 頁原頁`;
  $('ptxt').textContent=PAGES[cur-1].t;
  $('pimg').hidden=view!=='img';$('ptxt').hidden=view!=='txt';
  $('vImg').setAttribute('aria-pressed',view==='img');$('vTxt').setAttribute('aria-pressed',view==='txt');
  $('sheetBody').scrollTop=0;$('prev').disabled=cur<=1;$('next').disabled=cur>=PAGES.length;
}
$('pimg').onerror=()=>{if(view==='img'){view='txt';renderPage()}};
$('prev').onclick=()=>{cur--;renderPage()};$('next').onclick=()=>{cur++;renderPage()};
$('close').onclick=()=>{$('sheet').hidden=true;document.body.style.overflow=''};
$('vImg').onclick=()=>{view='img';renderPage()};$('vTxt').onclick=()=>{view='txt';renderPage()};
document.addEventListener('keydown',e=>{if($('sheet').hidden)return;if(e.key==='Escape')$('close').click();if(e.key==='ArrowLeft'&&cur>1)$('prev').click();if(e.key==='ArrowRight'&&cur<PAGES.length)$('next').click()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){e.preventDefault();openPage(b.dataset.p)}});

/* ---------- best passages (offline, no AI) ---------- */
let lastQ='',lastHits=[];
const MARK=/^(（[一二三四五六七八九十]+）|[一二三四五六七八九十]+、|\d+、|[０-９]+、|（\d+）|（[０-９]+）|[１-９]、)/;
function passage(p,terms){
  const lines=PAGES[p-1].t.split('\n');let best=-1,bi=0;
  lines.forEach((l,i)=>{let c=0;for(const g of grams(l)) if(terms.has(g)) c+=terms.get(g);if(c>best){best=c;bi=i}});
  let s=bi;for(let k=0;k<6&&s>0&&!MARK.test(lines[s]);k++)s--;
  let e=bi+1;while(e<lines.length&&e-s<10&&!MARK.test(lines[e]))e++;
  while(e<lines.length&&e-s<10&&lines.slice(s,e).join('').length<120)e++;
  return {html:highlight(lines.slice(s,e).join(''),terms),more:e<lines.length||s>0};
}
function showBest(q,top,terms){
  const box=$('answerBox');box.hidden=false;
  if(!top.length){box.innerHTML='';box.hidden=true;return}
  const items=top.slice(0,3).map(r=>{const ps=passage(r.p,terms);return `<div class="psg"><div class="psg-h">${pgChip(r.p)}<span>${esc(secOf(r.p))}</span></div><p>${ps.html}</p></div>`}).join('');
  box.innerHTML=`<div class="card answer"><p class="q">${esc(q)}</p><p class="label" style="margin-top:4px">手冊最相關段落</p><div class="body">${items}</div><p class="note">點紅色頁碼可看手冊原頁。若段落沒有涵蓋你的狀況，請看下方其他相關頁，或聯繫鄉（鎮、市、區）選務作業中心。</p></div>`;
}

/* ---------- flow ---------- */
function run(q){
  q=q.trim();if(!q)return;lastQ=q;
  $('q').value=q;$('q').blur();$('q').style.height='auto';$('q').style.height=Math.min($('q').scrollHeight,140)+'px';
  if(location.hash==='#review'){history.replaceState(null,'',location.pathname+location.search);$('reviewBox').hidden=true;$('tocBox').hidden=false}
  const {terms,top}=search(q,8);lastHits=top;
  const strong=showQA(q,matchQA(q));
  $('startBox').hidden=true;
  $('hitsBox').hidden=false;
  $('hits').innerHTML=top.length?top.slice(0,6).map(r=>`<button type="button" class="hit" data-p="${r.p}"><div class="no">${r.p}<span>頁</span></div><div style="min-width:0"><div class="sec">${esc(secOf(r.p))}</div><div class="snip">${snippet(r.p,terms)}</div></div></button>`).join(''):'<p class="empty">沒有找到相符的頁面，請換個說法，或展開下方目錄翻頁。</p>';
  const h=store.get('hist',[]).filter(x=>x!==q);h.unshift(q);store.set('hist',h.slice(0,12));renderHist();
  if(!strong) showBest(q,top,terms); else {$('answerBox').hidden=true;$('answerBox').innerHTML=''}
  window.scrollTo({top:0});
  window.SEM?.rerank?.(q);
}
function renderHist(){
  const h=store.get('hist',[]);$('histBox').hidden=!h.length;
  $('hist').innerHTML=h.map(x=>`<button type="button" data-q="${esc(x)}">${esc(x)}</button>`).join('');
}
$('hist').onclick=e=>{const b=e.target.closest('[data-q]');if(b)run(b.dataset.q)};
$('chips').innerHTML=EXAMPLES.map(x=>`<button type="button" class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('');
$('chips').onclick=e=>{const b=e.target.closest('[data-q]');if(b)run(b.dataset.q)};
renderHist();route();
$('toc').innerHTML=SECTIONS.map(s=>`<button type="button" data-p="${s[0]}"><span>${esc(s[2])}</span><b>p.${s[0]}</b></button>`).join('');
$('askForm').addEventListener('submit',e=>{e.preventDefault();run($('q').value)});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();run($('q').value)}});
$('q').addEventListener('input',()=>{const t=$('q');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px';if(!t.value.trim()){$('startBox').hidden=false}});
renderHist();

/* speech: Safari / Chrome Web Speech API; otherwise the iPhone keyboard mic */
(()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  const mic=$('mic');mic.hidden=false;$('hint').textContent='按麥克風說出狀況，講完會自動查詢；也可以按鍵盤上的麥克風或直接打字。';
  let rec=null,base='',finalTxt='';
  mic.onclick=()=>{
    if(rec){rec.stop();return}
    try{rec=new SR()}catch{mic.hidden=true;return}
    rec.lang='zh-TW';rec.interimResults=true;rec.continuous=false;
    base='';finalTxt='';$('q').value='';mic.classList.add('on');
    rec.onresult=ev=>{let interim='';finalTxt='';for(const r of ev.results){if(r.isFinal)finalTxt+=r[0].transcript;else interim+=r[0].transcript}$('q').value=finalTxt+interim};
    rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){$('hint').textContent='麥克風未授權：請改用鍵盤上的麥克風，或到設定允許 Safari 使用麥克風。'}};
    rec.onend=()=>{mic.classList.remove('on');rec=null;const v=$('q').value.trim();if(v)run(v)};
    try{rec.start()}catch{mic.classList.remove('on');rec=null}
  };
})();

/* offline cache */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').then(()=>{
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='cached'){const n=$('offline');if(n)n.textContent='已可離線使用（含 136 頁原頁圖片）'}});
  }).catch(()=>{});
}
</script>
<script type="module">
/* offline semantic matching: bge-small-zh (quantized) via transformers.js, all files served from this site */
import { pipeline, env } from './vendor/transformers.min.js';
const st=document.getElementById('semStatus');
const say=s=>{if(st)st.textContent=s};
say('語意比對載入中…（第一次約 35 MB）');
try{
  env.allowRemoteModels=false;env.allowLocalModels=true;env.localModelPath='models/';env.useBrowserCache=false;
  env.backends.onnx.wasm.wasmPaths='vendor/';env.backends.onnx.wasm.numThreads=1;env.backends.onnx.wasm.proxy=false;
  const [ext,buf]=await Promise.all([
    pipeline('feature-extraction','Xenova/bge-small-zh-v1.5',{quantized:true}),
    fetch('qa_emb.bin').then(r=>{if(!r.ok)throw new Error('emb');return r.arrayBuffer()})]);
  const [n,dim]=new Uint32Array(buf,0,2);
  if(n!==QA.reduce((a,x)=>a+1+x.alt.length,0))throw new Error('embedding count mismatch');
  const scales=new Float32Array(buf,8,n),own=new Uint16Array(buf,8+4*n,n),data=new Int8Array(buf,8+6*n,n*dim);
  const score=v=>{const best=new Float32Array(QA.length).fill(-1);
    for(let k=0;k<n;k++){let s=0;const o=k*dim;for(let d=0;d<dim;d++)s+=v[d]*data[o+d];s*=scales[k];if(s>best[own[k]])best[own[k]]=s}
    return best};
  const embed=async q=>(await ext([q],{pooling:'cls',normalize:true})).data;
  await embed('暖機');
  window.SEM={ready:true,rerank:async q=>{
    const v=await embed(q);if(q!==lastQ)return;
    const m=hybridQA(q,score(v));const strong=showQA(q,m);
    if(strong){$('answerBox').hidden=true;$('answerBox').innerHTML=''}else{const {terms,top}=search(q,8);showBest(q,top,terms)}
  }};
  say('語意比對已啟用');
  if(lastQ)window.SEM.rerank(lastQ);
}catch(e){console.warn('semantic matching unavailable',e);say('語意比對無法在此裝置啟用，改用關鍵字比對')}
</script>
