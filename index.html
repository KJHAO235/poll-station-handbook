  [/搬家|遷|戶籍/, '戶籍 選舉人名冊'],
  [/幫忙投|代投|幫他投|代圈|協助圈/, '眼同協助 代為圈投 家屬 陪同之人'],
  [/外國|護照/, '護照 國民身分證'],
  [/報告表|填錯|填寫/, '投開票報告表 填載'],
  [/原住民/, '原住民 選舉票'],
  [/公投|公民投票/, '公投票 投票權人'],
  [/參觀|觀眾|旁觀/, '參觀 開票 參觀席'],
  [/票箱|票匭/, '投票匭'],
  [/簾|遮屏/, '遮屏 布簾 圈票處'],
  [/上廁所|廁所|離開|吃飯|休息|換班/, '離開 遞補 洗手間 告知 紀錄簿'],
  [/監察員/, '監察員'],
  [/警察|警衛/, '警衛人員 警察'],
  [/選民|民眾|投票的人/, '選舉人 投票權人'],
  [/開票/, '開票 唱票 檢票'],
  [/領票|發票|發錯|多發|漏發/, '發票 領票 誤發 漏發'],
  [/數字|票數|不符|對不上|算錯/, '票數 不符 領票數 投票數 用餘票'],
  [/通知單/, '投票通知單'],
  [/佈置|布置|場地/, '佈置 投票所 圖例'],
  [/圈選工具|印泥|打印台|戳/, '圈選工具 打印台'],
];
const STOP = new Set(['怎麼','麼辦','怎樣','可以','以嗎','如果','要怎','應該','該怎','什麼','請問','一下','現在','這個','那個','有人','的話','一個','嗎？','辦？']);
function grams(s){
  const out=[]; const re=/[㐀-鿿]+|[a-z0-9]+/gi; let m;
  while((m=re.exec(s))){const w=m[0];
    if(/^[㐀-鿿]/.test(w)){ if(w.length===1) out.push(w); else for(let i=0;i<w.length-1;i++) out.push(w.slice(i,i+2)); }
    else out.push(w.toLowerCase());}
  return out;
}
function secOf(p){return SECTIONS.filter(s=>p>=s[0]&&p<=s[1]).map(s=>s[2]).join('／')||''}
const IDX = PAGES.map(pg=>{const tf=new Map();const g=grams(pg.t+' '+secOf(pg.p)+' '+secOf(pg.p));for(const x of g)tf.set(x,(tf.get(x)||0)+1);return {p:pg.p,tf,len:g.length}});
const AVG = IDX.reduce((a,b)=>a+b.len,0)/IDX.length;
const DF = new Map(); for(const d of IDX) for(const k of d.tf.keys()) DF.set(k,(DF.get(k)||0)+1);
function queryTerms(q){
  const w=new Map();
  for(const g of grams(q)) if(!STOP.has(g)) w.set(g,Math.max(w.get(g)||0,1));
  for(const [re,exp] of SYN) if(re.test(q)) for(const g of grams(exp)) w.set(g,Math.max(w.get(g)||0,.75));
  return w;
}
function search(q,k=8){
  const terms=queryTerms(q); const N=IDX.length;
  const res=IDX.map(d=>{let s=0;for(const [t,w] of terms){const tf=d.tf.get(t);if(!tf)continue;const df=DF.get(t);const idf=Math.log(1+(N-df+.5)/(df+.5));s+=w*idf*tf*2.2/(tf+1.2*(.25+.75*d.len/AVG));}return {p:d.p,s}});
  return {terms,top:res.filter(r=>r.s>0).sort((a,b)=>b.s-a.s).slice(0,k)};
}
function snippet(p,terms){
  const lines=PAGES[p-1].t.split('\n'); let best=0,bi=0;
  lines.forEach((l,i)=>{let c=0;for(const g of grams(l)) if(terms.has(g)) c+=terms.get(g);if(c>best){best=c;bi=i}});
  const s=lines.slice(Math.max(0,bi-1),bi+2).join('');
  return highlight(s,terms);
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function highlight(s,terms){
  const mark=new Array(s.length).fill(false);
  for(let i=0;i<s.length-1;i++){const g=s.slice(i,i+2);if(terms.has(g)&&terms.get(g)>=.75){mark[i]=mark[i+1]=true}}
  let out='',on=false;for(let i=0;i<s.length;i++){if(mark[i]&&!on){out+='<mark>';on=true}if(!mark[i]&&on){out+='</mark>';on=false}out+=esc(s[i])}
  return out+(on?'</mark>':'');
}

/* ---------- UI helpers ---------- */
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
function pgChip(a,b){const n=+a;const lbl=b&&b!==a?`p.${a}–${b}`:`p.${a}`;return `<button type="button" class="pg" data-p="${n}">${lbl}</button>`}
function linkPages(html){
  return html
    .replace(/〔\s*(?:p\.?|第)?\s*(\d{1,3})\s*(?:[–\-~～至]\s*(\d{1,3}))?\s*頁?\s*〕/gi,(m,a,b)=>valid(a)?pgChip(a,b):m)
    .replace(/第\s*(\d{1,3})\s*(?:[–\-~～至]\s*(\d{1,3})\s*)?頁/g,(m,a,b)=>valid(a)?pgChip(a,b):m)
    .replace(/(?<![\w.])p\.\s?(\d{1,3})(?:[–\-](\d{1,3}))?/g,(m,a,b)=>valid(a)?pgChip(a,b):m);
}
function valid(n){n=+n;return n>=1&&n<=PAGES.length}
function md(src){
  const lines=src.replace(/\r/g,'').split('\n'); let html='',list=null;
  const close=()=>{if(list){html+=`</${list}>`;list=null}};
  const inline=s=>linkPages(esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'));
  for(let raw of lines){const l=raw.trim();
    if(!l){close();continue}
    let m;
    if((m=l.match(/^#{1,4}\s*(.+)$/))||(m=l.match(/^\*\*([^*]+)\*\*[:：]?$/))){close();html+=`<h3>${inline(m[1])}</h3>`;continue}
    if((m=l.match(/^\d+[.、)]\s*(.+)$/))){if(list!=='ol'){close();html+='<ol>';list='ol'}html+=`<li>${inline(m[1])}</li>`;continue}
    if((m=l.match(/^[-*•・]\s*(.+)$/))){if(list!=='ul'){close();html+='<ul>';list='ul'}html+=`<li>${inline(m[1])}</li>`;continue}
    close();html+=`<p>${inline(l)}</p>`;
  }
  close();return html;
}

/* ---------- page sheet ---------- */
let cur=1,view='img';
function openPage(p){cur=Math.min(Math.max(1,+p),PAGES.length);$('sheet').hidden=false;document.body.style.overflow='hidden';renderPage()}
function renderPage(){
  $('sheetNo').textContent=`第 ${cur} 頁`;$('sheetSec').textContent=secOf(cur);
  $('pimg').src=`pages/p${cur}.jpg`;$('pimg').alt=`手冊第 ${cur} 頁原頁`;
  $('ptxt').textContent=PAGES[cur-1].t;
  $('pimg').hidden=view!=='img';$('ptxt').hidden=view!=='txt';
  $('vImg').setAttribute('aria-pressed',view==='img');$('vTxt').setAttribute('aria-pressed',view==='txt');
  $('sheetBody').scrollTop=0;$('prev').disabled=cur<=1;$('next').disabled=cur>=PAGES.length;
}
$('pimg').onerror=()=>{if(view==='img'){view='txt';renderPage()}};
$('prev').onclick=()=>{cur--;renderPage()};$('next').onclick=()=>{cur++;renderPage()};
$('close').onclick=()=>{$('sheet').hidden=true;document.body.style.overflow=''};
$('vImg').onclick=()=>{view='img';renderPage()};$('vTxt').onclick=()=>{view='txt';renderPage()};
document.addEventListener('keydown',e=>{if($('sheet').hidden)return;if(e.key==='Escape')$('close').click();if(e.key==='ArrowLeft'&&cur>1)$('prev').click();if(e.key==='ArrowRight'&&cur<PAGES.length)$('next').click()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){e.preventDefault();openPage(b.dataset.p)}});

/* ---------- best passages (offline, no AI) ---------- */
const MARK=/^(（[一二三四五六七八九十]+）|[一二三四五六七八九十]+、|\d+、|[０-９]+、|（\d+）|（[０-９]+）|[１-９]、)/;
function passage(p,terms){
  const lines=PAGES[p-1].t.split('\n');let best=-1,bi=0;
  lines.forEach((l,i)=>{let c=0;for(const g of grams(l)) if(terms.has(g)) c+=terms.get(g);if(c>best){best=c;bi=i}});
  let s=bi;for(let k=0;k<6&&s>0&&!MARK.test(lines[s]);k++)s--;
  let e=bi+1;while(e<lines.length&&e-s<10&&!MARK.test(lines[e]))e++;
  while(e<lines.length&&e-s<10&&lines.slice(s,e).join('').length<120)e++;
  return {html:highlight(lines.slice(s,e).join(''),terms),more:e<lines.length||s>0};
}
function showBest(q,top,terms){
  const box=$('answerBox');box.hidden=false;
  if(!top.length){box.innerHTML='';box.hidden=true;return}
  const items=top.slice(0,3).map(r=>{const ps=passage(r.p,terms);return `<div class="psg"><div class="psg-h">${pgChip(r.p)}<span>${esc(secOf(r.p))}</span></div><p>${ps.html}</p></div>`}).join('');
  box.innerHTML=`<div class="card answer"><p class="q">${esc(q)}</p><p class="label" style="margin-top:4px">手冊最相關段落</p><div class="body">${items}</div><p class="note">點紅色頁碼可看手冊原頁。若段落沒有涵蓋你的狀況，請看下方其他相關頁，或聯繫鄉（鎮、市、區）選務作業中心。</p></div>`;
}

/* ---------- flow ---------- */
function run(q){
  q=q.trim();if(!q)return;lastQ=q;
  $('q').value=q;$('q').blur();$('q').style.height='auto';$('q').style.height=Math.min($('q').scrollHeight,140)+'px';
  const {terms,top}=search(q,8);lastHits=top;
  $('startBox').hidden=true;
  $('hitsBox').hidden=false;
  $('hits').innerHTML=top.length?top.slice(0,6).map(r=>`<button type="button" class="hit" data-p="${r.p}"><div class="no">${r.p}<span>頁</span></div><div style="min-width:0"><div class="sec">${esc(secOf(r.p))}</div><div class="snip">${snippet(r.p,terms)}</div></div></button>`).join(''):'<p class="empty">沒有找到相符的頁面，請換個說法，或展開下方目錄翻頁。</p>';
  const h=store.get('hist',[]).filter(x=>x!==q);h.unshift(q);store.set('hist',h.slice(0,12));renderHist();
  showBest(q,top,terms);
  window.scrollTo({top:0});
}
function renderHist(){
  const h=store.get('hist',[]);$('histBox').hidden=!h.length;
  $('hist').innerHTML=h.map(x=>`<button type="button" data-q="${esc(x)}">${esc(x)}</button>`).join('');
}
$('hist').onclick=e=>{const b=e.target.closest('[data-q]');if(b)run(b.dataset.q)};
$('chips').innerHTML=EXAMPLES.map(x=>`<button type="button" class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('');
$('chips').onclick=e=>{const b=e.target.closest('[data-q]');if(b)run(b.dataset.q)};
$('toc').innerHTML=SECTIONS.map(s=>`<button type="button" data-p="${s[0]}"><span>${esc(s[2])}</span><b>p.${s[0]}</b></button>`).join('');
$('askForm').addEventListener('submit',e=>{e.preventDefault();run($('q').value)});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();run($('q').value)}});
$('q').addEventListener('input',()=>{const t=$('q');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px';if(!t.value.trim()){$('startBox').hidden=false}});
renderHist();

/* speech: Safari / Chrome Web Speech API; otherwise the iPhone keyboard mic */
(()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  const mic=$('mic');mic.hidden=false;$('hint').textContent='按麥克風說出狀況，講完會自動查詢；也可以按鍵盤上的麥克風或直接打字。';
  let rec=null,base='',finalTxt='';
  mic.onclick=()=>{
    if(rec){rec.stop();return}
    try{rec=new SR()}catch{mic.hidden=true;return}
    rec.lang='zh-TW';rec.interimResults=true;rec.continuous=false;
    base='';finalTxt='';$('q').value='';mic.classList.add('on');
    rec.onresult=ev=>{let interim='';finalTxt='';for(const r of ev.results){if(r.isFinal)finalTxt+=r[0].transcript;else interim+=r[0].transcript}$('q').value=finalTxt+interim};
    rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){$('hint').textContent='麥克風未授權：請改用鍵盤上的麥克風，或到設定允許 Safari 使用麥克風。'}};
    rec.onend=()=>{mic.classList.remove('on');rec=null;const v=$('q').value.trim();if(v)run(v)};
    try{rec.start()}catch{mic.classList.remove('on');rec=null}
  };
})();

/* offline cache */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').then(()=>{
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='cached'){const n=$('offline');if(n)n.textContent='已可離線使用（含 136 頁原頁圖片）'}});
  }).catch(()=>{});
}
